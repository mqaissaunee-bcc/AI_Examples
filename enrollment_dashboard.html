          <div class="pot-menu" id="potMenu" role="listbox" aria-labelledby="titlePotPill" style="display:none"></div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="btn" id="disciplineBtn" type="button" style="display:none">≡ Disciplines</button>
      <button class="btn" id="refreshBtn" type="button" title="Reload latest data from GitHub">↻ Refresh</button>
      <button class="btn" id="themeBtn" type="button">◐ Theme</button>
      <button class="btn ghost" id="printBtn" type="button">⎙ Print</button>
    </div>
  </header>

  <div class="subline" id="subline">
    <span id="reportDate">No data loaded</span>
    <span class="pipe">|</span>
    <span id="disciplineSummary">No disciplines selected</span>
    <span class="pipe">|</span>
    <span id="snapshotCount">0 snapshots</span>
    <span class="pipe">|</span>
    <button type="button" id="whatsNewBtn" class="whats-new-btn" title="See what's new since your last visit"><span class="wn-icon" aria-hidden="true">?</span> What's new <span class="wn-pill" id="whatsNewPill">NEW</span></button>
  </div>

  <!-- v5.33.6: The "non-default view" amber banner was removed. In a
       multi-term dashboard every term's default is legitimate and every
       POT selection is intentional — the banner's "warning" treatment
       belonged to the single-term era and became misleading in multi-term
       (false positives on Fall 15W, broken navigation on term switches). -->

  <main id="dashboard"></main>

  <footer>
    <span>Enrollment Dashboard · Generic faculty tool · v5.33.7</span>
    <span id="footerStamp"></span>
    <span class="footer-note">Special projects (-295) and internships (-299) are excluded from all views and totals.</span>
  </footer>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>
<div id="goalCelebration" class="goal-celebration" aria-hidden="true">
  <div id="goalCelebrationToast" class="goal-celebration-toast">🎯 Fall Goal Met</div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================================
   * CONFIGURATION
   * =========================================================================
   * The dashboard loads enrollment reports from multiple term folders, each
   * under data/<termcode>/ (e.g. data/26FA/, data/27WN/, data/27SP/). The
   * top-level data/terms.json file lists which terms are active:
   *   { "terms": ["26FA", "27WN", "27SP"] }
   * For each listed term, the dashboard fetches data/<termcode>/manifest.json
   * and its referenced snapshot files. All loaded data goes into the same
   * state.snapshots array, tagged with the term code; the active term + POT
   * selection determines what's visible.
   *
   * BACKWARD COMPATIBILITY: if terms.json is missing or empty, falls back to
   * loading data/26FA/ (the pre-v5.33 behavior).
   */
  const DATA_ROOT = 'data/';
  const TERMS_INDEX_FILE = 'terms.json';
  const MANIFEST_FILE = 'manifest.json';

  // Legacy constant used only by error messages that reference the pre-v5.33
  // "single data folder" model. Kept so error strings don't crash.
  const DATA_PATH = DATA_ROOT + '26FA/';

  /* =========================================================================
   * STATE & STORAGE
   * ========================================================================= */

  const STORAGE = {
    THEME: 'enroll-theme',
    DISCIPLINES: 'enroll-disciplines',
    PRESETS: 'enroll-presets',
    SNAPSHOTS: 'enroll-snapshots',
    INSTITUTE_INDEX: 'enroll-inst-idx',
    BENCHMARKS: 'enroll-benchmarks',
    CARD_EXPANSION: 'enroll-card-expansion',
    GROUPED_VIEW: 'enroll-grouped-view',
    DISCIPLINE_ROW_EXPANSION: 'enroll-disc-row-expansion',
    WHATS_NEW_SEEN: 'enroll-whats-new-seen',
    ACTIVE_PART_OF_TERM: 'enroll-active-part-of-term',
    ACTIVE_TERM: 'enroll-active-term',  // v5.33: term code (e.g. '26FA')
    MOVER_WINDOW: 'enroll-mover-window',
    // v5.33.3: Bumped from 'enroll-goal-met-celebrated' to 'enroll-goal-met-celebrated-v2'
    // to abandon any value stored during a false-positive celebration fired
    // by v5.33 / v5.33.1 / v5.33.2 (where aggregateCollegeFTE summed across
    // all loaded terms). Any legitimate future "goal met" will fire fresh.
    GOAL_MET_CELEBRATED: 'enroll-goal-met-celebrated-v2',
  };

  // -----------------------------------------------------------------------
  // "What's new" panel
  // -----------------------------------------------------------------------
  // The badge appears when localStorage[WHATS_NEW_SEEN] !== WHATS_NEW_VERSION.
  // Opening the modal sets the storage value, dismissing the badge. To
  // re-announce after a future feature release, bump WHATS_NEW_VERSION and
  // update WHATS_NEW_CONTENT. Keep content brief — this is a release note,
  // not a manual.
  //
  // Returning-reader treatment: when a user has previously dismissed an
  // older version (so localStorage[SEEN] is set but doesn't match), the
  // pill renders as "UPDATED" instead of "NEW", and the modal auto-opens
  // once on first load. First-time visitors (no stored value) see "NEW"
  // with no auto-open — the badge alone is their introduction.
  const WHATS_NEW_VERSION = '2026-10-25';
  const WHATS_NEW_CONTENT = `
    <ul>
      <li><strong>Winterim 2027 and Spring 2027 are now visible.</strong> The sub-term picker in the title now shows all three semesters together, grouped by lifecycle: what's in session, what's coming up, what's complete. Click any sub-term to switch. Fall 2026 options still work the same way.</li>
      <li><strong>Lifecycle badges on every option.</strong> Each sub-term shows where it is in its cycle — IN SESSION, UPCOMING, ENDING SOON, or COMPLETE — so you always know what to focus on. Completed sub-terms are dimmed and shown at the bottom.</li>
      <li><strong>Dynamic title bar.</strong> The title now shows which term you're viewing ("Fall 2026 — 15 Weeks", "Spring 2027 — 7A", etc.) rather than a hardcoded label.</li>
      <li><strong>AI assistant now covers all terms.</strong> Ask about any sub-term — Winterim seats, Spring registration trends, Fall final numbers — and the assistant has the data loaded. It prioritizes forward-looking questions ("what should I watch?") toward current and upcoming terms.</li>
      <li><strong>Per-POT FTE goals, when set.</strong> Spring 2027 ships with per-POT goal breakdowns (15W: 2,620; 11W: 324; 7A: 12; 7B: 24). Future enhancement will display them next to the headline goal.</li>
    </ul>
  `;

  const state = {
    // Data
    snapshots: [],          // [{ id, date, label, filename, part_of_term, rows: [...] }] sorted ASC by date
    currentSnapshotId: null,
    instituteIndex: {},     // { 'BUSS': ['CULA','ACCT',...], ... }
    allDisciplines: [],     // [{ code, institute, count }]

    // v5.33: Multi-term support. The dashboard loads multiple term manifests
    // in parallel (26FA Fall, 27WN Winterim, 27SP Spring) and tags every
    // snapshot with its term. The ACTIVE SELECTION is a compound (term, pot)
    // tuple identifying which snapshots are in view. All downstream rendering
    // (KPIs, trends, movers, discipline summary) filters by both.
    //
    // The POT dropdown presents a unified cross-term list, sorted by
    // lifecycle (IN SESSION, UPCOMING, ENDING SOON, COMPLETE) so chairs
    // always see the operationally-relevant terms first. Each selection
    // updates both activeTerm and activePartOfTerm at once.
    //
    // Default is 26FA + 15W to match pre-v5.33 behavior. On first visit
    // after upgrade, the sticky localStorage value will be interpreted as
    // Fall unless activeTerm is also set.

    // Loaded term configurations: { "26FA": { term_label, term_start, term_end, goals, census, pot_dates, ... }, ... }
    // Keyed by term code. Populated during loadFromManifests. Each entry
    // mirrors the top-level fields of the term's manifest.json (excluding
    // snapshots, which go into state.snapshots).
    terms: {},

    activeTerm: '26FA',

    // Part-of-term code. Fall and Spring use 15W/11W/7A/7B. Winterim uses
    // 'FULL' (sentinel for single-session terms with empty pot_dates).
    activePartOfTerm: '15W',

    // Movers panel comparison window. 'previous' compares the current
    // snapshot against the immediately-preceding one (short-view: what
    // moved this week). 'start' compares against the earliest snapshot
    // in the active POT's history (long-view: what moved since
    // registration opened — useful for end-of-term retrospective).
    // Default is 'previous' since the daily/weekly view is the more
    // common analysis. Stalled panel uses a wider lookback (5 snapshots)
    // when in 'previous' mode, since 1-snapshot stalled is trivially
    // true for most sections. Persisted to localStorage.
    moverWindow: 'previous',

    // User selections
    selectedDisciplines: new Set(),
    presets: [],            // [{ name, disciplines: [] }]

    // View / filters
    activeTab: 'snapshot',  // 'snapshot' | 'trends' | 'snapshots'
    activeLocations: new Set(),
    activeDisciplineFilter: new Set(), // sub-filter within selected
    sortKey: 'Section',
    sortDir: 1,
    showBenchmarks: true,
    tableSearch: '',        // search box content for full section detail table
    fillBucket: 'all',      // 'all' | 'full' | 'almost' | 'under' | 'empty'
    cardExpansion: {},      // explicit per-discipline overrides: { ELEC: true, MATH: false }
                            //   missing key => use smart default (expand if <20 sections)

    // Per-discipline expansion state for the "By Discipline" summary table.
    // When expanded, a discipline row shows nested per-course breakdown rows
    // beneath it. Keys are course-prefix strings ('ENGL', 'MATH'); values
    // are booleans. Missing key => collapsed. Persisted to localStorage so
    // the user's chosen view sticks across sessions. Separate from
    // cardExpansion (which controls the "Sections at a Glance" cards) so
    // the two tables have independent expand/collapse state.
    disciplineRowExpansion: {},

    // Per-course expansion state for the grouped table view. Keys are
    // "{courseCode}:{group}" where group is 'triggered', 'priority', or 'room'.
    // Missing key => collapsed (show truncated list). Cleared per session;
    // not persisted to keep the default predictable.
    groupedExpansion: {},

    // When Empty or Full fill bucket is active, choose between a course-grouped
    // panel view (default) and the traditional one-row-per-section list. The
    // grouped view consolidates redundant alternative listings; the list view
    // is the original behavior, kept as a fallback for users who prefer it.
    groupedView: true,

    // Loading state for GitHub-hosted data
    loadStatus: 'idle',     // 'idle' | 'loading' | 'loaded' | 'error'
    loadError: null,
    loadedAt: null,         // when manifest was fetched
    manifestUpdatedAt: null,// "updated" field from the ACTIVE term's manifest (recomputed on term switch)

    // v5.33: goals and census now live PER TERM inside state.terms[termCode].
    // These fields remain as computed accessors — see fteGoal() and
    // activeCensusInfo(), which read from the active term's config.
    // Legacy fields kept null so any orphan reference degrades to "no goal set"
    // rather than crashing.
    goals: null,
    census: null,
  };

  /* =========================================================================
   * UTILITIES
   * ========================================================================= */

  function uid() { return 'id-' + Math.random().toString(36).slice(2, 10); }
  function sum(arr, key) { return arr.reduce((a, r) => a + (Number(r[key]) || 0), 0); }
  function el(id) { return document.getElementById(id); }
  // Display an integer count with thousands separators when ≥ 1000. Used
  // wherever enrollment, capacity, or section counts are rendered for users
  // so 4-digit numbers like 1188 read as "1,188" rather than running
  // together. Explicit en-US locale because the dashboard is US-only and
  // browsers with non-US locale settings would otherwise produce periods
  // as separators.
  function fmtInt(n) {
    if (n == null || isNaN(n)) return '0';
    return Math.round(Number(n)).toLocaleString('en-US');
  }
  // Same idea for decimal values like FTE (1792.8 → "1,792.8"). Uses
  // toLocaleString with explicit min/max fraction digits so the decimal
  // is preserved and the thousands separator is applied. Keep separate
  // from fmtInt so call sites read clearly about which kind of number
  // they're formatting.
  function fmtFloat(n, decimals) {
    if (n == null || isNaN(n)) return (0).toFixed(decimals);
    return Number(n).toLocaleString('en-US', {
      minimumFractionDigits: decimals,
      maximumFractionDigits: decimals,
    });
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  // Deterministic color from string (used for discipline accent)
  function colorFor(code) {
    let h = 0;
    for (let i = 0; i < code.length; i++) h = (h * 31 + code.charCodeAt(i)) >>> 0;
    const hue = h % 360;
    // Avoid clashing with backgrounds: medium saturation/lightness
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    return `hsl(${hue} ${isDark ? '55%' : '55%'} ${isDark ? '60%' : '42%'})`;
  }

  // Parse date from filename: looks for MMDDYY or YYYYMMDD or _DDMMM patterns
  function parseDateFromFilename(name) {
    const noExt = name.replace(/\.[^.]+$/, '');
    // Pattern 1: MMDDYY (six trailing digits)
    let m = noExt.match(/(\d{2})(\d{2})(\d{2})(?!\d)/);
    if (m) {
      const [, mm, dd, yy] = m;
      const year = 2000 + parseInt(yy, 10);
      const date = new Date(year, parseInt(mm, 10) - 1, parseInt(dd, 10));
      if (!isNaN(date.getTime())) return date.toISOString().slice(0, 10);
    }
    // Pattern 2: YYYY-MM-DD or YYYYMMDD
    m = noExt.match(/(\d{4})[-_]?(\d{2})[-_]?(\d{2})/);
    if (m) {
      const date = new Date(parseInt(m[1], 10), parseInt(m[2], 10) - 1, parseInt(m[3], 10));
      if (!isNaN(date.getTime())) return date.toISOString().slice(0, 10);
    }
    return null;
  }

  function fmtDate(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  }

  function fmtDateShort(iso) {
    if (!iso) return '—';
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
  }

  function loadStorage() {
    try {
      const t = localStorage.getItem(STORAGE.THEME);
      if (t === 'dark' || t === 'white') {
        document.documentElement.setAttribute('data-theme', t);
      }
      // 'cream' / 'light' / null all mean default (no attribute)

      const d = localStorage.getItem(STORAGE.DISCIPLINES);
      if (d) state.selectedDisciplines = new Set(JSON.parse(d));

      const p = localStorage.getItem(STORAGE.PRESETS);
      if (p) state.presets = JSON.parse(p);

      // Snapshots now come from GitHub via loadFromManifest(); we do not
      // restore them from localStorage anymore.

      const ii = localStorage.getItem(STORAGE.INSTITUTE_INDEX);
      if (ii) state.instituteIndex = JSON.parse(ii);

      const bm = localStorage.getItem(STORAGE.BENCHMARKS);
      if (bm !== null) state.showBenchmarks = bm === 'true';

      const ce = localStorage.getItem(STORAGE.CARD_EXPANSION);
      if (ce) state.cardExpansion = JSON.parse(ce);

      const gv = localStorage.getItem(STORAGE.GROUPED_VIEW);
      if (gv !== null) state.groupedView = gv === 'true';

      const dre = localStorage.getItem(STORAGE.DISCIPLINE_ROW_EXPANSION);
      if (dre) state.disciplineRowExpansion = JSON.parse(dre);

      const apot = localStorage.getItem(STORAGE.ACTIVE_PART_OF_TERM);
      if (apot) state.activePartOfTerm = apot;

      // v5.33: active term code (e.g. '26FA'). Backward compat: if missing,
      // activePartOfTerm from pre-v5.33 implicitly belongs to 26FA.
      const at = localStorage.getItem(STORAGE.ACTIVE_TERM);
      if (at) state.activeTerm = at;

      const mw = localStorage.getItem(STORAGE.MOVER_WINDOW);
      if (mw === 'previous' || mw === 'start') state.moverWindow = mw;
    } catch (err) {
      console.error('Storage load error:', err);
    }
  }

  function saveStorage() {
    try {
      localStorage.setItem(STORAGE.DISCIPLINES, JSON.stringify([...state.selectedDisciplines]));
      localStorage.setItem(STORAGE.PRESETS, JSON.stringify(state.presets));
      localStorage.setItem(STORAGE.INSTITUTE_INDEX, JSON.stringify(state.instituteIndex));
      localStorage.setItem(STORAGE.BENCHMARKS, String(state.showBenchmarks));
      localStorage.setItem(STORAGE.CARD_EXPANSION, JSON.stringify(state.cardExpansion));
      localStorage.setItem(STORAGE.GROUPED_VIEW, String(state.groupedView));
      localStorage.setItem(STORAGE.DISCIPLINE_ROW_EXPANSION, JSON.stringify(state.disciplineRowExpansion));
      localStorage.setItem(STORAGE.ACTIVE_PART_OF_TERM, state.activePartOfTerm);
      localStorage.setItem(STORAGE.ACTIVE_TERM, state.activeTerm);
      localStorage.setItem(STORAGE.MOVER_WINDOW, state.moverWindow);
    } catch (err) {
      console.error('Storage save error (likely quota):', err);
    }
  }

  /* =========================================================================
   * DATA INGEST
   * ========================================================================= */

  function getCoursePrefix(course) {
    if (!course) return '';
    const m = String(course).trim().toUpperCase().match(/^([A-Z]{2,5})/);
    return m ? m[1] : '';
  }

  // v5.33.7: Normalize raw rows to a canonical shape before filtering /
  // ingesting. Handles two file formats:
  //
  //   Colleague native (Fall combined files):
  //     Course  = "ARTS-115"             (discipline-coursenumber)
  //     Section = "ARTS-115-001"         (full identifier)
  //
  //   Simplified export (new scraper, Winterim+):
  //     Course  = "ARTS-115-001"         (full identifier, all one field)
  //     Section = (no column)
  //
  // The dashboard uses Section as the unique dedup key, so a missing Section
  // column collapses every row to the same key. Normalization: if Section
  // is missing and Course has 3+ dash-separated parts, split Course into
  // (first-two-parts, full) and use those as (Course, Section). If Section
  // is missing but Course has only 2 parts, duplicate Course into Section
  // so dedup at least gets a unique-per-course key.
  //
  // Also computes Section Fill % when missing (Enrolled / Capacity * 100),
  // since the new scraper doesn't ship this column.
  function normalizeRawRow(r) {
    const hasSection = r.Section != null && String(r.Section).trim() !== '';
    const courseStr = String(r.Course || '').trim();
    let normalized = r;

    if (!hasSection && courseStr) {
      const parts = courseStr.split('-');
      if (parts.length >= 3) {
        normalized = { ...r };
        normalized.Course = parts.slice(0, 2).join('-');
        normalized.Section = courseStr;
      } else {
        normalized = { ...r, Section: courseStr };
      }
    }

    // Synthesize Section Fill % when missing from the source
    const hasFill = normalized['Section Fill %'] != null
      && String(normalized['Section Fill %']).trim() !== '';
    if (!hasFill) {
      const cap = Number(normalized.Capacity) || 0;
      const enr = Number(normalized['Enrolled Students']) || 0;
      if (cap > 0) {
        normalized = normalized === r ? { ...r } : normalized;
        normalized['Section Fill %'] = (enr / cap) * 100;
      }
    }

    return normalized;
  }

  // Returns explicit session length from the spreadsheet if a column carries it;
  // otherwise null (we don't guess — too many co-op/internship/lab courses
  // would be mislabeled). When Brookdale adds an explicit session/part-of-term
  // column, this just starts working.
  function getSessionLength(row) {
    const candidates = ['Session', 'Part of Term', 'Session Length', 'Session Code'];
    for (const c of candidates) {
      if (row[c]) {
        const s = String(row[c]).toUpperCase();
        if (s.includes('11')) return '11';
        if (s.includes('15')) return '15';
        return s;
      }
    }
    return null;
  }

  function ingestFile(file) {
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = new Uint8Array(ev.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheetName = wb.SheetNames.find(n => /individual\s*sect/i.test(n))
                       || wb.SheetNames.find(n => /query\s*result/i.test(n))
                       || wb.SheetNames[0];
        const sheet = wb.Sheets[sheetName];
        const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: null });
        ingestRows(rawRows, file.name);
      } catch (err) {
        console.error(err);
        toast('⚠ Could not read this spreadsheet. Make sure it is the standard "Individual Sects All" report.', 6000);
      }
    };
    reader.readAsArrayBuffer(file);
  }

  // v5.33 MULTI-TERM LOADER.
  //
  // Fetches data/terms.json, then fetches each listed term's manifest in
  // parallel, then fetches each term's listed spreadsheets in parallel.
  // All snapshots go into the same state.snapshots array, each tagged with
  // its term code. Term configs (label, dates, goals, census, pot_dates)
  // land in state.terms keyed by term code.
  //
  // Backward compatibility: if terms.json is missing or empty, falls back
  // to the pre-v5.33 single-term behavior (loads data/26FA/ only).
  //
  // Each per-term manifest looks like:
  //   {
  //     "term": "26FA",
  //     "term_label": "Fall 2026",
  //     "term_start": "2026-09-02",
  //     "term_end": "2026-12-15",
  //     "updated": "2026-10-25T14:00:00Z",
  //     "goals": { "fte": 3335.0, "fte_by_pot": { "15W": ..., ... } },
  //     "census": { "15W": "2026-09-21", ... },
  //     "pot_dates": { "15W": { "start": "...", "end": "..." }, ... },
  //     "snapshots": [ { "date": "...", "file": "..." }, ... ]
  //   }
  //
  // For Winterim (no POTs), pot_dates is an empty object; snapshots are
  // ingested with POT='FULL' as the sentinel for "single-session term".
  async function loadFromManifests() {
    state.loadStatus = 'loading';
    render();

    try {
      // Step 1: Discover active terms via data/terms.json. If it fails,
      // fall back to the single-term pre-v5.33 behavior (26FA).
      let termCodes = ['26FA'];
      try {
        const idxUrl = DATA_ROOT + TERMS_INDEX_FILE + '?t=' + Date.now();
        const idxResp = await fetch(idxUrl);
        if (idxResp.ok) {
          const idx = await idxResp.json();
          if (idx && Array.isArray(idx.terms) && idx.terms.length > 0) {
            termCodes = idx.terms;
          }
        }
      } catch (err) {
        console.warn(`terms.json not available, falling back to 26FA only:`, err);
      }

      // Step 2: Fetch each term's manifest in parallel. Keep terms with
      // valid manifests; log and skip any that fail (so one broken term
      // doesn't block the others).
      const termManifests = await Promise.all(termCodes.map(async code => {
        try {
          const url = DATA_ROOT + code + '/' + MANIFEST_FILE + '?t=' + Date.now();
          const resp = await fetch(url);
          if (!resp.ok) {
            console.warn(`No manifest for term ${code} (HTTP ${resp.status})`);
            return { code, manifest: null };
          }
          const manifest = await resp.json();
          return { code, manifest };
        } catch (err) {
          console.warn(`Failed to load manifest for ${code}:`, err);
          return { code, manifest: null };
        }
      }));

      // Step 3: Reset snapshots and term configs. Populate state.terms with
      // the config for every term that returned a manifest (regardless of
      // whether it has snapshots — an empty 27SP term still appears in
      // the dropdown as UPCOMING).
      state.snapshots = [];
      state.terms = {};

      termManifests.forEach(({ code, manifest }) => {
        if (!manifest) return;
        state.terms[code] = {
          term: manifest.term || code,
          term_label: manifest.term_label || termLabelFromCode(code),
          term_start: manifest.term_start || null,
          term_end: manifest.term_end || null,
          updated: manifest.updated || null,
          goals: manifest.goals || null,
          census: manifest.census || {},
          pot_dates: manifest.pot_dates || {},
        };
      });

      // Step 4: Collect all snapshot entries across all terms, tagged with
      // their term, and fetch them all in parallel.
      const allEntries = [];
      termManifests.forEach(({ code, manifest }) => {
        if (!manifest || !Array.isArray(manifest.snapshots)) return;
        manifest.snapshots.forEach(entry => {
          allEntries.push({ ...entry, _term: code });
        });
      });

      if (allEntries.length === 0) {
        // No snapshots anywhere. This is OK — Winterim/Spring may be
        // configured but Laura hasn't started uploading yet. Show the
        // "awaiting first snapshot" state rather than an error.
        state.loadStatus = 'loaded';
        state.loadError = null;
        state.loadedAt = new Date().toISOString();
        state.manifestUpdatedAt = null;
        // Pick a sensible default activeTerm from what's configured.
        if (!state.terms[state.activeTerm]) {
          const first = Object.keys(state.terms)[0];
          if (first) state.activeTerm = first;
        }
        render();
        return;
      }

      const fetches = allEntries.map(async entry => {
        const fileUrl = DATA_ROOT + entry._term + '/' + entry.file;
        try {
          const resp = await fetch(fileUrl);
          if (!resp.ok) {
            console.warn(`Failed to fetch ${fileUrl} (HTTP ${resp.status})`);
            return { entry, buf: null };
          }
          const buf = await resp.arrayBuffer();
          return { entry, buf };
        } catch (err) {
          console.warn(`Failed to fetch ${fileUrl}:`, err);
          return { entry, buf: null };
        }
      });

      const results = await Promise.all(fetches);

      // Step 5: Parse each spreadsheet and ingest. Pass the term code so
      // ingestRowsSilent can tag rows and filter by the correct term prefix.
      for (const { entry, buf } of results) {
        if (!buf) continue;
        try {
          const wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
          const sheetName = wb.SheetNames.find(n => /individual\s*sect/i.test(n))
                         || wb.SheetNames.find(n => /query\s*result/i.test(n))
                         || wb.SheetNames[0];
          const sheet = wb.Sheets[sheetName];
          const rawRows = XLSX.utils.sheet_to_json(sheet, { defval: null });
          const rows = resolveRowsForEntry(rawRows, entry);
          ingestRowsSilent(rows, entry.file, entry.date, entry.part_of_term, entry._term);
        } catch (err) {
          console.error(`Failed to parse ${entry.file}:`, err);
        }
      }

      // Even if no rows parsed (e.g. only placeholder manifests present),
      // keep loadStatus=loaded so the UI shows terms with empty snapshot
      // sets rather than a hard error.
      state.snapshots.sort((a, b) => a.date.localeCompare(b.date));
      state.currentSnapshotId = state.snapshots.length
        ? state.snapshots[state.snapshots.length - 1].id
        : null;
      recomputeAllDisciplines();

      // Step 6: Decide the active (term, POT). Prefer the sticky
      // localStorage value if both still exist in loaded data; otherwise
      // pick a sensible default based on lifecycle.
      pickActiveTermAndPot();

      state.loadStatus = 'loaded';
      state.loadError = null;
      state.loadedAt = new Date().toISOString();

      // manifestUpdatedAt now mirrors the ACTIVE term's updated field so
      // the footer stamp reflects what the user is looking at.
      const activeTermConfig = state.terms[state.activeTerm];
      state.manifestUpdatedAt = activeTermConfig ? activeTermConfig.updated : null;

      const isFirstVisit = state.selectedDisciplines.size === 0;
      render();
      if (isFirstVisit) {
        openDisciplineModal();
      }

      maybeCelebrateGoal();
    } catch (err) {
      console.error('Failed to load enrollment data:', err);
      state.loadStatus = 'error';
      state.loadError = err.message || String(err);
      render();
    }
  }

  // Legacy name for callers that haven't been updated yet.
  const loadFromManifest = loadFromManifests;

  // v5.33: Pick the active (term, POT) at load time. Honors a sticky
  // localStorage value when both still exist in the loaded data. Falls
  // back to the first (term, POT) that's IN SESSION; if none is active,
  // picks the earliest UPCOMING; else the most recent COMPLETE.
  function pickActiveTermAndPot() {
    const options = allTermPotOptions();
    if (options.length === 0) return;

    const stickyKey = (state.activeTerm || '') + '|' + (state.activePartOfTerm || '');
    const stickyMatch = options.find(o => (o.term + '|' + o.pot) === stickyKey);
    if (stickyMatch) {
      state.activeTerm = stickyMatch.term;
      state.activePartOfTerm = stickyMatch.pot;
      return;
    }

    // Lifecycle priority: IN SESSION > UPCOMING (closest first) > ENDING SOON > COMPLETE
    const inSession = options.find(o => o.lifecycle === 'IN_SESSION');
    const upcoming = options.find(o => o.lifecycle === 'UPCOMING');
    const endingSoon = options.find(o => o.lifecycle === 'ENDING_SOON');
    const chosen = inSession || upcoming || endingSoon || options[options.length - 1];
    state.activeTerm = chosen.term;
    state.activePartOfTerm = chosen.pot;
  }

  // Apply the manifest entry's optional pot_term_filter, then defensively
  // deduplicate by (Section, Term). Used during manifest-driven load to
  // handle combined files where one source contains rows from multiple POTs.
  //
  // pot_term_filter comes from the manifest when the pipeline splits a
  // combined 26FAR_ file into one snapshot entry per POT — each entry
  // carries the Term column value that identifies its rows ("26FA" for 15W,
  // "26FA11" for 11W, etc.). No-op for entries without this field, so
  // per-POT files pass through unchanged.
  //
  // Deduplication is a defensive layer against combined files where
  // Colleague hasn't fully consolidated multi-meeting sections. Laura's
  // Sept 2 file is cleanly consolidated so dedup is a no-op on it, but
  // if a future combined file has multi-block rows they'd double-count
  // enrollment without this. Also safe for per-POT files where sections
  // are already unique per Term — dedup finds nothing to drop.
  function resolveRowsForEntry(rawRows, entry) {
    let rows = rawRows;

    if (entry && entry.pot_term_filter) {
      rows = rows.filter(r => {
        const term = r.Term != null ? String(r.Term).trim() : '';
        return term === entry.pot_term_filter;
      });
    }

    const seen = new Set();
    const dedup = [];
    for (const r of rows) {
      const secKey = r.Section != null ? String(r.Section).trim() : '';
      const termKey = r.Term != null ? String(r.Term).trim() : '';
      const key = `${secKey}||${termKey}`;
      if (seen.has(key)) continue;
      seen.add(key);
      dedup.push(r);
    }
    return dedup;
  }

  // Like ingestRows, but used during manifest load — does not toast or modify
  // currentSnapshotId (the caller decides). Uses the manifest-provided date
  // rather than re-parsing it from the filename.
  //
  // v5.33: termCode identifies which term this snapshot belongs to. The
  // row filter now accepts rows whose Term column starts with the term
  // code (so 27SP, 27SP11, 27SP7A, 27SP7B are all accepted when loading
  // Spring 2027). Falls back to the old 'FA' filter when termCode isn't
  // provided (manual uploads from the Snapshots tab).
  function ingestRowsSilent(rawRows, filename, manifestDate, partOfTerm, termCode) {
    const pot = partOfTerm || (termCode === '27WN' ? 'FULL' : '15W');
    const term = termCode || '26FA';
    const upperTerm = String(term).toUpperCase();
    // v5.33.7: normalize before filter so both file formats work (see normalizeRawRow)
    const normalizedRows = rawRows.map(normalizeRawRow);
    const fall = normalizedRows.filter(r => {
      const rowTerm = String(r.Term || '').toUpperCase();
      // Drop -295 (Special Project) and -299 (Internship) sections entirely
      // at the ingest step. v5.33.7: pattern now matches -295/-299 anywhere
      // in the Course identifier, not just at end-of-string. Handles both
      // "COMM-295" (Fall format) and "ARTS-295-300RL" (combined format
      // that slipped through normalization). The dashboard never sees these,
      // so KPI totals, FTE math, Trends, and every render path are
      // unaffected by them.
      if (r.Course && /-29[59](-|$)/.test(String(r.Course))) return false;
      // Accept any row whose Term column starts with the term code we're
      // ingesting (so 26FA matches 26FA, 26FA11, 26FA7A, 26FA7B).
      return r.Course && rowTerm.startsWith(upperTerm);
    }).map(r => {
      const prefix = getCoursePrefix(r.Course);
      return {
        Section: r.Section,
        Course: r.Course,
        'Course Title': r['Course Title'],
        Institute: String(r.Institute || '').trim(),
        Location: String(r.Location || '').trim(),
        Capacity: Number(r.Capacity) || 0,
        'Enrolled Students': Number(r['Enrolled Students']) || 0,
        'Avail Seats': Number(r['Avail Seats']) || 0,
        'Section Fill %': Number(String(r['Section Fill %']).replace('%', '')) || 0,
        'Wait List': Number(r['Wait List']) || 0,
        'Course Credit': Number(r['Course Credit']) || 0,
        'Total Student Credit Hours': Number(r['Total Student Credit Hours']) || 0,
        'Maximum Course SCH': Number(r['Maximum Course SCH']) || 0,
        'Section Start Time': r['Section Start Time'],
        'Meeting Days': r['Meeting Days'],
        Instructor: r.Instructor,
        Term: r.Term,
        _prefix: prefix,
        _session: getSessionLength(r),
        _partOfTerm: pot,
      };
    }).filter(r => r._prefix);

    if (fall.length === 0) return;

    fall.forEach(r => {
      // Use "Other" as the Institute bucket for any row missing an Institute
      // classification. This surfaces orphan disciplines like ESPT (where IR
      // left Institute blank) in the discipline-group chips rather than hiding them.
      const inst = r.Institute || 'Other';
      if (!state.instituteIndex[inst]) state.instituteIndex[inst] = [];
      if (!state.instituteIndex[inst].includes(r._prefix)) {
        state.instituteIndex[inst].push(r._prefix);
      }
    });
    Object.keys(state.instituteIndex).forEach(k => state.instituteIndex[k].sort());

    const date = manifestDate || parseDateFromFilename(filename) || new Date().toISOString().slice(0, 10);

    state.snapshots.push({
      id: uid(),
      date,
      label: fmtDate(date),
      filename,
      part_of_term: pot,
      term,                 // v5.33: term code tag
      rows: fall,
      uploadedAt: new Date().toISOString(),
    });
  }

  function ingestRows(rawRows, filename) {
    // Manual upload path (not from manifest). Assume the file belongs to
    // whichever (term, part-of-term) the user is currently viewing — that's
    // the implicit context of "here's a file I want to add." If they were
    // on Spring 7A view and uploaded a Fall 15W file, they'd want to switch
    // first. v5.33: now term-aware; filter accepts rows whose Term column
    // starts with the active term code.
    const pot = state.activePartOfTerm || '15W';
    const termCode = state.activeTerm || '26FA';
    const upperTerm = String(termCode).toUpperCase();
    // v5.33.7: normalize before filter — see normalizeRawRow for both-format support
    const normalizedRows = rawRows.map(normalizeRawRow);
    const fall = normalizedRows.filter(r => {
      const term = String(r.Term || '').toUpperCase();
      // Drop -295 / -299 sections at ingest. v5.33.7: pattern matches anywhere.
      if (r.Course && /-29[59](-|$)/.test(String(r.Course))) return false;
      return r.Course && term.startsWith(upperTerm);
    }).map(r => {
      const prefix = getCoursePrefix(r.Course);
      return {
        // Carry only what we need to keep storage small
        Section: r.Section,
        Course: r.Course,
        'Course Title': r['Course Title'],
        Institute: String(r.Institute || '').trim(),
        Location: String(r.Location || '').trim(),
        Capacity: Number(r.Capacity) || 0,
        'Enrolled Students': Number(r['Enrolled Students']) || 0,
        'Avail Seats': Number(r['Avail Seats']) || 0,
        'Section Fill %': Number(String(r['Section Fill %']).replace('%', '')) || 0,
        'Wait List': Number(r['Wait List']) || 0,
        'Course Credit': Number(r['Course Credit']) || 0,
        'Total Student Credit Hours': Number(r['Total Student Credit Hours']) || 0,
        'Maximum Course SCH': Number(r['Maximum Course SCH']) || 0,
        'Section Start Time': r['Section Start Time'],
        'Meeting Days': r['Meeting Days'],
        Instructor: r.Instructor,
        Term: r.Term,
        _prefix: prefix,
        _session: getSessionLength(r),
        _partOfTerm: pot,
      };
    }).filter(r => r._prefix);

    if (fall.length === 0) {
      toast(`⚠ No ${termCode} sections found in this spreadsheet. (Expected Term column to start with "${termCode}".)`, 5000);
      return;
    }

    // Build/refresh institute index
    fall.forEach(r => {
      const inst = r.Institute || 'Other';
      if (!state.instituteIndex[inst]) state.instituteIndex[inst] = [];
      if (!state.instituteIndex[inst].includes(r._prefix)) {
        state.instituteIndex[inst].push(r._prefix);
      }
    });
    Object.keys(state.instituteIndex).forEach(k => state.instituteIndex[k].sort());

    // Determine snapshot date
    let date = parseDateFromFilename(filename);
    if (!date) date = new Date().toISOString().slice(0, 10);

    // Check for duplicate (date, term, part_of_term) triple — a 15W and 7A
    // snapshot on the same date are different; so are a Fall 15W and
    // Spring 15W. Only a same-(term, POT) duplicate should trigger replace.
    const existingIdx = state.snapshots.findIndex(s =>
      s.date === date &&
      (s.term || '26FA') === termCode &&
      (s.part_of_term || '15W') === pot
    );
    const snapshot = {
      id: uid(),
      date,
      label: fmtDate(date),
      filename,
      part_of_term: pot,
      term: termCode,  // v5.33
      rows: fall,
      uploadedAt: new Date().toISOString(),
    };

    let isFirstSnapshot = state.snapshots.length === 0;
    let replaced = false;

    if (existingIdx >= 0) {
      state.snapshots[existingIdx] = snapshot;
      replaced = true;
    } else {
      state.snapshots.push(snapshot);
    }
    state.snapshots.sort((a, b) => a.date.localeCompare(b.date));
    state.currentSnapshotId = snapshot.id;

    recomputeAllDisciplines();
    saveStorage();

    if (isFirstSnapshot && state.selectedDisciplines.size === 0) {
      // First-ever upload — show discipline picker
      render();
      openDisciplineModal();
      toast(`Loaded ${fall.length} sections from ${fmtDate(date)}. Pick the disciplines you want to track.`, 4000);
    } else {
      render();
      toast(replaced
        ? `Replaced snapshot for ${fmtDate(date)} (${fall.length} sections).`
        : `Snapshot added: ${fmtDate(date)} (${fall.length} sections, ${state.snapshots.length} total).`,
        4000);
    }
  }

  function recomputeAllDisciplines() {
    // Aggregate across ALL snapshots so a discipline that disappears from a
    // later report still shows up in the picker.
    const counts = {};
    const institutes = {};
    state.snapshots.forEach(snap => {
      snap.rows.forEach(r => {
        if (!r._prefix) return;
        counts[r._prefix] = (counts[r._prefix] || 0) + 1;
        institutes[r._prefix] = r.Institute || '(unspecified)';
      });
    });
    state.allDisciplines = Object.keys(counts).sort().map(code => ({
      code,
      institute: institutes[code],
      count: counts[code],
    }));
  }

  /* =========================================================================
   * SNAPSHOT ACCESSORS
   * ========================================================================= */

  // Returns the subset of state.snapshots belonging to the currently
  // active (term, part-of-term) compound. This is the single source of
  // truth for "which snapshots are visible to the user right now" — every
  // function that needs to iterate across the history (trend chart,
  // movers, snapshot library) uses this instead of state.snapshots
  // directly. Snapshots missing the part_of_term field default to '15W',
  // and snapshots missing the term field default to '26FA', for backward
  // compatibility with pre-v5.33 data.
  function activeSnapshots() {
    const termWanted = state.activeTerm || '26FA';
    const potWanted = state.activePartOfTerm || '15W';
    return state.snapshots.filter(s =>
      (s.term || '26FA') === termWanted &&
      (s.part_of_term || '15W') === potWanted
    );
  }

  function currentSnapshot() {
    // Prefer a POT-appropriate snapshot for currentSnapshotId; if the
    // stored id belongs to a different POT (which can happen after the
    // user switches the picker), fall back to the newest snapshot in the
    // active POT. If no active POT snapshots exist yet, return undefined
    // and let the caller render an empty state.
    const active = activeSnapshots();
    const byId = active.find(s => s.id === state.currentSnapshotId);
    return byId || active[active.length - 1];
  }

  function previousSnapshot() {
    const cur = currentSnapshot();
    if (!cur) return null;
    const active = activeSnapshots();
    const idx = active.findIndex(s => s.id === cur.id);
    return idx > 0 ? active[idx - 1] : null;
  }

  // Filtered current rows by selected disciplines + sub-filters
  // Returns true if a row matches the active fill-status bucket.
  // Buckets match the same thresholds the dashboard uses for badge colors:
  //   full     fill >= 100%
  //   almost   75% <= fill < 100%
  //   under    0 < fill < 50% (i.e., has some enrollment but under-filled)
  //   empty    enrolled === 0
  // Sections ending in -295 (Special Projects) or -299 (Internships) are
  // independent-enrollment courses — students sign up individually, often
  // late, and "0 enrolled" doesn't indicate a section in trouble. Excluded
  // from the Empty bucket filter and from empty-section counts in the
  // "By Discipline" summary table. Still visible under "All" and findable
  // via search ("295", "299", "internship").
  function isIndependentEnrollment(r) {
    const course = String(r.Course || '');
    return /-295$/.test(course) || /-299$/.test(course);
  }

  // -----------------------------------------------------------------------
  // Combined-class detection
  // -----------------------------------------------------------------------
  // Some courses run two sections as a single co-meeting class: same course
  // code, same room, same days, same time, same instructor. Confirmed by
  // the chair that the two rosters are DIFFERENT students (so summing
  // enrollment is a true count, not a double-count). False-positive risk
  // for the dashboard: a paired section can look "empty" (e.g., 0/11) on
  // its own when in reality it's the second half of a healthy combined
  // class. This helper builds a map of section -> combined-group metadata
  // so the renderer can display linked sections together with a combined
  // enrollment subtotal.
  //
  // SCOPE: MATH and ENGL (Composition I co-meeting pairs at LINC, WALL,
  // ORLV, ONLH, CECAP, plus DE async). AUTO (GM program), CULA (block
  // scheduling), and other programs are deferred — they need cross-list
  // confirmation from IR and, for CULA, block-aware detection to avoid
  // grouping sections that meet in different three-week blocks.
  //
  // Detection is a two-pass process:
  //
  //   Pass 1 — Schedule fingerprint: same course + location + days + time
  //   + instructor (all non-empty, instructor not TBA/Staff). Catches all
  //   in-person co-meeting pairs regardless of section-number convention.
  //   This is the primary signal: it makes no assumption about how
  //   registrar numbers paired sections.
  //
  //   Pass 2 — Consecutive-numbering fallback: only for sections with no
  //   schedule data (no days, no time — typical of async DE offerings).
  //   Uses the Brookdale ENGL convention where an XL section at number N
  //   has its RL partner at N+1, same instructor, same location. Verified
  //   conservative: the rule requires the XL-then-RL role pattern, exact
  //   N+1 numbering, plus matching instructor + location. Unrelated DE
  //   sections that happen to share an instructor are not paired.
  //   Standalone DE sections (e.g., DE01A) that don't fit the XL/RL
  //   pattern are correctly excluded.
  //
  //   Pass 2 only applies to ENGL in practice. MATH XL/RL numbering is
  //   inconsistent (the 3 detected pairs use 002+003, 009+010, 008+014),
  //   and MATH has no async DE offerings in the data. Pass 1 covers MATH
  //   completely.
  //
  // Caching: the result depends only on the snapshot's row identities, so
  // we memo-cache on the snapshot id to avoid recomputing on every render.
  const _combinedClassCache = new Map();
  function getCombinedClassMap(snap) {
    if (!snap || !snap.rows) return new Map();
    if (_combinedClassCache.has(snap.id)) return _combinedClassCache.get(snap.id);

    const norm = (v) => String(v == null ? '' : v).trim().toUpperCase();

    // SCOPE GATE applied across both passes: MATH and ENGL this iteration.
    // Both have confirmed co-meeting patterns with two distinct student
    // populations per pair (so summing enrollment is correct, not
    // double-counting). Other prefixes — AUTO (GM program), CULA (block
    // scheduling), BIOL/CHEM — are deferred pending IR clarification.
    const inScope = (r) => {
      const cp = String(r.Course || '').toUpperCase();
      return cp.startsWith('MATH') || cp.startsWith('ENGL');
    };

    // Track which sections have been matched so Pass 2 doesn't re-pair a
    // section that Pass 1 already grouped.
    const matched = new Set();
    const sectionToGroup = new Map();

    // Finalize a group: compute summed enrollment/capacity, build the
    // shared metadata, register section -> group in the output map.
    // Pass 1 and Pass 2 both call this so the rendering layer doesn't
    // need to care which pass produced which group.
    const finalizeGroup = (sections, key) => {
      if (sections.length < 2) return;
      const sorted = sections.slice().sort((a, b) =>
        String(a.Section).localeCompare(String(b.Section))
      );
      const totalEnr = sorted.reduce((s, r) => s + (Number(r['Enrolled Students']) || 0), 0);
      const totalCap = sorted.reduce((s, r) => s + (Number(r.Capacity) || 0), 0);
      const totalWait = sorted.reduce((s, r) => s + (Number(r['Wait List']) || 0), 0);
      const groupInfo = {
        key,
        sections: sorted,
        sectionCodes: sorted.map(r => String(r.Section)),
        course: sorted[0].Course,
        location: sorted[0].Location,
        days: sorted[0]['Meeting Days'],
        time: sorted[0]['Section Start Time'],
        instructor: sorted[0].Instructor,
        combinedEnrolled: totalEnr,
        combinedCapacity: totalCap,
        combinedWaitlist: totalWait,
        combinedFill: totalCap > 0 ? (totalEnr / totalCap * 100) : 0,
      };
      sorted.forEach(r => {
        sectionToGroup.set(String(r.Section), groupInfo);
        matched.add(String(r.Section));
      });
    };

    // --- PASS 1: schedule fingerprint ---
    // Key: course + location + days + time + instructor.
    // Requires non-empty days+time+instructor (rules out unscheduled DE
    // sections) and instructor not TBA/Staff (rules out filler matches).
    // This pass catches all in-person co-meeting pairs across MATH and
    // ENGL, regardless of section-number convention. The 3 MATH pairs use
    // varied numbering (002+003, 009+010, 008+014); this rule catches
    // them via the meeting fingerprint alone.
    const scheduleGroups = new Map();
    snap.rows.forEach(r => {
      if (!inScope(r)) return;
      const days = norm(r['Meeting Days']);
      const time = norm(r['Section Start Time']);
      const instr = norm(r['Instructor']);
      if (!days || !time || !instr) return;
      if (instr === 'TBA' || instr === 'STAFF') return;
      const key = [norm(r.Course), norm(r.Location), days, time, instr].join('|');
      if (!scheduleGroups.has(key)) scheduleGroups.set(key, []);
      scheduleGroups.get(key).push(r);
    });
    scheduleGroups.forEach((sections, key) => finalizeGroup(sections, key));

    // --- PASS 2: consecutive-numbering fallback for unscheduled sections ---
    // Only applies to sections with no days AND no time (truly unscheduled,
    // typical of async DE offerings). Looks for the Brookdale ENGL-121
    // convention where co-meeting pairs are numbered consecutively: an
    // XL/XW section at number N has its RL/RW partner at N+1, same
    // instructor, same location. Verified against the May 1 snapshot:
    // every ENGL-121 XL section paired cleanly to N+1 RL (45 of 45). This
    // rule is conservative — it requires the XL/RL role pattern, exact
    // N+1 numbering, AND same instructor + location, so unrelated DE
    // sections sharing an instructor won't be falsely grouped.
    //
    // Note: this rule deliberately does NOT apply to MATH. MATH XL/RL
    // numbering is inconsistent (the 3 detected pairs use 002+003,
    // 009+010, 008+014), so consecutive numbering isn't a reliable Math
    // signal. Pass 1 already catches all MATH combined classes via
    // their schedules; MATH has no async DE offerings in the data.
    const SUFFIX_RE = /^(\d+)(X[LW]|R[LW])$/i;
    const parseSuffix = (sectionCode) => {
      const lastDash = sectionCode.lastIndexOf('-');
      if (lastDash < 0) return null;
      const tail = sectionCode.slice(lastDash + 1);
      const m = SUFFIX_RE.exec(tail);
      if (!m) return null;
      return {
        number: parseInt(m[1], 10),
        role: m[2].toUpperCase()[0],         // 'X' or 'R'
        loc:  m[2].toUpperCase()[1],         // 'L' or 'W'
      };
    };

    // Index unscheduled in-scope rows by (course, location, instructor)
    // so we can pair up XL → N+1 RL in O(n) per group.
    const unschedByCohort = new Map();
    snap.rows.forEach(r => {
      if (!inScope(r)) return;
      const days = norm(r['Meeting Days']);
      const time = norm(r['Section Start Time']);
      const instr = norm(r['Instructor']);
      if (days || time) return;            // scheduled — Pass 1's domain
      if (!instr || instr === 'TBA' || instr === 'STAFF') return;
      if (matched.has(String(r.Section))) return;
      const cohortKey = [norm(r.Course), norm(r.Location), instr].join('|');
      if (!unschedByCohort.has(cohortKey)) unschedByCohort.set(cohortKey, []);
      unschedByCohort.get(cohortKey).push(r);
    });

    unschedByCohort.forEach((sections, cohortKey) => {
      // Build a number-keyed index of this cohort so we can look up N+1.
      // Same (loc letter from the suffix) must match for a pair to count
      // — an XL only pairs with an RL, an XW only with an RW.
      const byNum = new Map();
      sections.forEach(r => {
        const parsed = parseSuffix(String(r.Section));
        if (!parsed) return;
        byNum.set(parsed.number + ':' + parsed.loc + ':' + parsed.role, r);
      });
      // Walk XL/XW sections; for each, look for its N+1 RL/RW partner.
      sections.forEach(r => {
        const parsed = parseSuffix(String(r.Section));
        if (!parsed || parsed.role !== 'X') return;
        if (matched.has(String(r.Section))) return;
        const partnerKey = (parsed.number + 1) + ':' + parsed.loc + ':R';
        const partner = byNum.get(partnerKey);
        if (!partner) return;
        if (matched.has(String(partner.Section))) return;
        const key = 'unsched|' + cohortKey + '|' + parsed.number;
        finalizeGroup([r, partner], key);
      });
    });

    _combinedClassCache.set(snap.id, sectionToGroup);
    return sectionToGroup;
  }
  // Clear cache when snapshots change
  function invalidateCombinedClassCache() { _combinedClassCache.clear(); }

  function rowInFillBucket(r, bucket) {
    if (bucket === 'all') return true;
    const fill = Number(r['Section Fill %']) || 0;
    const enrolled = Number(r['Enrolled Students']) || 0;
    if (bucket === 'full')   return fill >= 100;
    if (bucket === 'almost') return fill >= 75 && fill < 100;
    if (bucket === 'under')  return enrolled > 0 && fill < 50;
    if (bucket === 'empty')  return enrolled === 0 && !isIndependentEnrollment(r);
    return true;
  }

  function filteredRows() {
    const snap = currentSnapshot();
    if (!snap) return [];
    return snap.rows.filter(r => {
      if (!state.selectedDisciplines.has(r._prefix)) return false;
      if (state.activeDisciplineFilter.size > 0 && !state.activeDisciplineFilter.has(r._prefix)) return false;
      if (state.activeLocations.size > 0 && !state.activeLocations.has(r.Location)) return false;
      if (!rowInFillBucket(r, state.fillBucket)) return false;
      return true;
    });
  }

  // College-wide stats for a snapshot — every fall section, all disciplines.
  // Returns { sections, enrolled, capacity, fill, sch }.
  function collegeWideStats(snap) {
    if (!snap) return { sections: 0, enrolled: 0, capacity: 0, fill: 0, sch: 0 };
    const rows = snap.rows;
    const enrolled = sum(rows, 'Enrolled Students');
    const capacity = sum(rows, 'Capacity');
    return {
      sections: rows.length,
      enrolled,
      capacity,
      fill: capacity > 0 ? (enrolled / capacity * 100) : 0,
      sch: sum(rows, 'Total Student Credit Hours'),
    };
  }

  // FTE (Full-Time Equivalent) = Total Student Credit Hours / 30.
  // This is the institutional planning metric, used here to track progress
  // toward a college-wide FTE goal (set in manifest.json as goals.fte).
  const FTE_DIVISOR = 30;

  function fteFromRows(rows) {
    return sum(rows, 'Total Student Credit Hours') / FTE_DIVISOR;
  }

  function collegeWideFTE(snap) {
    if (!snap) return 0;
    return fteFromRows(snap.rows);
  }

  // Cross-POT college-wide FTE aggregation. Sums the newest snapshot of
  // each part-of-term to produce a fall-total college FTE. This is the
  // headline used on the FTE card, and it's *deliberately* independent
  // of the active POT filter — the fall FTE goal (3,335) is a fall-total
  // goal, so measuring progress against it requires the total. Comparing
  // a POT-filtered slice against the whole-fall goal produces misleading
  // percentages (e.g., 7A view against fall goal reads "5% of goal"
  // when the college is actually near 60%).
  //
  // If referenceSnap is provided, snapshots dated *after* that snapshot
  // are excluded — this is what lets a user click back to an older
  // snapshot in the library and see the historical aggregate as it
  // stood at that point in time, rather than the always-newest total.
  // If referenceSnap is omitted, the whole history is considered
  // (equivalent to "as of today").
  // v5.33.3: Term-aware. Sums the latest-per-POT FTE within the ACTIVE
  // TERM only. Previously summed across all loaded terms, which produced
  // a false "goal met" celebration when the user had switched to a
  // small-goal term (Winterim 65.0) with Fall data still in state.
  function aggregateCollegeFTE(referenceSnap) {
    const refDate = referenceSnap ? referenceSnap.date : null;
    const termWanted = state.activeTerm || '26FA';
    const potLatest = new Map();
    state.snapshots.forEach(s => {
      if ((s.term || '26FA') !== termWanted) return;
      if (refDate && s.date > refDate) return;
      const pot = s.part_of_term || '15W';
      const existing = potLatest.get(pot);
      if (!existing || s.date > existing.date) potLatest.set(pot, s);
    });
    let total = 0;
    potLatest.forEach(snap => { total += fteFromRows(snap.rows); });
    return total;
  }

  // Previous aggregate for delta calculation. Uses each POT's
  // second-most-recent snapshot (on or before the reference date) as
  // its "previous" contribution. POTs with only one snapshot in the
  // window contribute their current value to both sides (net zero) so
  // they don't distort the delta. Returns null if NO POT has 2+
  // snapshots (in which case no delta is meaningful).
  function previousAggregateCollegeFTE(referenceSnap) {
    const refDate = referenceSnap ? referenceSnap.date : null;
    const termWanted = state.activeTerm || '26FA';  // v5.33.3: term-aware
    const potGroups = new Map();
    state.snapshots.forEach(s => {
      if ((s.term || '26FA') !== termWanted) return;
      if (refDate && s.date > refDate) return;
      const pot = s.part_of_term || '15W';
      if (!potGroups.has(pot)) potGroups.set(pot, []);
      potGroups.get(pot).push(s);
    });
    let total = 0;
    let anyPriorHistory = false;
    potGroups.forEach(snaps => {
      snaps.sort((a, b) => a.date.localeCompare(b.date));
      const target = snaps.length >= 2 ? snaps[snaps.length - 2] : snaps[snaps.length - 1];
      total += fteFromRows(target.rows);
      if (snaps.length >= 2) anyPriorHistory = true;
    });
    return anyPriorHistory ? total : null;
  }

  // v5.33: Returns the FTE goal for the active term. Reads from
  // state.terms[activeTerm].goals.fte. Returns null if no goal is set.
  //
  // Spring 27 and later may also have per-POT goals under
  // state.terms[activeTerm].goals.fte_by_pot[pot]. Callers that need the
  // per-POT goal (not the college-wide number) use fteGoalForPot().
  function fteGoal() {
    const cfg = state.terms[state.activeTerm];
    if (cfg && cfg.goals && cfg.goals.fte != null) return Number(cfg.goals.fte);
    // Legacy fallback for pre-v5.33 state that stored goals at the top level
    if (state.goals && state.goals.fte != null) return Number(state.goals.fte);
    return null;
  }

  // v5.33: Per-POT FTE goal for the active term, if configured.
  // Returns null if the term has no per-POT breakdown (fall back to fteGoal()).
  function fteGoalForPot(pot) {
    const cfg = state.terms[state.activeTerm];
    const byPot = cfg && cfg.goals && cfg.goals.fte_by_pot;
    if (!byPot) return null;
    const v = byPot[pot];
    return v != null ? Number(v) : null;
  }

  function pctOfGoal(fte) {
    const g = fteGoal();
    return g ? (fte / g * 100) : null;
  }

  // True if comparison to college-wide is meaningful — i.e., user is looking
  // at a real subset, not (effectively) the whole college.
  function comparisonMeaningful() {
    if (!state.showBenchmarks) return false;
    const snap = currentSnapshot();
    if (!snap) return false;
    const totalDisciplines = state.allDisciplines.length;
    if (totalDisciplines === 0) return false;
    // Selected fewer than all disciplines OR has location/sub-filter narrowing
    if (state.selectedDisciplines.size < totalDisciplines) return true;
    if (state.activeDisciplineFilter.size > 0) return true;
    if (state.activeLocations.size > 0) return true;
    return false;
  }

  /* =========================================================================
   * RENDER ROOT
   * ========================================================================= */

  function render() {
    updateHeader();
    const dash = el('dashboard');

    // Loading or error → show welcome panel which handles those states
    if (state.loadStatus === 'loading' || state.loadStatus === 'error' || state.snapshots.length === 0) {
      dash.innerHTML = renderWelcome();
      el('disciplineBtn').style.display = 'none';
      bindBasic();
      return;
    }

    if (state.selectedDisciplines.size === 0) {
      dash.innerHTML = renderNoDisciplines();
      el('disciplineBtn').style.display = '';
      bindBasic();
      return;
    }

    el('disciplineBtn').style.display = '';

    // v5.33.2: Empty-state short-circuit. If the active (term, POT) has
    // no loaded snapshots, show a dedicated "no data yet" view instead
    // of letting the KPI strip / discipline table / etc. fall back to
    // stale data from a previously-selected context. The Snapshots tab
    // (manual upload UI) still renders normally — users may want to add
    // a snapshot there even for an empty context.
    const activeSnaps = activeSnapshots();
    if (activeSnaps.length === 0 && state.activeTab !== 'snapshots') {
      let body = renderTabs();
      body += renderEmptyTermPotView();
      dash.innerHTML = body;
      bindAllEvents();
      return;
    }

    let body = renderTabs();
    if (state.activeTab === 'snapshot') {
      body += renderKPIs();
      body += renderCensusBar();
      body += renderFilters();
      body += renderDisciplineSummaries();
      body += renderCourseGrid();
      body += renderTable();
    } else if (state.activeTab === 'trends') {
      // Census information surfaces in the trends view as the chart
      // marker (vertical line + pill label), not as a bar — the bar
      // only makes sense anchored to a KPI strip.
      body += renderTrendsView();
    } else if (state.activeTab === 'snapshots') {
      body += renderSnapshotManager();
    }

    dash.innerHTML = body;
    bindAllEvents();
  }

  // v5.33.2: Renders a clean "no data yet" state tailored to the active
  // (term, POT)'s lifecycle. UPCOMING terms get a "registration open,
  // check back soon" tone; IN_SESSION/ENDING_SOON get "Laura hasn't
  // uploaded a snapshot yet"; COMPLETE gets "no snapshots were recorded";
  // UNKNOWN gets a generic message. In every case, no stale data from
  // another context is visible beneath.
  function renderEmptyTermPotView() {
    const allOpts = allTermPotOptions();
    const opt = allOpts.find(o =>
      o.term === state.activeTerm && o.pot === state.activePartOfTerm
    );
    const label = termPotLabel(state.activeTerm, state.activePartOfTerm);
    const lc = opt ? opt.lifecycle : 'UNKNOWN';

    let heading, body, cta;
    if (lc === 'UPCOMING') {
      const days = opt && opt.daysToStart != null ? opt.daysToStart : null;
      heading = `${label} hasn't started yet`;
      const whenStr = days != null
        ? `Classes start in ${days} day${days === 1 ? '' : 's'}.`
        : 'Classes have not started yet.';
      body = `${whenStr} Enrollment snapshots will appear here once registration data starts flowing in.`;
      cta = `Switch to a sub-term that's in session to see current numbers.`;
    } else if (lc === 'IN_SESSION' || lc === 'ENDING_SOON') {
      heading = `${label} — no data yet`;
      body = `This sub-term is in session, but no enrollment snapshots have been loaded for it yet. Check back once reporting resumes.`;
      cta = `Switch to a different sub-term, or upload a snapshot manually from the Snapshots tab.`;
    } else if (lc === 'COMPLETE') {
      heading = `${label} — no data on record`;
      body = `This sub-term has ended and no enrollment snapshots are on record for it.`;
      cta = `Switch to a sub-term with data to continue.`;
    } else {
      heading = `${label} — no data`;
      body = `No enrollment snapshots are loaded for this sub-term.`;
      cta = `Switch to a sub-term with data from the picker above.`;
    }

    return `
      <div class="empty-term-pot" style="max-width:720px;margin:40px auto;padding:0 24px;">
        <div style="padding:36px 32px;background:var(--surface);border:1px solid var(--rule);border-left:4px solid var(--info);border-radius:4px;">
          <h2 style="font-family:'Iowan Old Style', Palatino, Georgia, serif;font-weight:400;font-size:24px;line-height:1.25;letter-spacing:-0.01em;margin:0 0 14px;color:var(--ink);">
            ${escapeHtml(heading)}
          </h2>
          <p style="font-size:14px;line-height:1.6;color:var(--ink-soft);margin:0 0 14px;">
            ${escapeHtml(body)}
          </p>
          <p style="font-size:13px;line-height:1.5;color:var(--ink-mute);margin:0;font-style:italic;">
            ${escapeHtml(cta)}
          </p>
        </div>
      </div>
    `;
  }

  // Canonical ordering for POT codes within a term.
  const POT_ORDER = ['15W', '11W', '7A', '7B', 'FULL', 'SU1', 'SU2', 'SU3'];

  // v5.33: Term code → human label fallback when term_label isn't in the
  // manifest. Parses "26FA" → "Fall 2026", "27WN" → "Winterim 2027", etc.
  function termLabelFromCode(code) {
    if (!code) return '';
    const m = String(code).match(/^(\d{2})(FA|SP|SU|WI|WN)$/i);
    if (!m) return code;
    const year = 2000 + parseInt(m[1], 10);
    const seasons = { FA: 'Fall', SP: 'Spring', SU: 'Summer', WI: 'Winter', WN: 'Winterim' };
    return `${seasons[m[2].toUpperCase()]} ${year}`;
  }

  // v5.33: Returns ALL (term, POT) options the user can select, drawn from
  // the loaded term configs AND the loaded snapshots. A term whose manifest
  // configures 4 POTs but has no snapshots yet still shows those 4 POTs
  // (as UPCOMING), so Spring 15W appears in the dropdown before Laura
  // uploads her first Spring file. Each returned entry includes lifecycle
  // metadata so the dropdown can group and sort.
  //
  // Return: [{ term, pot, lifecycle, daysToStart, daysToEnd, snapCount }, ...]
  //   lifecycle: 'UPCOMING' | 'IN_SESSION' | 'ENDING_SOON' | 'COMPLETE' | 'UNKNOWN'
  //
  // Ordering: IN SESSION first (by proximity to end), then UPCOMING (closest
  // start first), then ENDING SOON, then COMPLETE (most recent first).
  // Winterim (POT='FULL') appears before Spring POTs when both are UPCOMING
  // so chairs see the next thing to happen at the top.
  function allTermPotOptions() {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const todayTs = today.getTime();

    const opts = [];
    const seen = new Set();

    // From loaded term configs — covers POTs with no snapshots yet.
    //
    // v5.33.1 (Fix B): A term with empty pot_dates was previously assumed
    // to be single-session (Winterim-style), producing a FULL sentinel entry.
    // But if the term also carries snapshots with real POT codes (15W, 11W,
    // 7A, 7B) — which can happen with a legacy manifest that hasn't been
    // backfilled with pot_dates yet — we'd end up with BOTH a phantom FULL
    // entry AND the real POT entries from snapshots. The phantom shows as
    // "Fall 2026 — NO SNAPSHOTS YET" in the dropdown, which is confusing.
    //
    // To avoid this: when pot_dates is empty, check whether any loaded
    // snapshot for this term has a non-FULL POT. If yes, skip the phantom
    // and let the snapshot-driven path below surface the real options.
    Object.keys(state.terms).forEach(termCode => {
      const cfg = state.terms[termCode];
      const potDates = cfg.pot_dates || {};
      const pots = Object.keys(potDates);

      if (pots.length === 0) {
        // Check whether this term has any snapshots with a real (non-FULL)
        // POT. If so, don't synthesize a phantom FULL entry — the real
        // POTs will come from the snapshot-driven loop below.
        const hasRealPotSnapshots = state.snapshots.some(s =>
          (s.term || '26FA') === termCode &&
          (s.part_of_term || '15W') !== 'FULL'
        );
        if (hasRealPotSnapshots) return;

        // Genuinely single-session term (e.g. Winterim with pot_dates={}).
        // Use 'FULL' as the sentinel POT.
        const start = cfg.term_start ? new Date(cfg.term_start + 'T00:00:00').getTime() : null;
        const end = cfg.term_end ? new Date(cfg.term_end + 'T00:00:00').getTime() : null;
        opts.push(buildOption(termCode, 'FULL', start, end, todayTs));
        seen.add(termCode + '|FULL');
      } else {
        pots.forEach(pot => {
          const pd = potDates[pot] || {};
          const start = pd.start ? new Date(pd.start + 'T00:00:00').getTime() : null;
          const end = pd.end ? new Date(pd.end + 'T00:00:00').getTime() : null;
          opts.push(buildOption(termCode, pot, start, end, todayTs));
          seen.add(termCode + '|' + pot);
        });
      }
    });

    // From loaded snapshots — covers legacy snapshots that have term+pot
    // tags but whose configs don't list those pots (shouldn't happen in
    // normal operation, but defensive)
    state.snapshots.forEach(s => {
      const termCode = s.term || '26FA';
      const pot = s.part_of_term || '15W';
      const key = termCode + '|' + pot;
      if (seen.has(key)) return;
      seen.add(key);
      opts.push(buildOption(termCode, pot, null, null, todayTs));
    });

    // Snapshot counts per (term, pot)
    const counts = {};
    state.snapshots.forEach(s => {
      const key = (s.term || '26FA') + '|' + (s.part_of_term || '15W');
      counts[key] = (counts[key] || 0) + 1;
    });
    opts.forEach(o => { o.snapCount = counts[o.term + '|' + o.pot] || 0; });

    // Lifecycle rank for sort: IN_SESSION (0), ENDING_SOON (1), UPCOMING (2),
    // COMPLETE (3), UNKNOWN (4). Within each bucket, secondary sort by
    // proximity to today.
    const rank = l => ({ IN_SESSION: 0, ENDING_SOON: 1, UPCOMING: 2, COMPLETE: 3, UNKNOWN: 4 }[l] ?? 4);
    opts.sort((a, b) => {
      const r = rank(a.lifecycle) - rank(b.lifecycle);
      if (r !== 0) return r;
      // Within IN_SESSION/ENDING_SOON: sort by end date ascending (ending sooner first)
      if (a.lifecycle === 'IN_SESSION' || a.lifecycle === 'ENDING_SOON') {
        return (a.daysToEnd ?? 999) - (b.daysToEnd ?? 999);
      }
      // UPCOMING: closest start first
      if (a.lifecycle === 'UPCOMING') {
        return (a.daysToStart ?? 999) - (b.daysToStart ?? 999);
      }
      // COMPLETE: most recent end first (negative days to end, closer to 0 = more recent)
      if (a.lifecycle === 'COMPLETE') {
        return (b.daysToEnd ?? -999) - (a.daysToEnd ?? -999);
      }
      // UNKNOWN: by term then pot
      const t = a.term.localeCompare(b.term);
      if (t !== 0) return t;
      return POT_ORDER.indexOf(a.pot) - POT_ORDER.indexOf(b.pot);
    });

    return opts;
  }

  function buildOption(termCode, pot, start, end, todayTs) {
    const DAY = 86400000;
    const daysToStart = start != null ? Math.round((start - todayTs) / DAY) : null;
    const daysToEnd = end != null ? Math.round((end - todayTs) / DAY) : null;

    let lifecycle = 'UNKNOWN';
    if (start != null && end != null) {
      if (daysToStart > 0) {
        lifecycle = 'UPCOMING';
      } else if (daysToEnd < 0) {
        lifecycle = 'COMPLETE';
      } else if (daysToEnd <= 14) {
        lifecycle = 'ENDING_SOON';
      } else {
        lifecycle = 'IN_SESSION';
      }
    }

    return {
      term: termCode,
      pot,
      start,
      end,
      daysToStart,
      daysToEnd,
      lifecycle,
      snapCount: 0,
    };
  }

  // Legacy: Returns the parts of term that have at least one snapshot in the
  // CURRENTLY ACTIVE term's loaded data, sorted in canonical order. Kept for
  // backward compat with callers inside the AI assistant context and anywhere
  // else that still thinks in single-term terms.
  function availablePartsOfTerm() {
    const found = new Set();
    state.snapshots.forEach(s => {
      if ((s.term || '26FA') === state.activeTerm) {
        found.add(s.part_of_term || '15W');
      }
    });
    const known = POT_ORDER.filter(p => found.has(p));
    const extra = [...found].filter(p => !POT_ORDER.includes(p)).sort();
    return [...known, ...extra];
  }

  // Human-readable label for a POT code. 'FULL' is the sentinel for
  // single-session terms (Winterim); its label is the term name.
  function partOfTermLabel(code) {
    switch (code) {
      case '15W': return '15-week';
      case '11W': return '11-week';
      case '7A':  return '7A · first half';
      case '7B':  return '7B · second half';
      case 'FULL': return 'Full term';
      case 'SU1': return 'Summer I';
      case 'SU2': return 'Summer II';
      case 'SU3': return 'Summer III';
      default:    return code || '15-week';
    }
  }

  // v5.33: Combined label for a (term, POT) option, used in the picker
  // and the subtitle. Winterim shows as "Winterim 2027"; Spring 15W shows
  // as "Spring 2027 — 15 Weeks"; etc.
  function termPotLabel(termCode, pot) {
    const cfg = state.terms[termCode];
    const termLabel = cfg && cfg.term_label ? cfg.term_label : termLabelFromCode(termCode);
    if (pot === 'FULL') return termLabel;
    const potShort = { '15W': '15 Weeks', '11W': '11 Weeks', '7A': '7A', '7B': '7B',
                       'SU1': 'Summer I', 'SU2': 'Summer II', 'SU3': 'Summer III' }[pot] || pot;
    return `${termLabel} — ${potShort}`;
  }

  // v5.33.4: Returns the "default" POT for a given term — i.e., the POT
  // that the amber "non-default view" banner's reset button should go back
  // to. For Fall and Spring, that's '15W' (the full-semester POT). For
  // Winterim and other single-session terms, that's 'FULL' (the sentinel
  // POT). If the term config is unknown, falls back to '15W'.
  function defaultPotForTerm(termCode) {
    const cfg = state.terms[termCode];
    if (!cfg) return '15W';
    const potDates = cfg.pot_dates || {};
    const keys = Object.keys(potDates);
    // Empty pot_dates → single-session term; default POT is FULL
    if (keys.length === 0) return 'FULL';
    // Prefer 15W if available, else the first POT in canonical order
    if (potDates['15W']) return '15W';
    return POT_ORDER.find(p => potDates[p]) || keys[0];
  }

  // v5.33.4: Human-friendly label for the term+default-POT, used in the
  // amber banner's reset button. E.g. "Back to Fall 15-week" when active
  // term is 26FA.
  function termDefaultResetLabel(termCode) {
    const cfg = state.terms[termCode];
    const termShort = cfg && cfg.term_label
      ? cfg.term_label.replace(/\s+\d{4}$/, '')  // "Fall 2026" → "Fall"
      : termLabelFromCode(termCode).replace(/\s+\d{4}$/, '');
    const pot = defaultPotForTerm(termCode);
    if (pot === 'FULL') return `Back to ${termShort}`;
    return `Back to ${termShort} 15-week`;
  }

  // v5.33: Short badge text for a lifecycle state
  function lifecycleBadge(lc) {
    switch (lc) {
      case 'IN_SESSION':  return 'IN SESSION';
      case 'UPCOMING':    return 'UPCOMING';
      case 'ENDING_SOON': return 'ENDING SOON';
      case 'COMPLETE':    return 'COMPLETE';
      default:            return '';
    }
  }

  function updateHeader() {
    const snap = currentSnapshot();
    if (state.loadStatus === 'loading') {
      el('reportDate').textContent = 'Loading…';
    } else if (state.loadStatus === 'error') {
      el('reportDate').textContent = 'Load failed';
    } else if (snap) {
      el('reportDate').textContent = `Latest report: ${fmtDate(snap.date)}`;
    } else {
      el('reportDate').textContent = 'No data loaded';
    }

    // v5.33: Title subtitle shows the ACTIVE (term, POT) context, pulled
    // from state.activeTerm + state.activePartOfTerm. Pill shows the
    // combined label (e.g. "Spring 2027 — 15 Weeks"). The dropdown lists
    // ALL (term, POT) options across every loaded term, grouped by
    // lifecycle (IN SESSION / UPCOMING / ENDING SOON / COMPLETE). Each
    // entry shows a lifecycle badge and snapshot count.
    const subtitle = el('titleSubtitle');
    if (subtitle) {
      const dataIsReady = state.loadStatus !== 'loading' && state.loadStatus !== 'error';
      subtitle.style.display = dataIsReady ? 'flex' : 'none';
      if (dataIsReady) {
        const activePot = state.activePartOfTerm;
        const activeTerm = state.activeTerm;
        const label = termPotLabel(activeTerm, activePot);

        // v5.33.6: In multi-term, every (term, POT) selection is a
        // legitimate choice. The pill no longer gets amber "non-default"
        // treatment — all selections look the same, and the user navigates
        // between them via the dropdown without being warned they're on
        // something "unusual."
        const allOpts = allTermPotOptions();

        const pillLabel = el('titlePotPillLabel');
        if (pillLabel) pillLabel.textContent = label;
        const pillBtn = el('titlePotPill');
        if (pillBtn) {
          pillBtn.classList.remove('is-non-default');
          pillBtn.setAttribute('aria-expanded', pillBtn.getAttribute('aria-expanded') === 'true' ? 'true' : 'false');
        }

        // Rebuild the dropdown menu with cross-term options, grouped by
        // lifecycle. data-pot now carries the compound "term|pot" key.
        const menu = el('potMenu');
        if (menu) {
          const activeKey = activeTerm + '|' + activePot;
          const grouped = { IN_SESSION: [], ENDING_SOON: [], UPCOMING: [], COMPLETE: [], UNKNOWN: [] };
          allOpts.forEach(o => grouped[o.lifecycle].push(o));

          const groupTitle = {
            IN_SESSION: 'In session',
            ENDING_SOON: 'Ending soon',
            UPCOMING: 'Upcoming',
            COMPLETE: 'Completed',
            UNKNOWN: 'Other',
          };

          const renderOpt = o => {
            const key = o.term + '|' + o.pot;
            const isActive = key === activeKey;
            const check = isActive ? '<span class="check" aria-hidden="true">✓</span>' : '<span class="check" aria-hidden="true" style="visibility:hidden">✓</span>';
            const countLabel = o.snapCount === 0 ? 'no snapshots yet'
                             : o.snapCount === 1 ? '1 snapshot'
                             : `${o.snapCount} snapshots`;
            const dim = o.lifecycle === 'COMPLETE' ? ' style="opacity:0.65"' : '';
            return `
              <button type="button" class="pot-menu-item ${isActive ? 'is-active' : ''}" role="option" data-pot="${escapeHtml(key)}" aria-selected="${isActive}"${dim}>
                ${check}
                <span class="label">${escapeHtml(termPotLabel(o.term, o.pot))}</span>
                <span class="count">${countLabel}</span>
              </button>
            `;
          };

          let html = '';
          ['IN_SESSION', 'ENDING_SOON', 'UPCOMING', 'COMPLETE', 'UNKNOWN'].forEach(lc => {
            if (grouped[lc].length === 0) return;
            html += `<div class="pot-menu-group-head" aria-hidden="true" style="padding:6px 14px 2px;font-size:10px;letter-spacing:0.08em;color:var(--ink-mute);font-weight:600;text-transform:uppercase;">${groupTitle[lc]}</div>`;
            html += grouped[lc].map(renderOpt).join('');
          });
          menu.innerHTML = html;
        }

        // v5.33.6: Amber "non-default view" banner removed. See the
        // HTML comment near the former <div id="potBanner"> for rationale.
      }
    }

    if (state.selectedDisciplines.size === 0) {
      el('disciplineSummary').textContent = 'No disciplines selected';
    } else {
      const list = [...state.selectedDisciplines].sort();
      const display = list.length <= 4 ? list.join(' · ') : `${list.slice(0, 3).join(' · ')} +${list.length - 3} more`;
      el('disciplineSummary').textContent = display;
    }

    const potSnapCount = activeSnapshots().length;
    el('snapshotCount').textContent =
