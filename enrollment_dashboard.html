  // v5.33: Lifecycle-aware "phase" string for a (term, POT) option. Returns
  // what the assistant should emphasize for that option: registration seats,
  // add/drop activity, mid-term stability, or completed-term retrospective.
  function phaseTextV2(opt) {
    const cfg = state.terms[opt.term];
    const census = cfg && cfg.census && cfg.census[opt.pot];
    switch (opt.lifecycle) {
      case 'UPCOMING':
        return `registration open, classes start in ${opt.daysToStart} day${opt.daysToStart === 1 ? '' : 's'} on ${new Date(opt.start).toISOString().slice(0, 10)} (focus: open seats, waitlists, course mix)`;
      case 'IN_SESSION':
        return census ? `classes under way, census ${census}${opt.daysToEnd != null ? `, ${opt.daysToEnd} day${opt.daysToEnd === 1 ? '' : 's'} until term ends` : ''} (focus: current enrollment, movement, waitlists if still pre-census)`
                      : `classes under way${opt.daysToEnd != null ? `, ${opt.daysToEnd} days until term ends` : ''}`;
      case 'ENDING_SOON':
        return `classes nearing end (${opt.daysToEnd} days remaining; focus: final enrollment, SCH, FTE)`;
      case 'COMPLETE':
        return `term complete (ended ${Math.abs(opt.daysToEnd)} days ago; focus: retrospective numbers only, waitlists not meaningful)`;
      default:
        return 'lifecycle unknown';
    }
  }

  // Legacy phase helper used by assistantSuggestions. Looks up by POT alone
  // in the active term, so pre-v5.33 single-term logic still works for
  // suggested questions.
  function potPhase(pot) {
    const termCfg = state.terms[state.activeTerm];
    const census = termCfg && termCfg.census && termCfg.census[pot];
    if (!census) return null;
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const c = new Date(census + 'T00:00:00');
    const days = Math.round((c - today) / 86400000);
    return { census, days, phase: days > 10 ? 'registration' : days >= 0 ? 'early' : 'settled' };
  }
  function phaseText(pot) {
    const ph = potPhase(pot);
    if (!ph) return 'census date not set';
    if (ph.phase === 'registration') return `registration open, classes not started yet, census ${ph.census} (open seats and waitlists matter now)`;
    if (ph.phase === 'early') return `classes under way, census ${ph.census} is ${ph.days === 0 ? 'today' : `in ${ph.days} day${ph.days === 1 ? '' : 's'}`} (add/drop period)`;
    return `census ${ph.census} has passed, enrollment is largely set (current waitlists are not meaningful)`;
  }

  window.getAssistantContext = function (question) {
    const q = String(question || '');
    const BUDGET = 22000;
    if (state.loadStatus !== 'loaded') {
      return 'ENROLLMENT DATA: not loaded yet. Tell the user to wait for the dashboard to finish loading, or to select Refresh.';
    }

    const pct = (a, b) => (b ? Math.round((1000 * a) / b) / 10 + '%' : 'n/a');
    const open = r => Math.max(0, r['Avail Seats'] || 0);
    function totals(rows) {
      const t = { sections: rows.length, cap: 0, enr: 0, open: 0, wl: 0, sch: 0 };
      rows.forEach(r => {
        t.cap += r.Capacity; t.enr += r['Enrolled Students']; t.open += open(r);
        t.wl += r['Wait List']; t.sch += r['Total Student Credit Hours'];
      });
      return t;
    }

    // Newest snapshot for each (term, POT) combination
    const latest = {};
    state.snapshots.forEach(s => {
      const key = (s.term || '26FA') + '|' + (s.part_of_term || '15W');
      if (!latest[key] || s.date >= latest[key].date) latest[key] = s;
    });

    // All configured (term, POT) options, pre-sorted by lifecycle. Includes
    // UPCOMING options that have no snapshots yet (Spring POTs before
    // Laura starts uploading).
    const options = allTermPotOptions();

    const activeTermLabel = termLabelFromCode(state.activeTerm);
    const activeLabel = termPotLabel(state.activeTerm, state.activePartOfTerm);

    // Header
    const lines = [
      'ENROLLMENT DATA (across all loaded terms, from the dashboard\'s loaded data for all disciplines, not just what is on screen)',
      `The user is currently viewing: ${activeLabel}. Disciplines selected on screen: ${state.selectedDisciplines.size ? [...state.selectedDisciplines].join(', ') : 'none'}.`,
      `Today is ${new Date().toISOString().slice(0, 10)}.`,
      'Open seats = Avail Seats from the college report. Fill = enrolled / capacity. FTE = student credit hours / 30. Special projects (-295) and internships (-299) are excluded.',
      'Answer forward-looking questions ("how are things?", "what should I watch for?") using the IN SESSION and UPCOMING terms. Answer retrospective questions about completed terms using the COMPLETED block. When the user names a specific term or sub-term, scope your answer there.',
      '',
    ];

    // LAYER 1: Forward-looking — IN SESSION + UPCOMING + ENDING SOON
    const forward = options.filter(o => o.lifecycle === 'IN_SESSION' || o.lifecycle === 'ENDING_SOON' || o.lifecycle === 'UPCOMING');
    const completed = options.filter(o => o.lifecycle === 'COMPLETE');

    if (forward.length > 0) {
      lines.push('FORWARD-LOOKING (what chairs can still act on):');
      forward.forEach(opt => {
        const key = opt.term + '|' + opt.pot;
        const snap = latest[key];
        const label = termPotLabel(opt.term, opt.pot);
        if (snap) {
          const t = totals(snap.rows);
          lines.push(`- ${label} [${lifecycleBadge(opt.lifecycle)}] — snapshot ${snap.date}; ${phaseTextV2(opt)}: ${t.sections} sections, ${t.enr}/${t.cap} enrolled (${pct(t.enr, t.cap)} fill), ${t.open} open seats, waitlist ${t.wl}, SCH ${t.sch}, FTE ${(t.sch / 30).toFixed(1)}`);
        } else {
          lines.push(`- ${label} [${lifecycleBadge(opt.lifecycle)}] — ${phaseTextV2(opt)}; no snapshots loaded for this part of term yet.`);
        }
      });
      lines.push('');
    }

    // LAYER 2: Historical — completed POTs with final numbers
    if (completed.length > 0) {
      lines.push('COMPLETED (retrospective context — use when the user asks about these terms):');
      completed.forEach(opt => {
        const key = opt.term + '|' + opt.pot;
        const snap = latest[key];
        const label = termPotLabel(opt.term, opt.pot);
        if (snap) {
          const t = totals(snap.rows);
          lines.push(`- ${label} [COMPLETE] — final snapshot ${snap.date}: ${t.sections} sections, ${t.enr}/${t.cap} enrolled (${pct(t.enr, t.cap)} fill), SCH ${t.sch}, FTE ${(t.sch / 30).toFixed(1)}`);
        } else {
          lines.push(`- ${label} [COMPLETE] — no snapshots recorded.`);
        }
      });
      lines.push('');
    }

    // College FTE across all parts of term, for the ACTIVE term only
    let collegeSch = 0;
    const activeTermPots = options.filter(o => o.term === state.activeTerm);
    activeTermPots.forEach(o => {
      const key = o.term + '|' + o.pot;
      if (latest[key]) collegeSch += totals(latest[key].rows).sch;
    });
    const goal = fteGoal();
    if (collegeSch > 0 || goal) {
      lines.push(`${activeTermLabel} College FTE (all parts of term): ${(collegeSch / 30).toFixed(1)}${goal ? ` against a goal of ${goal}` : ''}.`);
    }
    const header = lines.join('\n');

    // Downstream detail / history blocks (unchanged from v5.32) operate on
    // snapshots within the ACTIVE term, keyed by POT. Rebuild a simpler
    // index for them that mirrors the pre-v5.33 shape.
    const activeTerm = state.activeTerm || '26FA';
    const activePot = state.activePartOfTerm;
    const latestActive = {};
    state.snapshots.forEach(s => {
      if ((s.term || '26FA') !== activeTerm) return;
      const pot = s.part_of_term || '15W';
      if (!latestActive[pot] || s.date >= latestActive[pot].date) latestActive[pot] = s;
    });
    const pots = POT_ORDER.filter(p => latestActive[p]);
    const termLabel = activeTermLabel;

    // Which parts of term the question is about (else the one on screen)
    const potPatterns = [
      ['15W', /\b(15|fifteen)[\s-]?(w|wks?|weeks?)\b|full[\s-]semester/i],
      ['11W', /\b(11|eleven)[\s-]?(w|wks?|weeks?)\b|late[\s-]start/i],
      ['7A', /\b(7|seven)[\s-]?a('?s)?\b|first\s+(half|7|seven)/i],
      ['7B', /\b(7|seven)[\s-]?b('?s)?\b|second\s+(half|7|seven)/i],
      ['SU1', /\bsu[\s-]?1\b|summer\s+(1|i|one)\b/i],
      ['SU2', /\bsu[\s-]?2\b|summer\s+(2|ii|two)\b/i],
      ['SU3', /\bsu[\s-]?3\b|summer\s+(3|iii|three)\b/i],
    ];
    let focus = /\b(all|every|each)\b.*\b(parts? of term|sessions?)\b/i.test(q)
      ? pots.slice()
      : potPatterns.filter(([p, re]) => latestActive[p] && re.test(q)).map(([p]) => p);
    if (!focus.length) focus = [latestActive[state.activePartOfTerm] ? state.activePartOfTerm : pots[0]];
    // If still nothing (no snapshots in active term at all — e.g. empty
    // Spring at page load), bail with the header alone.
    if (!focus.length) {
      return header;
    }

    // Courses (NETW 110, NETW-110) and discipline prefixes (NETW) named in the question
    const prefixes = new Set();
    Object.values(state.instituteIndex).forEach(list => list.forEach(p => prefixes.add(p)));
    const courseHits = new Set(), prefixHits = new Set();
    (q.match(/\b[A-Za-z]{2,5}[\s-]?\d{3}[A-Za-z]*\b/g) || []).forEach(tok => {
      const mm = tok.match(/^([A-Za-z]{2,5})[\s-]?(\d{3}[A-Za-z]*)$/);
      if (mm && prefixes.has(mm[1].toUpperCase())) courseHits.add(mm[1].toUpperCase() + '-' + mm[2].toUpperCase());
    });
    prefixes.forEach(p => { if (new RegExp('\\b' + p + '\\b').test(q)) prefixHits.add(p); });
    const filtered = courseHits.size > 0 || prefixHits.size > 0;
    const matches = r => prefixHits.has(r._prefix) ||
      [...courseHits].some(c => String(r.Course).toUpperCase().startsWith(c));

    const secLine = r => `${r.Section} | ${r['Course Title'] || ''} | ${r['Enrolled Students']}/${r.Capacity} enrolled | ${open(r)} open | waitlist ${r['Wait List']} | ${r['Meeting Days'] || '-'} ${r['Section Start Time'] || ''} | ${r.Location || '-'} | ${r.Instructor || 'TBA'}`;

    function block(pot, level) {
      let rows = latestActive[pot].rows;
      if (filtered) rows = rows.filter(matches);
      const head = `\n${partOfTermLabel(pot).toUpperCase()} (snapshot ${latestActive[pot].date})` +
        (filtered ? ', only the courses or disciplines asked about' : ', all disciplines') +
        `: ${rows.length} sections, listed by ${level}`;
      if (!rows.length) return head + '\n(no matching sections)';
      if (level === 'section') {
        return head + '\n' + rows.slice().sort((a, b) => String(a.Section).localeCompare(String(b.Section))).map(secLine).join('\n');
      }
      const key = level === 'course' ? r => r.Course : r => r._prefix;
      const groups = new Map();
      rows.forEach(r => { const k = key(r); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); });
      return head + '\n' + [...groups.keys()].sort().map(k => {
        const g = groups.get(k), t = totals(g);
        const name = level === 'course' ? `${k} ${g[0]['Course Title'] || ''}` : k;
        return `${name}: ${t.sections} sections (${g.filter(r => open(r) > 0).length} with open seats), ${t.enr}/${t.cap} enrolled (${pct(t.enr, t.cap)}), ${t.open} open seats, waitlist ${t.wl}`;
      }).join('\n');
    }

    // History: questions about earlier snapshots, trends or peaks get a
    // snapshot-by-snapshot series plus the sections with the largest waitlists.
    const historyMode = /\b(snapshots?|histor(y|ical)|trends?|over time|over the (term|semester)|earlier|previous|past|peak|week[\s-]by[\s-]week|week[\s-]to[\s-]week|since|grew|growth|changed?|planning|before classes)\b/i.test(q);
    let history = '';
    if (historyMode) {
      const HIST_BUDGET = 12000;
      history = focus.map(pot => {
        const snaps = state.snapshots.filter(s =>
            (s.term || '26FA') === activeTerm &&
            (s.part_of_term || '15W') === pot
          ).slice().sort((a, b) => a.date.localeCompare(b.date));
        const series = snaps.map(s => {
          const rows = filtered ? s.rows.filter(matches) : s.rows;
          const t = totals(rows);
          return {
            date: s.date, t,
            withWl: rows.filter(r => r['Wait List'] > 0).length,
            full: rows.filter(r => r.Capacity > 0 && open(r) === 0).length,
          };
        });
        const fmt = x => `${x.date}: ${x.t.sections} sec, ${x.t.enr}/${x.t.cap} enrolled (${pct(x.t.enr, x.t.cap)}), ${x.t.open} open, waitlist ${x.t.wl} in ${x.withWl} sec, ${x.full} full`;
        let list = series, thinned = false;
        if (series.map(fmt).join('\n').length > HIST_BUDGET / focus.length - 2500) {
          // Too many snapshots: keep about 40 evenly spaced, plus the 10 with the largest waitlists
          const step = Math.ceil(series.length / 40);
          const top = new Set(series.slice().sort((a, b) => b.t.wl - a.t.wl).slice(0, 10));
          list = series.filter((x, i) => i % step === 0 || i === series.length - 1 || top.has(x));
          thinned = true;
        }
        // Each section's largest waitlist in any snapshot
        const peak = new Map();
        snaps.forEach(s => (filtered ? s.rows.filter(matches) : s.rows).forEach(r => {
          const cur = peak.get(r.Section);
          if (r['Wait List'] > 0 && (!cur || r['Wait List'] > cur.wl)) {
            peak.set(r.Section, { wl: r['Wait List'], date: s.date, title: r['Course Title'] || '' });
          }
        }));
        const latestWl = new Map(latestActive[pot].rows.map(r => [r.Section, r['Wait List']]));
        const peaks = [...peak.entries()].sort((a, b) => b[1].wl - a[1].wl).slice(0, 15)
          .map(([sec, v]) => `${sec} | ${v.title} | peak waitlist ${v.wl} on ${v.date} | waitlist now ${latestWl.has(sec) ? latestWl.get(sec) : 'section not in newest snapshot'}`);
        return `\n${partOfTermLabel(pot).toUpperCase()} HISTORY` +
          (filtered ? ', only the courses or disciplines asked about' : ', all disciplines') +
          ` (${snaps.length} snapshots, oldest first${thinned ? '; showing evenly spaced snapshots plus the 10 with the largest total waitlist' : ''}):\n` +
          list.map(fmt).join('\n') +
          '\nSections with the largest waitlist in any snapshot:\n' + (peaks.length ? peaks.join('\n') : '(no waitlists recorded)');
      }).join('\n') +
        '\n[Columns: date, sections (sec), enrolled/capacity, open seats, total waitlist and how many sections have one, full sections. A waitlist count is a point-in-time figure for that snapshot date; adding waitlists across snapshots counts the same students more than once.]';
    }

    // Finest level of detail that fits: sections, then courses, then disciplines
    const levels = filtered ? ['section'] : ['section', 'course', 'discipline'];
    let detail = '', used = '';
    for (const lv of levels) {
      detail = focus.map(p => block(p, lv)).join('\n');
      used = lv;
      if (header.length + history.length + detail.length <= BUDGET) break;
    }
    let note = '';
    if (header.length + history.length + detail.length > BUDGET) {
      detail = detail.slice(0, Math.max(0, BUDGET - header.length - history.length - 300));
      note = '\n[List cut off for length. Ask the user to name a discipline prefix or course, such as NETW or NETW-110.]';
    } else if (used !== 'section') {
      note = `\n[Listed by ${used} because the full section list is too long. For specific sections, ask the user to name a discipline prefix or course, such as NETW or NETW-110.]`;
    }
    const others = pots.filter(p => !focus.includes(p)).map(partOfTermLabel);
    if (others.length) {
      note += `\n[Detailed lists above cover only ${focus.map(partOfTermLabel).join(' and ')}. The summary covers every part of term. For detail on ${others.join(', ')}, ask the user to name that part of term in their question, for example "7B" or "11-week". The data is not limited by the menu on screen.]`;
    }
    return header + '\n' + history + '\n' + detail + note;
  };

  // Suggested questions for the chat, chosen from where each part of term is
  // right now and from the user's selected disciplines. enrollment-assistant.js
  // calls this each time it shows suggestions. [Brackets] mark text the user
  // types over.
  window.assistantSuggestions = function () {
    if (state.loadStatus !== 'loaded') return null;   // the widget falls back to its own list
    const pots = availablePartsOfTerm();
    const disc = state.selectedDisciplines.size ? `[${[...state.selectedDisciplines].sort()[0]}]` : '[your discipline]';
    const ask = {
      registration: L => [
        `Which ${L} courses still have open seats?`,
        `Which ${L} sections have waitlists right now?`,
        `Which ${L} sections are below 50% fill?`,
        `Which ${L} sections still have open seats in ${disc}?`,
      ],
      early: (L, ph) => [
        `Which ${L} sections still have open seats before the ${fmtDateShort(ph.census)} census?`,
        `How has ${L} enrollment changed since the last snapshot?`,
        `Which ${L} sections are below 50% fill in ${disc}?`,
      ],
      settled: (L, ph) => [
        `How did ${L} enrollment change between the ${fmtDateShort(ph.census)} census and now?`,
        `Which ${L} sections are below 50% fill in ${disc}?`,
        `Which ${L} disciplines have the highest fill?`,
        `For planning next year: which ${L} sections had the largest waitlists before classes started?`,
      ],
    };
    // Parts of term still enrolling come first, then the one on screen, then the rest
    const rank = p => { const ph = potPhase(p); return !ph ? 3 : ph.phase === 'registration' ? 0 : ph.phase === 'early' ? 1 : p === state.activePartOfTerm ? 2 : 3; };
    const ordered = pots.slice().sort((a, b) => rank(a) - rank(b));
    const short = p => ({ '7A': '7A', '7B': '7B' })[p] || partOfTermLabel(p);
    const out = [];
    ordered.forEach((p, i) => {
      const ph = potPhase(p);
      const qs = ask[ph ? ph.phase : 'settled'](short(p), ph || { census: 'census' });
      out.push(...qs.slice(0, i === 0 ? 2 : 1));      // two from the top part of term, one from each other
    });
    out.splice(2, 0, 'How close are we to the college FTE goal?');
    const extras = [];
    ordered.forEach(p => { const ph = potPhase(p); extras.push(...ask[ph ? ph.phase : 'settled'](short(p), ph || { census: 'census' })); });
    extras.forEach(q => { if (!out.includes(q)) out.push(q); });
    // Keep one fill-in-your-discipline question among the first four shown,
    // preferring the part of term on screen
    const activeShort = short(state.activePartOfTerm);
    const di = out.findIndex(q => q.includes(disc) && q.includes(activeShort));
    const dj = di >= 0 ? di : out.findIndex(q => q.includes(disc));
    if (dj > 3) out.splice(3, 0, out.splice(dj, 1)[0]);
    return out;
  };
})();
</script>
  <script src="enrollment-assistant.js" defer></script>
</body>
</html>
