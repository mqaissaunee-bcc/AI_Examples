            <span class="code">Section</span><span>Location</span><span>Format</span><span>Fill</span><span>Waitlist</span><span>Days</span><span>Time</span><span>Instructor</span>
          </div>`;

      // Build the "show all / collapse" toggle (only when truncating could apply)
      let triggeredTruncatedMsg = '';
      if (!naturallyFits) {
        triggeredTruncatedMsg = triggeredExpanded
          ? `<div class="cg-truncation-note"><button type="button" class="cg-toggle-link" data-grouped-toggle="${escapeHtml(triggeredExpansionKey)}">show fewer</button></div>`
          : `<div class="cg-truncation-note">Showing first 6 of ${triggeredSections.length} · <button type="button" class="cg-toggle-link" data-grouped-toggle="${escapeHtml(triggeredExpansionKey)}">show all</button></div>`;
      }

      const triggeredPanel = `
        <div class="cg-triggered-sections">
          <div class="cg-panel-label">${bucket === 'empty' ? 'Empty sections' : 'Full sections'} (${triggeredSections.length})</div>
          ${triggeredHeaderRow}
          ${triggeredRowsHTML}
          ${triggeredTruncatedMsg}
        </div>
      `;

      // Render alternatives — split into priority (50%+ full) and more-room
      let alternativesPanel = '';
      if (alternatives.length === 0) {
        // The warning text adapts based on whether this course has just one
        // section or multiple. With one section, there's nothing to say about
        // "course-level problems" or "intervention" — it's just that the only
        // section is empty/full. With multiple sections all in the same state,
        // the broader "this is a course-level concern" framing is genuine and
        // worth surfacing.
        let warningText;
        if (totalSections === 1) {
          warningText = bucket === 'empty'
            ? `⚠ <strong>The only section of ${escapeHtml(courseCode)} is empty.</strong>`
            : `⚠ <strong>The only section of ${escapeHtml(courseCode)} is at or over capacity.</strong>`;
        } else {
          warningText = bucket === 'empty'
            ? `⚠ <strong>No in-course alternatives</strong> — all ${totalSections} sections of ${escapeHtml(courseCode)} are empty. This suggests a course-level enrollment problem, not a section-specific one. Cancellation or marketing-side intervention may be needed at the course level.`
            : `⚠ <strong>No in-course alternatives</strong> — all ${totalSections} sections of ${escapeHtml(courseCode)} are at or over capacity. Consider opening additional sections; redirecting waitlisted students within this course is not possible.`;
        }
        alternativesPanel = `<div class="cg-alternatives"><div class="cg-no-alts-warning">${warningText}</div></div>`;
      } else {
        // Merge all alternatives into a single list sorted by fill descending.
        // Rows that are 50%+ full retain a subtle green-tinted background as
        // a visual leverage cue, but the explicit grouping headings are gone —
        // the fill bar plus the row tint communicates the same thing without
        // editorial labels.
        const sortedAlts = alternatives.slice().sort((a, b) => {
          const fa = Number(a['Section Fill %']) || 0;
          const fb = Number(b['Section Fill %']) || 0;
          return fb - fa;
        });

        function renderAltRow(s) {
          const sectionCode = s.Section.split('-').slice(-1)[0] || s.Section;
          const enr = Number(s['Enrolled Students']) || 0;
          const cap = Number(s.Capacity) || 0;
          const fillPct = cap > 0 ? (enr / cap * 100) : 0;
          const isPriority = fillPct >= 50;
          const open = Math.max(0, cap - enr);
          const days = cleanCell(s['Meeting Days'], '—');
          const time = cleanCell(s['Section Start Time'], 'TBA');
          const instructor = cleanCell(s.Instructor, '');
          const instructorHTML = instructor ? escapeHtml(instructor) : '<span class="cg-instr-tba">TBA</span>';
          const formatTag = formatTagFor(s);
          const locationCode = cleanCell(s.Location, '—');
          const fillBarWidth = Math.min(100, fillPct);
          const overCap = fillPct > 100;
          return `
            <div class="cg-alt-row ${isPriority ? 'priority' : ''}">
              <span class="code">${escapeHtml(sectionCode)}</span>
              <span><span class="cg-fill-bar"><span class="cg-fill-bar-inner ${overCap ? 'over' : ''}" style="width:${fillBarWidth}%"></span></span> ${enr}/${cap}</span>
              <span class="right cg-open">${open}</span>
              <span>${escapeHtml(locationCode)}</span>
              <span>${formatTag}</span>
              <span>${escapeHtml(days)}</span>
              <span>${escapeHtml(time)} · ${instructorHTML}</span>
            </div>
          `;
        }

        // Truncate long lists; per-course expansion state persists the toggle
        const MAX_ALTS_VISIBLE = 8;
        const altKey = `${courseCode}:alts`;
        const altsExpanded = state.groupedExpansion[altKey] === true;
        const visibleAlts = altsExpanded ? sortedAlts : sortedAlts.slice(0, MAX_ALTS_VISIBLE);
        const remaining = sortedAlts.length - visibleAlts.length;

        let truncationMsg = '';
        if (altsExpanded && sortedAlts.length > MAX_ALTS_VISIBLE) {
          truncationMsg = `<div class="cg-truncation-note"><button type="button" class="cg-toggle-link" data-grouped-toggle="${escapeHtml(altKey)}">show fewer</button></div>`;
        } else if (remaining > 0) {
          truncationMsg = `<div class="cg-truncation-note">+ ${remaining} more — <button type="button" class="cg-toggle-link" data-grouped-toggle="${escapeHtml(altKey)}">show all</button></div>`;
        }

        // Column header row mirrors the visual columns of the alt rows below
        const altHeader = `
          <div class="cg-alt-row cg-alt-header">
            <span class="code">Section</span>
            <span>Fill</span>
            <span class="right">Open</span>
            <span>Location</span>
            <span>Format</span>
            <span>Days</span>
            <span>Time · Instructor</span>
          </div>
        `;

        alternativesPanel = `
          <div class="cg-alternatives">
            <div class="cg-panel-label">${bucket === 'empty' ? 'Available alternatives in ' + escapeHtml(courseCode) : 'Sections with room in ' + escapeHtml(courseCode)} (${alternatives.length})</div>
            ${altHeader}
            ${visibleAlts.map(renderAltRow).join('')}
            ${truncationMsg}
          </div>
        `;
      }

      const groupClass = bucket === 'empty' ? 'cg-empty' : 'cg-full';

      return `
        <div class="cg-panel ${groupClass}" style="border-left-color:${color}">
          <div class="cg-panel-head">
            <div>
              <span class="cg-course-id">${escapeHtml(courseCode)}</span>
              <span class="cg-course-title">${escapeHtml(courseTitle)}</span>
            </div>
            <div class="cg-course-stats">${courseStats}</div>
          </div>
          ${waitlistCallout}
          ${placeholderNote}
          ${triggeredPanel}
          ${alternativesPanel}
        </div>
      `;
    }).join('');

    const totalCourses = courseOrder.length;
    const totalTriggered = searched.length;
    const subtitle = bucket === 'empty'
      ? `${totalTriggered} empty section${totalTriggered === 1 ? '' : 's'} across ${totalCourses} course${totalCourses === 1 ? '' : 's'}`
      : `${totalTriggered} full section${totalTriggered === 1 ? '' : 's'} across ${totalCourses} course${totalCourses === 1 ? '' : 's'}`;

    return `
      <div class="section-title">Full Section Detail <span class="meta">${subtitle}</span></div>
      ${renderTableToolbar(triggered.length, searched.length, tokens.length > 0)}
      <div class="cg-container">
        ${panels}
      </div>
    `;
  }

  // Helper: format/modality tag for a section (used in both triggered rows and alternatives)
  function formatTagFor(s) {
    const sec = String(s.Section || '');
    const loc = String(s.Location || '').toUpperCase();
    // Distance Ed section codes contain "DE" or location is DE
    if (/-DE\d/.test(sec) || loc === 'DE') {
      return '<span class="cg-format-tag online">Online async</span>';
    }
    // Evening: 800-series section codes (legacy convention at Brookdale)
    if (/-8\d{2}/.test(sec)) {
      return '<span class="cg-format-tag evening">Evening</span>';
    }
    // Wall campus
    if (loc === 'WALL') {
      return '<span class="cg-format-tag wall">Wall campus</span>';
    }
    return '<span class="cg-format-tag in-person">In-person</span>';
  }

  // Helper: shared toolbar (search box + match count) extracted so both list
  // and grouped renderers can use it
  function renderTableToolbar(totalCount, matchCount, hasActiveSearch) {
    const matchHTML = hasActiveSearch
      ? `<span class="search-count">${fmtInt(matchCount)} of ${fmtInt(totalCount)}</span>`
      : '';
    return `
      <div class="table-toolbar">
        <div class="table-search">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input
            type="text"
            id="tableSearchInput"
            class="search-input"
            placeholder='Search — try "ENGI 101 LINC" or "Powell M W" or "MATH T TH"'
            value="${escapeHtml(state.tableSearch)}"
            autocomplete="off"
            spellcheck="false">
          ${state.tableSearch ? `<button class="search-clear" id="tableSearchClear" type="button" aria-label="Clear search">×</button>` : ''}
        </div>
        ${matchHTML}
      </div>
    `;
  }

  /* =========================================================================
   * TRENDS VIEW
   * ========================================================================= */

  function renderTrendsView() {
    // Iterate the snapshots belonging to the current part-of-term only.
    // Historical comparisons, movers, and waitlist counts are all
    // per-POT — comparing a 15W snapshot against a 7A snapshot would be
    // meaningless.
    const snaps = activeSnapshots();
    if (snaps.length < 2) {
      return `
        <div class="welcome" style="margin-top:32px">
          <h2>One snapshot so far.</h2>
          <p>Trends become visible once you've uploaded a second report. Each new release adds a point to the timeline.</p>
        </div>
      `;
    }

    let present = [...state.selectedDisciplines]
      .filter(p => snaps.some(s => s.rows.some(r => r._prefix === p)))
      .sort();

    // Honor the discipline filter chips here too, so the trends chart focuses
    // on what the user has narrowed to.
    if (state.activeDisciplineFilter.size > 0) {
      present = present.filter(p => state.activeDisciplineFilter.has(p));
    }

    // Build series per discipline
    const series = present.map(p => {
      const enr = snaps.map(s => sum(s.rows.filter(r => r._prefix === p), 'Enrolled Students'));
      const fill = snaps.map(s => {
        const rows = s.rows.filter(r => r._prefix === p);
        const cap = sum(rows, 'Capacity');
        const en = sum(rows, 'Enrolled Students');
        return cap > 0 ? (en / cap * 100) : 0;
      });
      return { code: p, color: colorFor(p), enr, fill };
    });

    // College-wide reference series (rendered as dashed line on charts when toggle is on)
    const cwSeries = state.showBenchmarks ? {
      code: 'College',
      color: 'var(--flat)',
      dashed: true,
      enr: snaps.map(s => sum(s.rows, 'Enrolled Students')),
      fill: snaps.map(s => {
        const cap = sum(s.rows, 'Capacity');
        const en = sum(s.rows, 'Enrolled Students');
        return cap > 0 ? (en / cap * 100) : 0;
      }),
    } : null;

    const dates = snaps.map(s => fmtDateShort(s.date));

    // Census marker — the vertical line sits at the census date on the
    // chart's x-axis, but the enrollment count labeled on the pill comes
    // from the day-after snapshot (silent — same rule as the banner, see
    // activeCensusInfo). Falls back to the census-date snapshot if no
    // day-after snapshot exists. Null if no census set, census date in
    // the future, or neither snapshot exists.
    let censusIndex = -1;
    let censusEnrolled = null;
    if (state.census) {
      const pot = state.activePartOfTerm || '15W';
      const censusDate = state.census[pot];
      if (censusDate) {
        const todayIso = new Date().toISOString().slice(0, 10);
        if (censusDate <= todayIso) {
          // The vertical line lands at the census-date snapshot's x
          // position. If there's no snapshot on the census date itself,
          // fall back to the day-after snapshot (so the line still
          // appears, just one tick to the right).
          censusIndex = snaps.findIndex(s => s.date === censusDate);
          if (censusIndex < 0) {
            const d = new Date(censusDate + 'T00:00:00');
            d.setDate(d.getDate() + 1);
            const dayAfter = d.toISOString().slice(0, 10);
            censusIndex = snaps.findIndex(s => s.date === dayAfter);
          }
          // Separately, pull the enrollment number from the day-after
          // snapshot (preferred) or the census-date snapshot (fallback).
          // This is independent of where the line is drawn — the number
          // the pill shows is the census-of-record value.
          const d2 = new Date(censusDate + 'T00:00:00');
          d2.setDate(d2.getDate() + 1);
          const dayAfterIso = d2.toISOString().slice(0, 10);
          let valueSnap = snaps.find(s => s.date === dayAfterIso);
          if (!valueSnap) valueSnap = snaps.find(s => s.date === censusDate);
          if (valueSnap) {
            censusEnrolled = sum(valueSnap.rows, 'Enrolled Students');
          }
        }
      }
    }

    // Movers — biggest enrollment changes over the selected comparison
    // window. Two modes:
    //   'previous' (default) → firstSnap is the snapshot immediately
    //     before lastSnap. Answers "what moved since our last data
    //     drop" — the daily/weekly momentum view chairs use.
    //   'start' → firstSnap is snaps[0], the earliest snapshot in the
    //     active POT's history. Answers "what moved since registration
    //     opened" — the term-retrospective view.
    // The Stalled panel uses a wider window in 'previous' mode
    // (last 5 snapshots) since "no growth over one day" is trivially
    // true for most sections; a week-long stall is a real signal.
    const moverWindow = state.moverWindow || 'previous';
    const lastSnap = snaps[snaps.length - 1];
    const firstSnap = moverWindow === 'previous'
      ? snaps[snaps.length - 2]
      : snaps[0];
    // For the Stalled panel: if we're in short-window mode, look back
    // ~5 snapshots (roughly a week at the current cadence). If we're in
    // start-mode, use the same firstSnap as everything else.
    const stalledLookback = moverWindow === 'previous'
      ? snaps[Math.max(0, snaps.length - 6)]
      : firstSnap;

    const allSections = new Set();
    // Only iterate the two comparison snapshots. Iterating all snaps
    // (as the old code did) is expensive and unnecessary here.
    [firstSnap, lastSnap, stalledLookback].forEach(s => s.rows.forEach(r => {
      if (state.selectedDisciplines.has(r._prefix)) allSections.add(r.Section);
    }));

    // Build movers using the primary window (firstSnap → lastSnap)
    const movers = [...allSections].map(sec => {
      const fr = firstSnap.rows.find(r => r.Section === sec);
      const lr = lastSnap.rows.find(r => r.Section === sec);
      if (!lr) return null;
      const startEnr = fr ? fr['Enrolled Students'] : 0;
      const endEnr = lr['Enrolled Students'];
      // Stalled uses its own (potentially wider) lookback for the growth check
      const sr = stalledLookback.rows.find(r => r.Section === sec);
      const stalledStartEnr = sr ? sr['Enrolled Students'] : 0;
      return {
        section: sec,
        title: lr['Course Title'],
        prefix: lr._prefix,
        location: lr.Location,
        capacity: lr.Capacity,
        startEnr, endEnr,
        diff: endEnr - startEnr,
        stalledDiff: endEnr - stalledStartEnr,
        startFill: fr ? fr['Section Fill %'] : 0,
        endFill: lr['Section Fill %'],
        isNew: !fr,
      };
    }).filter(Boolean);

    // Minimum threshold: only surface sections that moved by at least 2
    // students. Filters day-to-day noise like +1/-1 that isn't
    // actionable. Threshold applies in 'previous' mode; in 'start' mode
    // we retain the original behavior (any movement surfaces).
    const minMove = moverWindow === 'previous' ? 2 : 1;
    const gainers = movers
      .filter(m => m.diff >= minMove || m.isNew)
      .sort((a, b) => b.diff - a.diff)
      .slice(0, 8);
    const stalled = movers
      .filter(m => m.stalledDiff === 0 && m.endFill < 50)
      .sort((a, b) => a.endEnr - b.endEnr)
      .slice(0, 8);
    const losers = movers
      .filter(m => m.diff <= -minMove)
      .sort((a, b) => a.diff - b.diff)
      .slice(0, 8);

    // Waitlist pressure — aggregated by course CODE, not by section. Different
    // shape from the other three movers: it looks at the current snapshot
    // only (waitlist is a "right now" quantity, not a time delta), and it
    // rolls up multiple sections of the same course (e.g., HIST-201-001RL +
    // 002RL + 003RL → one HIST-201 row showing total waitlist + section
    // count). Surfaces courses with combined demand pressure that
    // section-level views miss. Threshold of 3+ waitlisted total filters
    // noise (a single 1-waiting course isn't a meaningful signal).
    const waitlistByCourse = new Map();
    lastSnap.rows.forEach(r => {
      if (!state.selectedDisciplines.has(r._prefix)) return;
      const wait = Number(r['Wait List']) || 0;
      const course = String(r.Course || '');
      if (!course) return;
      if (!waitlistByCourse.has(course)) {
        waitlistByCourse.set(course, {
          course,
          prefix: r._prefix,
          title: r['Course Title'] || '',
          sections: 0,
          waiting: 0,
          enrolled: 0,
          capacity: 0,
        });
      }
      const agg = waitlistByCourse.get(course);
      agg.sections += 1;
      agg.waiting += wait;
      agg.enrolled += Number(r['Enrolled Students']) || 0;
      agg.capacity += Number(r.Capacity) || 0;
    });
    const waitlists = [...waitlistByCourse.values()]
      .filter(c => c.waiting >= 3)
      .sort((a, b) => b.waiting - a.waiting)
      .slice(0, 8);

    const censusMarker = censusIndex >= 0
      ? { index: censusIndex, enrolled: censusEnrolled }
      : null;

    return `
      <div class="section-title">Enrollment Over Time <span class="meta">${snaps.length} snapshots · ${fmtDate(firstSnap.date)} → ${fmtDate(lastSnap.date)}</span></div>
      ${renderMultiSeriesChart(series, dates, 'enr', 'Enrolled Students', null, censusMarker)}
      ${renderMultiSeriesChart(series, dates, 'fill', 'Fill Rate (%)', cwSeries, censusMarker)}

      <div class="section-title movers-title">
        <span>Movers</span>
        <span class="movers-meta">
          <span class="movers-window-label">${moverWindow === 'previous'
            ? `${fmtDate(firstSnap.date)} → ${fmtDate(lastSnap.date)}`
            : `Since ${fmtDate(firstSnap.date)} (registration open)`}</span>
          <span class="movers-toggle" role="tablist" aria-label="Comparison window">
            <button type="button" class="mw-btn ${moverWindow === 'previous' ? 'is-active' : ''}" data-mover-window="previous" role="tab" aria-selected="${moverWindow === 'previous'}">Since last snapshot</button>
            <button type="button" class="mw-btn ${moverWindow === 'start' ? 'is-active' : ''}" data-mover-window="start" role="tab" aria-selected="${moverWindow === 'start'}">Since start</button>
          </span>
        </span>
      </div>
      <div class="grid-auto">
        ${renderMoverPanel('Biggest Gainers', gainers, 'up')}
        ${renderMoverPanel(moverWindow === 'previous' ? 'Stalled (no growth in ~1 week, under-filled)' : 'Stalled (no growth, under-filled)', stalled, 'flat')}
        ${renderMoverPanel('Lost Enrollment', losers, 'down')}
        ${renderWaitlistPanel(waitlists)}
      </div>
    `;
  }

  function renderMultiSeriesChart(series, dates, key, title, refSeries, censusMarker) {
    const W = 1100, H = 280, padL = 60, padR = 20, padT = 30, padB = 50;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    if (series.length === 0 || dates.length === 0) return '';

    const allSeries = refSeries ? [...series, refSeries] : series;
    const allVals = allSeries.flatMap(s => s[key]);
    const max = Math.max(...allVals, key === 'fill' ? 100 : 1);
    const min = 0;
    const xStep = dates.length > 1 ? innerW / (dates.length - 1) : 0;

    const xCoord = (i) => padL + i * xStep;
    const yCoord = (v) => padT + innerH * (1 - (v - min) / (max - min || 1));

    // Y axis ticks (5)
    const ticks = 5;
    const yTicks = [];
    for (let i = 0; i <= ticks; i++) {
      const v = min + (max - min) * (i / ticks);
      yTicks.push({ v, y: yCoord(v) });
    }

    // Format the value for the hover readout based on chart kind. Pre-stored
    // on each dot as data-display so the hover handler doesn't need to know
    // whether this is the enrollment or fill chart.
    const fmtVal = (v) => key === 'fill' ? `${v.toFixed(1)}%` : fmtInt(v);

    const renderLine = (s, isRef) => {
      const path = s[key].map((v, i) => `${i === 0 ? 'M' : 'L'}${xCoord(i)},${yCoord(v)}`).join(' ');
      const refAttrs = isRef ? ' data-is-ref="true"' : '';
      const dotsRefAttrs = isRef ? ' data-is-ref="true"' : '';
      const dots = s[key].map((v, i) =>
        `<circle class="tc-dot" data-disc="${escapeHtml(s.code)}"${dotsRefAttrs} data-i="${i}" data-val="${v}" data-display="${escapeHtml(fmtVal(v))}" cx="${xCoord(i)}" cy="${yCoord(v)}" r="${isRef ? 2.4 : 3}" fill="${s.color}"/>`
      ).join('');
      const dash = isRef ? 'stroke-dasharray="5,4"' : '';
      return `
        <path class="tc-line${isRef ? ' tc-ref-line' : ''}" data-disc="${escapeHtml(s.code)}"${refAttrs} d="${path}" fill="none" stroke="${s.color}" stroke-width="${isRef ? 1.6 : 2}" ${dash} stroke-linejoin="round" stroke-linecap="round"/>
        ${dots}
      `;
    };

    const lines = series.map(s => renderLine(s, false)).join('') + (refSeries ? renderLine(refSeries, true) : '');

    // 10th-day census marker — vertical line + pill label at top of chart.
    // Only rendered on the enrollment chart ('enr') since the census number
    // is an enrollment headcount; fill-rate chart stays uncluttered.
    let censusMarkerSvg = '';
    if (censusMarker && censusMarker.index >= 0 && censusMarker.index < dates.length && key === 'enr') {
      const cx = xCoord(censusMarker.index);
      const labelText = censusMarker.enrolled != null
        ? `10TH DAY · ${fmtInt(censusMarker.enrolled)}`
        : '10TH DAY';
      // Approximate label width so the pill background fits snugly.
      const labelW = labelText.length * 6.2 + 14;
      const labelX = Math.max(padL + labelW / 2 + 2,
                     Math.min(W - padR - labelW / 2 - 2, cx));
      censusMarkerSvg = `
        <line class="tc-census-line" x1="${cx}" y1="${padT - 6}" x2="${cx}" y2="${H - padB}"/>
        <rect class="tc-census-label-bg" x="${labelX - labelW / 2}" y="${padT - 20}" width="${labelW}" height="16" rx="3"/>
        <text class="tc-census-label" x="${labelX}" y="${padT - 8}" text-anchor="middle">${escapeHtml(labelText)}</text>
      `;
    }

    const xLabels = dates.map((d, i) =>
      `<text x="${xCoord(i)}" y="${H - padB + 18}" text-anchor="middle" font-size="11" fill="var(--ink-mute)" font-family="Helvetica Neue, sans-serif">${escapeHtml(d)}</text>`
    ).join('');

    const yLabels = yTicks.map(t =>
      `<line x1="${padL}" x2="${W - padR}" y1="${t.y}" y2="${t.y}" stroke="var(--rule)" stroke-width="0.5"/>
       <text x="${padL - 8}" y="${t.y + 3}" text-anchor="end" font-size="10" fill="var(--ink-mute)" font-family="Helvetica Neue, sans-serif">${key === 'fill' ? t.v.toFixed(0) + '%' : fmtInt(t.v)}</text>`
    ).join('');

    const legendItems = series.map(s =>
      `<span class="lg-item" data-disc="${escapeHtml(s.code)}"><span class="sw" style="background:${s.color}"></span>${escapeHtml(s.code)}</span>`
    );
    if (refSeries) {
      legendItems.push(`<span class="lg-item is-ref" data-disc="${escapeHtml(refSeries.code)}" data-is-ref="true"><span class="sw" style="background:${refSeries.color};opacity:0.6;background-image:repeating-linear-gradient(90deg, ${refSeries.color} 0 4px, transparent 4px 7px)"></span>${escapeHtml(refSeries.code)} <em style="color:var(--ink-mute)">(reference)</em></span>`);
    }
    const legend = legendItems.join('');

    // The readout is a small dark tooltip positioned at the hovered data
    // point. Built once per chart wrap; the hover handler updates content
    // and position. Hidden by default via .show class.
    return `
      <div class="trend-chart-wrap" data-chart-key="${escapeHtml(key)}">
        <h4>${escapeHtml(title)}</h4>
        <div class="legend">${legend}</div>
        <div class="trend-chart-frame">
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" style="width:100%;height:auto;display:block">
            ${yLabels}
            ${censusMarkerSvg}
            ${lines}
            ${xLabels}
          </svg>
          <div class="trend-readout"><span class="rd-name"></span> · <span class="rd-num"></span></div>
        </div>
      </div>
    `;
  }

  function renderMoverPanel(title, items, kind) {
    if (items.length === 0) {
      const emptyMsg = kind === 'up'
        ? 'No sections gained enough to surface.'
        : kind === 'down'
        ? 'No sections lost enough to surface.'
        : 'No stalled sections in current view.';
      return `<div class="panel">
        <h3>${escapeHtml(title)}</h3>
        <div class="panel-sub">${emptyMsg}</div>
      </div>`;
    }
    const rows = items.map(m => {
      const cls = kind === 'up' ? 'up' : kind === 'down' ? 'down' : 'flat';
      const sign = m.diff > 0 ? '+' : m.diff < 0 ? '' : '';
      const color = colorFor(m.prefix);
      return `
        <div class="stat-row">
          <span class="k" style="text-transform:none;letter-spacing:0;font-size:11px">
            <strong style="color:var(--ink);font-family:Helvetica Neue, sans-serif">${escapeHtml(m.section)}</strong>
            <span style="color:var(--ink-mute)"> · ${escapeHtml(m.location || '')}</span>
          </span>
          <span class="v" style="font-size:11px">${m.endEnr}/${m.capacity}</span>
          <span class="d ${cls}" style="font-weight:700">${m.isNew ? 'NEW' : sign + m.diff}</span>
        </div>
      `;
    }).join('');
    return `
      <div class="panel">
        <h3>${escapeHtml(title)}</h3>
        <div class="panel-sub">${items.length} section${items.length !== 1 ? 's' : ''}</div>
        ${rows}
      </div>
    `;
  }

  // Waitlist mover panel — same panel chrome as renderMoverPanel but the
  // data shape is course-aggregated, not section-level. Headline value is
  // the combined waitlist count in warning amber (distinct from the
  // green/red used for enrollment deltas — waitlist is a constraint
  // signal, not a "good/bad" delta). Course title sits below the code in
  // italic mute, matching the discipline accordion treatment.
  function renderWaitlistPanel(items) {
    const title = 'Biggest Waitlists';
    if (items.length === 0) {
      return `<div class="panel">
        <h3>${escapeHtml(title)}</h3>
        <div class="panel-sub">No course has 3+ on waitlist right now.</div>
      </div>`;
    }
    const rows = items.map(c => {
      const color = colorFor(c.prefix);
      const fill = c.capacity > 0 ? (c.enrolled / c.capacity * 100) : 0;
      const fillStr = c.capacity > 0 ? `${fillFmt(fill)} fill` : '—';
      return `
        <div class="stat-row">
          <span class="k" style="text-transform:none;letter-spacing:0;font-size:11px">
            <strong style="color:var(--ink);font-family:Helvetica Neue, sans-serif">${escapeHtml(c.course)}</strong>
            <span class="wl-course-title">${escapeHtml(c.title)}</span>
          </span>
          <span class="v" style="font-size:11px">${fmtInt(c.sections)} sec · ${fillStr}</span>
          <span class="d wl-wait" style="font-weight:700">${fmtInt(c.waiting)}</span>
        </div>
      `;
    }).join('');
    return `
      <div class="panel">
        <h3>${escapeHtml(title)}</h3>
        <div class="panel-sub">By course · aggregated across sections</div>
        ${rows}
      </div>
    `;
  }
  // Tiny helper to format fill % without trailing decimal noise when round
  function fillFmt(n) {
    if (n == null || isNaN(n)) return '—';
    return `${Math.round(n)}%`;
  }

  /* =========================================================================
   * SNAPSHOT MANAGER
   * ========================================================================= */

  function renderSnapshotManager() {
    // Show snapshots belonging to the active part-of-term. When we have
    // 11W/7A/7B data later, users switch POTs via the picker and this
    // library reflects whichever POT they're currently viewing.
    const potSnaps = activeSnapshots();
    const rows = potSnaps.slice().reverse().map(s => {
      const isCurrent = s.id === state.currentSnapshotId;
      const totalSections = s.rows.length;
      const totalEnr = sum(s.rows, 'Enrolled Students');
      return `
        <div class="snap-row ${isCurrent ? 'current' : ''}">
          <div class="date">${fmtDateShort(s.date)}</div>
          <div>
            <div style="font-weight:600">${escapeHtml(s.label)}</div>
            <div class="name">${escapeHtml(s.filename)}</div>
          </div>
          <div class="stats">${fmtInt(totalSections)} sections · ${fmtInt(totalEnr)} enrolled</div>
          ${isCurrent ? '<span class="badge cur">VIEWING</span>' : `<button class="btn ghost" data-set-current="${s.id}">View</button>`}
          <span></span>
        </div>
      `;
    }).join('');

    const updatedNote = state.manifestUpdatedAt
      ? `Data last updated ${fmtDate(state.manifestUpdatedAt.slice(0, 10))}`
      : `Loaded ${state.loadedAt ? new Date(state.loadedAt).toLocaleString() : ''}`;

    return `
      <div class="section-title">Snapshot Library <span class="meta">${fmtInt(potSnaps.length)} snapshots from data folder</span></div>

      <div style="background:var(--surface-2);border:1px solid var(--rule);padding:14px 18px;margin-bottom:18px;font-size:13px;color:var(--ink-soft)">
        <strong style="font-family:Helvetica Neue, sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink)">Data Source</strong><br>
        Reports load automatically from the <code>${escapeHtml(DATA_PATH)}</code> folder. New reports appear here as they're added. ${updatedNote}.
        <div style="margin-top:10px">
          <button class="btn" id="refreshBtn2" type="button">↻ Refresh from source</button>
        </div>
      </div>

      <div class="snapshot-list">${rows || '<div style="padding:20px;color:var(--ink-mute);font-style:italic">No snapshots yet.</div>'}</div>
    `;
  }

  /* =========================================================================
   * DISCIPLINE PICKER MODAL
   * ========================================================================= */

  function openDisciplineModal() {
    const root = el('modalRoot');
    root.innerHTML = renderDisciplineModal();
    bindDisciplineModal();
  }

  function closeModal() {
    el('modalRoot').innerHTML = '';
  }

  function renderDisciplineModal() {
    const grouped = {};
    state.allDisciplines.forEach(d => {
      const inst = d.institute || '(unspecified)';
      if (!grouped[inst]) grouped[inst] = [];
      grouped[inst].push(d);
    });
    const institutes = Object.keys(grouped).sort();

    const presetChips = state.presets.map((p, i) => `
      <button class="preset-chip" data-load-preset="${i}">
        ${escapeHtml(p.name)} <span style="color:var(--ink-mute)">(${p.disciplines.length})</span>
        <span class="x" data-delete-preset="${i}" title="Delete preset">×</span>
      </button>
    `).join('');

    const groups = institutes.map(inst => `
      <div class="institute-group">
        <div class="ig-head">
          <span>${escapeHtml(inst)} <span style="color:var(--ink-mute);font-weight:400">· ${grouped[inst].length} disciplines</span></span>
          <span class="ig-actions">
            <a data-select-inst="${escapeHtml(inst)}">Select all</a>
            <a data-deselect-inst="${escapeHtml(inst)}">Clear</a>
          </span>
        </div>
        <div class="ig-body">
          ${grouped[inst].map(d => `
            <span class="disc-chip ${state.selectedDisciplines.has(d.code) ? 'selected' : ''}" data-discipline="${d.code}">
              <span class="swatch" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${colorFor(d.code)}"></span>
              ${d.code}
              <span class="ct">${d.count}</span>
            </span>
          `).join('')}
        </div>
      </div>
    `).join('');

    return `
      <div class="modal-overlay" id="modalOverlay">
        <div class="modal" id="modalCard">
          <div class="modal-head">
            <h2>Choose Your Disciplines</h2>
            <button class="close" id="modalClose">×</button>
          </div>
          <div class="modal-action-bar">
            <span class="modal-action-count" id="selectedCountTop">${state.selectedDisciplines.size} selected</span>
            <div class="modal-action-buttons">
              <button class="btn ghost" id="clearAllDiscTop" type="button">Clear All</button>
              <button class="btn primary" id="applyDiscTop" type="button">Apply</button>
            </div>
          </div>
          <div class="modal-body">
            <p style="color:var(--ink-soft);font-size:13px;margin-bottom:18px">Select any course prefixes you want to track. Counts shown reflect sections across all your snapshots.</p>

            ${state.presets.length > 0 ? `
              <div class="preset-row">
                <span class="preset-label">Presets</span>
                ${presetChips}
              </div>
            ` : ''}

            ${groups || '<p style="color:var(--ink-mute);font-style:italic">No disciplines found. Upload a report first.</p>'}

            <div style="margin-top:18px;padding:12px 14px;background:var(--surface-2);border:1px solid var(--rule)">
              <div style="font-family:Helvetica Neue, sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:0.12em;color:var(--ink-mute);margin-bottom:6px">Save current selection as preset</div>
              <div style="display:flex;gap:8px">
                <input type="text" id="presetName" placeholder="e.g., Engineering & Tech Chair" style="flex:1;padding:8px 10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-family:inherit;font-size:13px">
                <button class="btn" id="savePresetBtn" type="button">Save</button>
              </div>
            </div>
          </div>
          <div class="modal-foot">
            <span style="color:var(--ink-mute);font-size:12px;align-self:center" id="selectedCount">${state.selectedDisciplines.size} selected</span>
            <div style="display:flex;gap:8px">
              <button class="btn ghost" id="clearAllDisc" type="button">Clear All</button>
              <button class="btn primary" id="applyDisc" type="button">Apply</button>
            </div>
          </div>
        </div>
      </div>
    `;
  }

  function bindDisciplineModal() {
    el('modalClose').addEventListener('click', closeModal);
    el('modalOverlay').addEventListener('click', (e) => {
      if (e.target.id === 'modalOverlay') closeModal();
    });

    // Helper: update both the top and bottom selected-count labels in lockstep.
    // Both labels show the same value; they just live in two places so a long
    // scrollable modal still shows the count near whichever action bar the
    // user is looking at.
    const updateCount = () => {
      const text = state.selectedDisciplines.size + ' selected';
      const top = el('selectedCountTop');
      const bot = el('selectedCount');
      if (top) top.textContent = text;
      if (bot) bot.textContent = text;
    };

    document.querySelectorAll('[data-discipline]').forEach(chip => {
      chip.addEventListener('click', () => {
        const code = chip.dataset.discipline;
        if (state.selectedDisciplines.has(code)) state.selectedDisciplines.delete(code);
        else state.selectedDisciplines.add(code);
        chip.classList.toggle('selected');
        updateCount();
      });
    });

    document.querySelectorAll('[data-select-inst]').forEach(a => {
      a.addEventListener('click', () => {
        const inst = a.dataset.selectInst;
        state.allDisciplines.filter(d => (d.institute || '(unspecified)') === inst)
          .forEach(d => state.selectedDisciplines.add(d.code));
        openDisciplineModal();
      });
    });
    document.querySelectorAll('[data-deselect-inst]').forEach(a => {
      a.addEventListener('click', () => {
        const inst = a.dataset.deselectInst;
        state.allDisciplines.filter(d => (d.institute || '(unspecified)') === inst)
          .forEach(d => state.selectedDisciplines.delete(d.code));
        openDisciplineModal();
      });
    });

    document.querySelectorAll('[data-load-preset]').forEach(b => {
      b.addEventListener('click', (e) => {
        if (e.target.dataset.deletePreset != null) return; // delete handler will fire
        const idx = parseInt(b.dataset.loadPreset, 10);
        const preset = state.presets[idx];
        if (preset) {
          state.selectedDisciplines = new Set(preset.disciplines);
          openDisciplineModal();
        }
      });
    });
    document.querySelectorAll('[data-delete-preset]').forEach(x => {
      x.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(x.dataset.deletePreset, 10);
        if (confirm(`Delete preset "${state.presets[idx].name}"?`)) {
          state.presets.splice(idx, 1);
          saveStorage();
          openDisciplineModal();
        }
      });
    });

    el('savePresetBtn').addEventListener('click', () => {
      const name = el('presetName').value.trim();
      if (!name) { toast('Give the preset a name.', 3000); return; }
      if (state.selectedDisciplines.size === 0) { toast('Select at least one discipline.', 3000); return; }
      // Replace if name exists
      const idx = state.presets.findIndex(p => p.name === name);
      const preset = { name, disciplines: [...state.selectedDisciplines] };
      if (idx >= 0) state.presets[idx] = preset;
      else state.presets.push(preset);
      saveStorage();
      toast(`Saved preset "${name}".`, 3000);
      openDisciplineModal();
    });

    // Shared Clear All handler — bound to both the top and bottom buttons
    // so users don't have to scroll to find one or the other.
    const clearAllChoices = () => {
      state.selectedDisciplines.clear();
      openDisciplineModal();
    };
    el('clearAllDisc').addEventListener('click', clearAllChoices);
    if (el('clearAllDiscTop')) el('clearAllDiscTop').addEventListener('click', clearAllChoices);

    // Shared Apply handler — likewise bound to both top and bottom Apply
    // buttons. Long discipline lists make the bottom button invisible, so
    // the top button removes the scroll-to-apply tax.
    const applyChoices = () => {
      saveStorage();
      closeModal();
      // Reset sub-filters that no longer apply
      state.activeDisciplineFilter = new Set(
        [...state.activeDisciplineFilter].filter(p => state.selectedDisciplines.has(p))
      );
      render();
    };
    el('applyDisc').addEventListener('click', applyChoices);
    if (el('applyDiscTop')) el('applyDiscTop').addEventListener('click', applyChoices);
  }

  /* =========================================================================
   * EVENT BINDING (DASHBOARD)
   * ========================================================================= */

  function bindAllEvents() {
    // Tabs
    document.querySelectorAll('[data-tab]').forEach(t => {
      t.addEventListener('click', () => {
        state.activeTab = t.dataset.tab;
        render();
      });
    });

    // Discipline sub-filters
    document.querySelectorAll('[data-disc-filter]').forEach(b => {
      b.addEventListener('click', () => {
        const code = b.dataset.discFilter;
        if (state.activeDisciplineFilter.has(code)) state.activeDisciplineFilter.delete(code);
        else state.activeDisciplineFilter.add(code);
        render();
      });
    });

    // Location filters
    document.querySelectorAll('[data-location]').forEach(b => {
      b.addEventListener('click', () => {
        const l = b.dataset.location;
        if (state.activeLocations.has(l)) state.activeLocations.delete(l);
        else state.activeLocations.add(l);
        render();
      });
    });

    // Fill-status bucket filter (mutually exclusive)
    document.querySelectorAll('[data-bucket]').forEach(b => {
      b.addEventListener('click', () => {
        state.fillBucket = b.dataset.bucket;
        render();
      });
    });

    // Grouped vs. list view toggle (only relevant when Empty or Full filter active)
    document.querySelectorAll('[data-view-mode]').forEach(b => {
      b.addEventListener('click', () => {
        state.groupedView = b.dataset.viewMode === 'grouped';
        saveStorage();
        render();
      });
    });

    // Per-course-per-group expansion toggles in the grouped view.
    // Click "show all" -> expand that group; click "show fewer" -> collapse.
    // State lives in state.groupedExpansion as { "MATH-021:priority": true }
    document.querySelectorAll('[data-grouped-toggle]').forEach(b => {
      b.addEventListener('click', () => {
        const key = b.dataset.groupedToggle;
        state.groupedExpansion[key] = !state.groupedExpansion[key];
        render();
      });
    });

    // Per-discipline card collapse/expand toggle
    document.querySelectorAll('[data-toggle-discipline]').forEach(b => {
      b.addEventListener('click', () => {
        const prefix = b.dataset.toggleDiscipline;
        // Read the current effective state (smart default if no override)
        const snap = currentSnapshot();
        const count = snap
          ? snap.rows.filter(r => r._prefix === prefix && state.selectedDisciplines.has(r._prefix)).length
          : 0;
        const wasExpanded = isDisciplineExpanded(prefix, count);
        // Store explicit user choice (the opposite of current state)
        state.cardExpansion[prefix] = !wasExpanded;
        saveStorage();
        render();
      });
    });

    // Bulk collapse-all / expand-all toggle for the entire card grid.
    // Sets explicit overrides for every currently-visible discipline so the
    // choice persists. Reading data-bulk-action tells us which direction:
    // 'collapse' -> set all to false, 'expand' -> set all to true.
    const bulkBtn = el('bulkDisciplineToggle');
    if (bulkBtn) {
      bulkBtn.addEventListener('click', () => {
        const action = bulkBtn.dataset.bulkAction;
        const targetValue = action === 'expand';
        const snap = currentSnapshot();
        if (!snap) return;
        // Find every discipline currently in scope (matches filteredRows logic)
        const inScopePrefixes = new Set();
        filteredRows().forEach(r => inScopePrefixes.add(r._prefix));
        inScopePrefixes.forEach(prefix => {
          state.cardExpansion[prefix] = targetValue;
        });
        saveStorage();
        render();
      });
    }

    // -------------------------------------------------------------------
    // "By Discipline" table — accordion behavior
    // -------------------------------------------------------------------
    // Two interactions:
    //   1. Chevron click  -> toggles expansion (no filter side-effect).
    //                        The whole row is the click target so users
    //                        don't have to aim for a tiny chevron.
    //   2. Bulk toggle    -> Expand all / Collapse all the visible rows.
    //                        Mirrors the "Sections at a Glance" bulk toggle.
    //
    // Discipline filtering is handled exclusively by the chip row above
    // the table — keeping these two concerns separated removes the
    // mid-flow re-render that made the in-table click feel unstable when
    // the active filter set changed underneath the user.
    document.querySelectorAll('[data-disc-chev]').forEach(cell => {
      cell.addEventListener('click', (e) => {
        e.stopPropagation();
        const code = cell.dataset.discChev;
        state.disciplineRowExpansion[code] = !state.disciplineRowExpansion[code];
        saveStorage();
        render();
      });
    });

    document.querySelectorAll('[data-disc-row]').forEach(row => {
      row.addEventListener('click', () => {
        const code = row.dataset.discRow;
        state.disciplineRowExpansion[code] = !state.disciplineRowExpansion[code];
        saveStorage();
        render();
      });
    });

    const bulkDiscRowBtn = el('bulkDiscRowToggle');
    if (bulkDiscRowBtn) {
      bulkDiscRowBtn.addEventListener('click', () => {
        const action = bulkDiscRowBtn.dataset.bulkAction;
        const targetValue = action === 'expand';
        document.querySelectorAll('[data-disc-row]').forEach(row => {
          state.disciplineRowExpansion[row.dataset.discRow] = targetValue;
        });
        saveStorage();
        render();
      });
    }

    // -------------------------------------------------------------------
    // Movers comparison window toggle
    // -------------------------------------------------------------------
    // Event delegation because the toggle is inside a re-rendered chunk
    // of markup. Buttons carry data-mover-window="previous" or "start".
    document.querySelectorAll('[data-mover-window]').forEach(btn => {
      btn.addEventListener('click', () => {
        const mode = btn.dataset.moverWindow;
        if (mode !== 'previous' && mode !== 'start') return;
        if (state.moverWindow === mode) return;
        state.moverWindow = mode;
        saveStorage();
        render();
      });
    });

    // -------------------------------------------------------------------
    // Trend chart hover-isolate
    // -------------------------------------------------------------------
    // Each .trend-chart-wrap can host its own independent hover state.
    // Hovering any element tagged with data-disc inside the wrap (legend
    // chip, line, or dot) raises that discipline to full opacity and
    // dims the rest. Reference series stay bright via CSS rules keyed
    // on data-is-ref. Dot hover also positions a small readout tooltip
    // with the formatted value.
    document.querySelectorAll('.trend-chart-wrap').forEach(wrap => {
      const readout = wrap.querySelector('.trend-readout');
      const readoutName = readout && readout.querySelector('.rd-name');
      const readoutNum  = readout && readout.querySelector('.rd-num');

      function setActive(code) {
        if (!code) {
          wrap.classList.remove('is-hover');
          wrap.querySelectorAll('.is-active').forEach(el => el.classList.remove('is-active'));
          if (readout) readout.classList.remove('show');
          return;
        }
        wrap.classList.add('is-hover');
        wrap.querySelectorAll('[data-disc]').forEach(el => {
          el.classList.toggle('is-active', el.dataset.disc === code);
        });
      }

      wrap.querySelectorAll('.lg-item[data-disc]').forEach(item => {
        item.addEventListener('mouseenter', () => setActive(item.dataset.disc));
        item.addEventListener('mouseleave', () => setActive(null));
      });
      wrap.querySelectorAll('.tc-line[data-disc]').forEach(line => {
        line.addEventListener('mouseenter', () => setActive(line.dataset.disc));
        line.addEventListener('mouseleave', () => setActive(null));
      });
      wrap.querySelectorAll('.tc-dot[data-disc]').forEach(dot => {
        dot.addEventListener('mouseenter', () => {
          setActive(dot.dataset.disc);
          if (!readout) return;
          // Position the readout at the dot's center within the
          // chart frame. getBoundingClientRect handles SVG scaling
          // correctly without us reverse-engineering the viewBox.
          const dotRect = dot.getBoundingClientRect();
          const frame = wrap.querySelector('.trend-chart-frame').getBoundingClientRect();
          readoutName.textContent = dot.dataset.disc;
          readoutNum.textContent = dot.dataset.display || dot.dataset.val;
          readout.style.left = (dotRect.left - frame.left + dotRect.width / 2) + 'px';
          readout.style.top  = (dotRect.top  - frame.top  + dotRect.height / 2) + 'px';
          readout.classList.add('show');
        });
        dot.addEventListener('mouseleave', () => setActive(null));
      });
    });

    const reset = el('resetFilters');
    if (reset) reset.addEventListener('click', () => {
      state.activeDisciplineFilter.clear();
      state.activeLocations.clear();
      state.fillBucket = 'all';
      render();
    });

    // Show all disciplines — quick path back from a narrow drill-in view
    const showAll = el('showAllDisciplines');
    if (showAll) showAll.addEventListener('click', () => {
      state.selectedDisciplines = new Set(state.allDisciplines.map(d => d.code));
      state.activeDisciplineFilter.clear();
      saveStorage();
      toast(`Showing all ${state.allDisciplines.length} disciplines`, 2200);
      render();
    });

    // Discipline-group chips — additive toggle. Clicking BUSS adds all BUSS
    // disciplines to selection; clicking again when all are present removes
    // them. Lets users compose multi-institute views by clicking several.
    document.querySelectorAll('[data-institute]').forEach(b => {
      b.addEventListener('click', () => {
        const inst = b.dataset.institute;
        const codes = state.instituteIndex[inst] || [];
        if (codes.length === 0) return;
        const allSelected = codes.every(c => state.selectedDisciplines.has(c));
        if (allSelected) {
          // Remove all disciplines of this institute
          codes.forEach(c => state.selectedDisciplines.delete(c));
          toast(`Removed ${inst} (${codes.length} disciplines)`, 2000);
        } else {
          // Add all disciplines of this institute
          codes.forEach(c => state.selectedDisciplines.add(c));
          toast(`Added ${inst} (${codes.length} disciplines)`, 2000);
        }
        state.activeDisciplineFilter.clear();
        saveStorage();
        render();
      });
    });

    const benchT = el('benchToggle');
    if (benchT) benchT.addEventListener('click', () => {
      state.showBenchmarks = !state.showBenchmarks;
      saveStorage();
      render();
    });

    // Sort
    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.addEventListener('click', () => {
        const k = th.dataset.sort;
        if (state.sortKey === k) state.sortDir *= -1;
        else { state.sortKey = k; state.sortDir = 1; }
        render();
      });
    });

    // Table search input
    const searchInput = el('tableSearchInput');
    if (searchInput) {
      // Re-render on each keystroke; restore focus/cursor after re-render
      // since render() replaces the input element.
      searchInput.addEventListener('input', (e) => {
        const newValue = e.target.value;
        const cursorPos = e.target.selectionStart;
        state.tableSearch = newValue;
        render();
        const restored = el('tableSearchInput');
        if (restored) {
          restored.focus();
          // Restore cursor to the spot the user was typing
          try { restored.setSelectionRange(cursorPos, cursorPos); } catch (_) {}
        }
      });
    }

    const searchClear = el('tableSearchClear');
    if (searchClear) {
      searchClear.addEventListener('click', () => {
        state.tableSearch = '';
        render();
        const restored = el('tableSearchInput');
        if (restored) restored.focus();
      });
    }

    // Snapshot manager actions (view-only since data comes from GitHub)
    document.querySelectorAll('[data-set-current]').forEach(b => {
      b.addEventListener('click', () => {
        state.currentSnapshotId = b.dataset.setCurrent;
        toast('Switched to snapshot ' + fmtDate(currentSnapshot().date), 2500);
        state.activeTab = 'snapshot';
        render();
      });
    });

    const refreshBtn2 = el('refreshBtn2');
    if (refreshBtn2) refreshBtn2.addEventListener('click', loadFromManifest);
  }

  /* =========================================================================
   * IMPORT / EXPORT
   * ========================================================================= */

  function exportSnapshots() {
    const payload = {
      version: 1,
      exportedAt: new Date().toISOString(),
      snapshots: state.snapshots,
      presets: state.presets,
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `enrollment-snapshots-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    toast(`Exported ${state.snapshots.length} snapshots.`, 3000);
  }

  function importSnapshots(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const data = JSON.parse(ev.target.result);
        if (!data.snapshots || !Array.isArray(data.snapshots)) throw new Error('Invalid file format');

        const action = state.snapshots.length > 0
          ? prompt(`You have ${state.snapshots.length} existing snapshots. Type "merge" to combine, "replace" to overwrite, or cancel:`, 'merge')
          : 'replace';

        if (!action) return;
        if (action === 'replace') {
          state.snapshots = data.snapshots;
        } else if (action === 'merge') {
          // Replace by date, add new
          data.snapshots.forEach(s => {
            const idx = state.snapshots.findIndex(x => x.date === s.date);
            if (idx >= 0) state.snapshots[idx] = s;
            else state.snapshots.push(s);
          });
          state.snapshots.sort((a, b) => a.date.localeCompare(b.date));
        } else {
          toast('Import canceled.', 2500);
          return;
        }

        if (data.presets && Array.isArray(data.presets)) {
          // Merge presets by name
          data.presets.forEach(p => {
            const idx = state.presets.findIndex(x => x.name === p.name);
            if (idx >= 0) state.presets[idx] = p;
            else state.presets.push(p);
          });
        }

        if (state.snapshots.length > 0) {
          state.currentSnapshotId = state.snapshots[state.snapshots.length - 1].id;
        }
        recomputeAllDisciplines();
        saveStorage();
        render();
        toast(`Imported. Now have ${state.snapshots.length} snapshots.`, 3000);
      } catch (err) {
        console.error(err);
        toast('⚠ Could not import: ' + err.message, 5000);
      }
    };
    reader.readAsText(file);
    // Reset input so same file can be re-selected
    e.target.value = '';
  }

  /* =========================================================================
   * TOAST
   * ========================================================================= */

  let toastTimer = null;
  function toast(msg, ms) {
    const root = el('toastRoot');
    root.innerHTML = `<div class="toast">${msg}</div>`;
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { root.innerHTML = ''; }, ms || 4000);
  }

  /* =========================================================================
   * STATIC EVENT BINDING
   * ========================================================================= */

  el('refreshBtn').addEventListener('click', loadFromManifest);
  el('disciplineBtn').addEventListener('click', openDisciplineModal);
  el('themeBtn').addEventListener('click', () => {
    // Cycle: cream (no attribute) -> white -> dark -> cream
    const cur = document.documentElement.getAttribute('data-theme') || 'cream';
    let next;
    if (cur === 'cream') next = 'white';
    else if (cur === 'white') next = 'dark';
    else next = 'cream';

    if (next === 'cream') {
      document.documentElement.removeAttribute('data-theme');
    } else {
      document.documentElement.setAttribute('data-theme', next);
    }
    localStorage.setItem(STORAGE.THEME, next);
    updateThemeButtonLabel();
    render();
  });

  // Reflect current theme in the button label so the user knows what's active
  // and what they'll get next
  function updateThemeButtonLabel() {
    const btn = el('themeBtn');
    if (!btn) return;
    const cur = document.documentElement.getAttribute('data-theme') || 'cream';
    const label = cur === 'cream' ? 'Cream' : cur === 'white' ? 'White' : 'Dark';
    btn.textContent = '◐ Theme · ' + label;
    btn.title = 'Click to cycle through Cream, White, and Dark themes';
  }
  el('printBtn').addEventListener('click', () => window.print());

  // -----------------------------------------------------------------------
  // What's new — modal open/close + badge dismissal
  // -----------------------------------------------------------------------
  function refreshWhatsNewBadge() {
    const pill = el('whatsNewPill');
    if (!pill) return;
    let seen = null;
    try { seen = localStorage.getItem(STORAGE.WHATS_NEW_SEEN); } catch (e) {}

      pill.classList.add('hidden');

    // Distinguish "first-ever sighting" (NEW) from "you saw an older
    // version, this is newer than that" (UPDATED). Helps returning
    // readers recognize the badge is meaningful rather than something
    // they've already processed.
    pill.textContent = (seen && seen !== WHATS_NEW_VERSION) ? 'UPDATED' : 'NEW';
  }

  // First-time visitors are NOT auto-opened — the badge alone introduces

  function maybeAutoOpenWhatsNew() {
    let seen = null;

  // -----------------------------------------------------------------------
  // Goal-met celebration
  // -----------------------------------------------------------------------
  // When the aggregate college FTE meets or exceeds the fall goal, fire
  // a one-time confetti-and-toast celebration. Once per user per term
  // (stored in localStorage as the term identifier, e.g. "26FA"). Users
  // with prefers-reduced-motion see the permanent card treatment (a
  // separate concern rendered inline in the FTE card) but skip the
  // animated celebration entirely.
  //
  // Trigger uses the "as of today" aggregate (aggregateCollegeFTE() with
  // no reference), NOT the currently-viewed snapshot's aggregate. That
  // prevents retriggering when a user browses back to a historical
  // snapshot where the aggregate was also above the goal.
  const CONFETTI_COLORS = ['#1d9e75', '#2d5a3d', '#b06820', '#d4b675', '#185fa5', '#d4537e', '#7f77dd'];

  function makeConfettiParticle(startX, startY) {
    const p = document.createElement('div');
    p.className = 'confetti';
    p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    p.style.left = startX + 'px';
    p.style.top = startY + 'px';
    // Mix shapes for visual variety
    const roll = Math.random();
    if (roll < 0.4) {
      p.style.borderRadius = '50%';
      p.style.width = '7px';
      p.style.height = '7px';
    } else if (roll < 0.7) {
      p.style.width = '5px';
      p.style.height = '10px';
    }
    return p;
  }

  function runGoalCelebration() {
    const container = el('goalCelebration');
    const toast = el('goalCelebrationToast');
    if (!container || !toast) return;

    container.setAttribute('aria-hidden', 'false');
    container.classList.add('is-active');

    // Confetti falls from top of viewport, sways, rotates, fades out.
    const viewportWidth = window.innerWidth;
    const viewportHeight = window.innerHeight;
    const count = 110;
    const duration = 4400;

    for (let i = 0; i < count; i++) {
      const startX = Math.random() * viewportWidth;
      const p = makeConfettiParticle(startX, -20);
      container.appendChild(p);

      const swayAmount = 60 + Math.random() * 80;
      const swayCycles = 1.5 + Math.random();
      const rotEnd = (Math.random() - 0.5) * 1800;
      const stagger = Math.random() * 900;
      const dur = duration + Math.random() * 800;

      p.animate([
        { transform: 'translate(0, 0) rotate(0deg)', opacity: 0 },
        { transform: `translate(${Math.sin(swayCycles * 1) * swayAmount}px, ${viewportHeight * 0.3}px) rotate(${rotEnd * 0.3}deg)`, opacity: 1, offset: 0.25 },
        { transform: `translate(${Math.sin(swayCycles * 2) * swayAmount}px, ${viewportHeight * 0.6}px) rotate(${rotEnd * 0.6}deg)`, opacity: 1, offset: 0.55 },
        { transform: `translate(${Math.sin(swayCycles * 3) * swayAmount}px, ${viewportHeight + 40}px) rotate(${rotEnd}deg)`, opacity: 0.9, offset: 1 },
      ], {
        duration: dur,
        delay: stagger,
        easing: 'linear',
        fill: 'forwards',
      }).onfinish = () => p.remove();
    }

    // Toast pops in and fades. Restart animation cleanly on each fire.
    toast.classList.remove('show');
    void toast.offsetWidth;  // force reflow so the animation replays
    toast.classList.add('show');

    // Cleanup after full duration
    const cleanup = () => {
      container.classList.remove('is-active');
      container.setAttribute('aria-hidden', 'true');
      toast.classList.remove('show');
      container.querySelectorAll('.confetti').forEach(el => el.remove());
    };
    const autoTimer = setTimeout(cleanup, 5500);

    // Click anywhere on the overlay dismisses early
    const clickDismiss = () => {
      clearTimeout(autoTimer);
      cleanup();
      container.removeEventListener('click', clickDismiss);
    };
    container.addEventListener('click', clickDismiss);
  }

  function maybeCelebrateGoal() {
    const goal = fteGoal();
    if (!goal) return;

    // v5.33.3: Must have snapshots IN THE ACTIVE TERM, not just anywhere.
    // Previously checked state.snapshots.length only, which included
    // snapshots from other loaded terms — producing false positives when
    // the user was on an empty term with a small goal (e.g. Winterim
    // 65.0 FTE goal against Fall's 3,100+ FTE total).
    const termWanted = state.activeTerm || '26FA';
    const hasActiveTermData = state.snapshots.some(s =>
      (s.term || '26FA') === termWanted
    );
    if (!hasActiveTermData) return;

    // "As of today" aggregate — deliberately ignores the currently-viewed
    // snapshot, so browsing back through history doesn't retrigger.
    // (aggregateCollegeFTE itself is now term-aware; see v5.33.3 comment.)
    const collegeFTE = aggregateCollegeFTE();
    const pct = pctOfGoal(collegeFTE);
    if (pct === null || pct < 100) return;

    // Per-term persistence. Stores the term code so the same user gets
    // one celebration per term (next semester's goal-met crossing will
    // fire a fresh celebration).
    const term = state.activeTerm || 'unknown';  // v5.33: compound-aware
    let celebrated = null;
    try { celebrated = localStorage.getItem(STORAGE.GOAL_MET_CELEBRATED); } catch (e) {}
    if (celebrated === term) return;

    // Mark celebrated first — even if animation fails or is suppressed
    // by reduced-motion, we don't want to retry every page load.
    try { localStorage.setItem(STORAGE.GOAL_MET_CELEBRATED, term); } catch (e) {}

    // Suppress the animation for users with reduced-motion preference.
    // The permanent card treatment (rendered inline via .goal-met class)
    // still communicates the milestone to them.
    const prefersReducedMotion = window.matchMedia
      && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (prefersReducedMotion) return;

    // Small delay so the celebration lands after the dashboard has
    // painted, giving the user context before the confetti drops.
    setTimeout(runGoalCelebration, 600);

  loadStorage();

  state.snapshots = [];
  state.currentSnapshotId = null;
  loadFromManifest();
/* =========================================================================
   * ASSISTANT CONTEXT  (v5.33 — multi-term, two-layer)
   *
   * The dashboard now carries multiple terms (Fall 2026, Winterim 2027,
   * Spring 2027, future). The assistant should prioritize forward-looking
   * terms (what chairs can still act on) while retaining historical
   * context (how prior terms wrapped up) for when the user asks.
   *
   * Context layers delivered to the assistant on every question:
   *   LAYER 1 (forward-looking): active + upcoming + in-session POTs across
   *     all terms, with current state and lifecycle context.
   *   LAYER 2 (historical): recently-completed POTs with their final numbers,
   *     for retrospective questions.
   *
   * The assistant decides which to lean on based on the question — explicit
   * mention of a specific term/POT scopes the answer; open-ended questions
