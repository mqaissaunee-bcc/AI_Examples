:root{--bg:#ecece4;--paper:#f6f5ee;--ink:#1c1e21;--ink-mid:#484c51;--ink-light:#8b9096;--accent:#1f5f8b;--accent-soft:rgba(31,95,139,.10);--hover:rgba(31,95,139,.05);--hairline:rgba(40,70,100,.16);--grid:rgba(90,130,170,.14);--line-heavy:rgba(28,30,33,.32);--line-med:rgba(28,30,33,.20);--bar-bg:#1c1e21;--bar-fg:#f6f5ee;--bar-dim:#8b9096;--ok:#2e6b45;--ok-badge:#3f7d56;--ok-bg:#e8f1ea;--ok-border:#b4d1bd;--serif:'Iowan Old Style','Palatino Nova',Palatino,'Book Antiqua',Georgia,serif;--mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;--sans:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;--draft:'Drafting Lettering',ui-monospace,'SF Mono',Menlo,monospace;--indent:22px;--line-h:30px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#152638;--paper:#1a2f46;--ink:#dfe9f2;--ink-mid:#a9bdce;--ink-light:#68809a;--accent:#7fb8e0;--accent-soft:rgba(127,184,224,.14);--hover:rgba(223,233,242,.05);--hairline:rgba(223,233,242,.18);--grid:rgba(170,205,240,.07);--line-heavy:rgba(223,233,242,.36);--line-med:rgba(223,233,242,.22);--bar-bg:#0e1c2b;--bar-fg:#dfe9f2;--bar-dim:#68809a;--ok:#9ed3a8;--ok-badge:#84bb90;--ok-bg:#1b3226;--ok-border:#335840}}
:root[data-theme="dark"]{--bg:#152638;--paper:#1a2f46;--ink:#dfe9f2;--ink-mid:#a9bdce;--ink-light:#68809a;--accent:#7fb8e0;--accent-soft:rgba(127,184,224,.14);--hover:rgba(223,233,242,.05);--hairline:rgba(223,233,242,.18);--grid:rgba(170,205,240,.07);--line-heavy:rgba(223,233,242,.36);--line-med:rgba(223,233,242,.22);--bar-bg:#0e1c2b;--bar-fg:#dfe9f2;--bar-dim:#68809a;--ok:#9ed3a8;--ok-badge:#84bb90;--ok-bg:#1b3226;--ok-border:#335840}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;font-family:var(--sans);color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
::selection{background:var(--accent-soft)}
header{padding:16px 48px 12px;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
header h1{font-family:var(--draft);font-size:15px;font-weight:400;letter-spacing:.24em;text-transform:uppercase}
#version-badge{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink-light);align-self:center}

.toolbar{padding:10px 48px;border-bottom:1px solid var(--ink-light);display:flex;gap:6px;align-items:center;background:var(--paper);flex-wrap:wrap}
.toolbar button{font-family:var(--mono);font-size:11px;padding:4px 10px;min-height:30px;border:1px solid var(--ink-light);background:transparent;color:var(--ink-mid);cursor:pointer;border-radius:2px;transition:all .1s;white-space:nowrap}
.toolbar button:disabled{opacity:.35;cursor:default;pointer-events:none}
button:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.skip-link{position:absolute;left:-9999px;top:0;background:var(--ink);color:var(--paper);padding:8px 14px;z-index:200;font-family:var(--mono);font-size:12px}
.skip-link:focus{left:8px;top:8px}
#file-chip{font-family:var(--mono);font-size:11px;color:var(--ink-light);align-self:center}
#file-chip.dirty{color:var(--accent)}
@media(max-width:640px){header,.toolbar,#hoist-bar,#url-source,#status{padding-left:16px;padding-right:16px}#outline-container{padding:20px 16px 80px}}
.toolbar button:hover{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.toolbar button.docs-btn{border-color:var(--accent);color:var(--accent)}
.toolbar button.docs-btn:hover,.toolbar button.docs-btn.active{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.toolbar-sep{width:1px;height:18px;background:var(--ink-light);margin:0 4px}
.hint{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-light)}
main{flex:1;display:flex;flex-direction:column}
#outline-container{flex:1;padding:32px 48px 80px;max-width:900px;width:100%}
.node{position:relative;line-height:var(--line-h)}
.node-row{display:flex;align-items:flex-start;min-height:var(--line-h);border-radius:3px;transition:background .08s}
.node-row:hover{background:var(--hover)}
.node-row.focused{background:var(--accent-soft)}
.bullet-wrap{width:26px;min-width:26px;height:var(--line-h);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;position:relative}
.bullet{width:7px;height:7px;border-radius:50%;background:var(--ink-light);transition:background .15s,transform .15s}
.bullet-wrap:hover .bullet{background:var(--accent);transform:scale(1.3)}
.node.has-children>.node-row .bullet{background:var(--ink);border-radius:2px}
.node.collapsed>.node-row .bullet{background:var(--accent);border-radius:50%}
.node.has-children>.node-row .bullet-wrap::after{content:'';position:absolute;right:1px;top:50%;transform:translateY(-50%);border-left:4px solid var(--ink-light);border-top:3px solid transparent;border-bottom:3px solid transparent;transition:transform .15s}
.node.has-children:not(.collapsed)>.node-row .bullet-wrap::after{transform:translateY(-50%) rotate(90deg)}
.node-text{flex:1;min-height:var(--line-h);padding:3px 6px 3px 2px;font-family:var(--serif);font-size:17px;font-weight:400;color:var(--ink);line-height:1.55;outline:none;white-space:pre-wrap;word-break:break-word;caret-color:var(--accent)}
.node-text:empty::before{content:attr(data-placeholder);color:var(--ink-light);font-style:italic;pointer-events:none}
/* Depth styles are injected by applyRules() from the RULES object */
.children{padding-left:var(--indent);border-left:1px solid var(--hairline);margin-left:12px}
.node[data-depth="0"]>.children{border-left-width:2px;border-left-color:var(--line-heavy)}
.node[data-depth="1"]>.children{border-left-width:1.5px;border-left-color:var(--line-med)}
.node.collapsed>.children{display:none}
body.hoisted #hoist-bar{display:flex}
#hoist-bar{display:none;padding:8px 48px;background:var(--bar-bg);color:var(--bar-fg);font-family:var(--mono);font-size:12px;align-items:center;gap:12px}
#hoist-bar button{background:var(--accent);color:var(--paper);border:none;padding:3px 10px;cursor:pointer;font-family:var(--mono);font-size:11px;border-radius:2px}
#status{position:fixed;bottom:0;left:0;right:0;background:var(--bar-bg);color:var(--bar-dim);font-family:var(--mono);font-size:11px;padding:5px 48px;display:flex;gap:24px}
#status span{color:var(--bar-fg)}
.node-row.drag-over-above{border-top:2px solid var(--accent)}
.node-row.drag-over-below{border-bottom:2px solid var(--accent)}
.node.dragging{opacity:.35}

/* Read-only mode */
body.readonly #title-block input{pointer-events:none}
body.readonly #tb-toggle{display:none}
body.readonly .toolbar button:not(.docs-btn):not(#readonly-badge):not(#btn-export-opml){opacity:.35;pointer-events:none}
#readonly-badge{display:none;border-color:var(--ok-badge);color:var(--ok-badge);pointer-events:none}
body.readonly #readonly-badge{display:inline-block}
body.readonly #doc-title{pointer-events:none}
#url-source{display:none;padding:5px 48px;background:var(--ok-bg);border-bottom:1px solid var(--ok-border);font-family:var(--mono);font-size:11px;color:var(--ok)}
#url-source a{color:var(--ok);text-decoration:underline}
body.readonly #url-source{display:block}

/* Title block — drawing-sheet style, bottom right */
#title-block{position:fixed;right:20px;bottom:36px;z-index:60;width:320px;background:var(--paper);border:1.5px solid var(--ink);font-family:var(--mono);box-shadow:6px 6px 0 var(--accent-soft)}
#tb-toggle{position:absolute;top:-1.5px;left:-27px;width:26px;height:26px;border:1.5px solid var(--ink);border-right:none;background:var(--paper);color:var(--ink-mid);cursor:pointer;font-size:12px;line-height:1;padding:0}
#tb-toggle:hover{color:var(--accent)}
#title-block.collapsed .tb-detail{display:none}
#title-block.collapsed #tb-toggle{transform:none}
.tb-row{display:flex;border-top:1px solid var(--hairline)}
.tb-row:first-of-type{border-top:none}
.tb-cell{flex:1;min-width:0;padding:5px 9px 6px;border-left:1px solid var(--hairline)}
.tb-cell:first-child{border-left:none}
.tb-cell label{display:block;font-family:var(--draft);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-light);margin-bottom:1px}
.tb-cell input{width:100%;font-family:var(--mono);font-size:11.5px;color:var(--ink);background:transparent;border:none;outline:none;padding:0}
.tb-cell input::placeholder{color:var(--ink-light)}
.tb-cell input[readonly]{color:var(--ink-mid);cursor:default}
.tb-title-row .tb-cell input{font-family:var(--serif);font-size:15px;font-weight:700;letter-spacing:.01em}
body.lettering-draft .tb-title-row .tb-cell input{font-family:var(--draft);font-weight:400;font-size:14.5px;text-transform:uppercase;letter-spacing:.06em}
.tb-rev-cell{flex:0 0 76px}
#meta-rev{font-family:var(--draft);font-size:14px;font-weight:400;color:var(--accent);letter-spacing:.06em}
@media(max-width:900px){#title-block{position:static;width:auto;margin:0 16px 40px;box-shadow:none}#tb-toggle{display:none}}

/* Docs panel */
#docs-panel{position:fixed;top:108px;right:24px;width:320px;max-height:calc(100vh - 140px);background:var(--paper);border:1.5px solid var(--ink);box-shadow:6px 6px 0 var(--accent-soft);display:flex;flex-direction:column;z-index:100}
#docs-panel.hidden{display:none}
#docs-panel-header{padding:8px 12px;background:var(--bar-bg);color:var(--bar-fg);font-family:var(--mono);font-size:11px;display:flex;align-items:center;justify-content:space-between;cursor:move;user-select:none;letter-spacing:.05em}
#docs-panel-header button{background:none;border:none;color:var(--bar-fg);cursor:pointer;font-size:16px;line-height:1;padding:0 2px;opacity:.7}
#docs-panel-header button:hover{opacity:1}
#docs-panel-body{overflow-y:auto;padding:12px 14px;flex:1;font-size:13px}
.docs-node{padding:1px 0}
.docs-row{display:flex;align-items:flex-start;gap:6px;padding:1px 0;line-height:1.5}
.docs-tri{flex-shrink:0;width:10px;margin-top:5px;cursor:pointer}
.docs-tri svg{display:block;transition:transform .15s}
.docs-tri.open svg{transform:rotate(90deg)}
.docs-dot{flex-shrink:0;width:10px;display:flex;align-items:center;justify-content:center;margin-top:8px}
.docs-dot span{display:block;width:4px;height:4px;border-radius:50%;background:var(--ink-light)}
.docs-text{color:var(--ink);line-height:1.5}
.docs-depth-0>.docs-row>.docs-text{font-weight:500;font-size:13px}
.docs-depth-1>.docs-row>.docs-text{font-size:12px}
.docs-depth-2>.docs-row>.docs-text{font-size:12px;color:var(--ink-mid)}
.docs-children{padding-left:14px;border-left:1px solid var(--hairline);margin-left:4px}
</style>
</head>
<body>

<a href="#main" class="skip-link">Skip to outline</a>

<header>
  <h1>Outliner</h1>
  <span id="version-badge">v0.6.0 &middot; Q edition</span>
</header>

<aside id="title-block" aria-label="Document title block">
  <button type="button" id="tb-toggle" title="Collapse title block" aria-expanded="true">&#9662;</button>
  <div class="tb-row tb-title-row">
    <div class="tb-cell">
      <label for="doc-title">Title</label>
      <input id="doc-title" type="text" value="Untitled" placeholder="Untitled" spellcheck="false">
    </div>
  </div>
  <div class="tb-row tb-detail">
    <div class="tb-cell">
      <label for="meta-owner-name">Drawn by</label>
      <input id="meta-owner-name" type="text" placeholder="Your name" spellcheck="false">
    </div>
    <div class="tb-cell tb-rev-cell">
      <label id="tb-rev-label">Rev</label>
      <span id="meta-rev" aria-labelledby="tb-rev-label">0</span>
    </div>
  </div>
  <div class="tb-row tb-detail">
    <div class="tb-cell">
      <label for="meta-date-created">Date</label>
      <input id="meta-date-created" type="text" readonly tabindex="-1">
    </div>
    <div class="tb-cell">
      <label for="meta-date-modified">Modified</label>
      <input id="meta-date-modified" type="text" readonly tabindex="-1">
    </div>
  </div>
  <div class="tb-row tb-detail">
    <div class="tb-cell">
      <label for="meta-owner-email">Contact</label>
      <input id="meta-owner-email" type="text" placeholder="your@email.com" spellcheck="false">
    </div>
  </div>
</aside>

<div id="hoist-bar">
  <span>Focused on: <strong id="hoist-label"></strong></span>
  <button type="button" id="btn-dehoist">&#8593; Back</button>
</div>

<nav class="toolbar" aria-label="Outline actions">
  <button type="button" id="btn-new">New</button>
  <button type="button" id="btn-open" title="Open a .json or .opml file (⌘O)">Open</button>
  <button type="button" id="btn-save" title="Save (⌘S)">Save</button>
  <button type="button" id="btn-saveas" title="Save As (⇧⌘S)">Save As</button>
  <input type="file" id="file-input" accept=".json,.opml,.xml" style="display:none">
  <div class="toolbar-sep"></div>
  <button type="button" id="btn-undo" title="Undo (⌘Z)" disabled>&#8630; Undo</button>
  <button type="button" id="btn-redo" title="Redo (⇧⌘Z)" disabled>&#8631; Redo</button>
  <div class="toolbar-sep"></div>
  <button type="button" id="btn-indent">&#8594; Indent</button>
  <button type="button" id="btn-outdent">&#8592; Outdent</button>
  <button type="button" id="btn-up" title="Move up (Alt-↑)">&#8593;</button>
  <button type="button" id="btn-down" title="Move down (Alt-↓)">&#8595;</button>
  <div class="toolbar-sep"></div>
  <button type="button" id="btn-collapse">Collapse All</button>
  <button type="button" id="btn-expand">Expand All</button>
  <button type="button" id="btn-hoist" title="Narrow the view to the selected branch (Alt-click a bullet)">Focus</button>
  <div class="toolbar-sep"></div>
  <button type="button" id="btn-export-opml" title="Export a copy as OPML for other outliners">Export OPML</button>
  <div class="toolbar-sep"></div>
  <button type="button" id="btn-theme" title="Cycle theme: Auto / Vellum / Blueprint">◐ Auto</button>
  <button type="button" id="btn-lettering" title="Content lettering: Standard / Drafting">Aa Standard</button>
  <div class="toolbar-sep"></div>
  <button type="button" class="docs-btn" id="docs-toggle-btn">? Docs</button>
  <button type="button" id="readonly-badge">&#128274; Read-only</button>
  <div class="hint">Tab/Shift-Tab &middot; Alt-&#8597; move &middot; &#8984;Z undo &middot; &#8984;S save &middot; Alt-click bullet to focus</div>
</nav>

<div id="url-source">Viewing: <a id="url-source-link" href="" target="_blank"></a></div>

<main id="main"><div id="outline-container"></div></main>

<div id="docs-panel" class="hidden">
  <div id="docs-panel-header">
    <span>DOCS</span>
    <button type="button" id="docs-close-btn" title="Close">&#215;</button>
  </div>
  <div id="docs-panel-body"></div>
</div>

<div id="status">Nodes: <span id="st-nodes">0</span> &nbsp;&middot;&nbsp; Max depth: <span id="st-depth">0</span> &nbsp;&middot;&nbsp; <span id="st-msg" role="status" aria-live="polite">Ready</span> <span id="file-chip" style="margin-left:auto"></span></div>

<script>
// ── Embedded docs ─────────────────────────────────────────────────────────────
const DOCS = [
  { text: "Getting started", children: [
    { text: "Click any node to edit it" },
    { text: "Enter creates a new sibling below" },
    { text: "Backspace on an empty node deletes it" },
  ]},
  { text: "Keyboard shortcuts", children: [
    { text: "Enter \u2014 new sibling below" },
    { text: "Tab \u2014 indent node" },
    { text: "Shift-Tab \u2014 outdent node" },
    { text: "Alt-\u2191 / Alt-\u2193 \u2014 move node up / down" },
    { text: "Arrow keys \u2014 navigate" },
    { text: "Backspace on empty \u2014 delete" },
  ]},
  { text: "Mouse", children: [
    { text: "Click bullet \u2014 collapse / expand" },
    { text: "Alt-click bullet \u2014 focus on that branch" },
    { text: "Drag rows to reorder" },
  ]},
  { text: "Focus", children: [
    { text: "Narrows the view to a single branch \u2014 other outliners call this hoist or zoom" },
    { text: "Alt-click any bullet, or select a node and click Focus" },
    { text: "Click \u2191 Back in the bar to return" },
    { text: "Focus stacks: you can focus deeper inside a focused branch" },
  ]},
  { text: "Appearance", children: [
    { text: "\u25D0 cycles the theme: Auto follows your system; Vellum and Blueprint force light or dark" },
    { text: "Aa switches content lettering: Standard, or Drafting \u2014 embedded Leroy-set engineering lettering" },
    { text: "Both choices are remembered in this browser" },
  ]},
  { text: "Files", children: [
    { text: "The native format is JSON \u2014 it saves everything: text, structure, expansion state, cursor" },
    { text: "Save (\u2318S) writes the open file in place; Save As (\u21e7\u2318S) picks a new one" },
    { text: "In Chrome, Edge, and Comet, files save directly to disk; Safari and Firefox download a copy instead" },
    { text: "Open (\u2318O) reads .json or .opml files" },
    { text: "Opening an OPML file imports it \u2014 use Save to keep it as JSON" },
    { text: "Export OPML makes a copy for Drummer, Frontier, Workflowy, and other outliners" },
    { text: "Everything also autosaves to this browser, so nothing is lost between visits" },
  ]},
  { text: "Title block", children: [
    { text: "Bottom right, like a drawing sheet: title, drawn by, date, contact" },
    { text: "REV counts successful saves \u2014 it increments each time the file is written" },
    { text: "The \u25BE tab on its left edge collapses it to just the title" },
  ]},
  { text: "Undo", children: [
    { text: "\u2318Z undoes; \u21e7\u2318Z or \u2318Y redoes" },
    { text: "Covers edits, moves, indents, deletes, imports, and New" },
    { text: "Up to 200 steps per session" },
  ]},
  { text: "URL viewer mode", children: [
    { text: "Add ?url= to the address to open any public .json or .opml outline in read-only mode" },
    { text: "Example: outliner.html?url=https://example.com/outline.opml" },
    { text: "The outline is fully navigable: collapse, expand, hoist all work" },
    { text: "Editing is disabled \u2014 a lock badge appears in the toolbar" },
    { text: "The source URL is shown in a bar below the toolbar" },
    { text: "Export OPML still works \u2014 you can save a local copy" },
  ]},
];

// ── Metadata ──────────────────────────────────────────────────────────────────
let meta = {
  dateCreated: new Date().toUTCString(),
  dateModified: new Date().toUTCString(),
  ownerName: '',
  ownerEmail: '',
  rev: 0,
};

function refreshMetaUI() {
  document.getElementById('meta-owner-name').value  = meta.ownerName;
  document.getElementById('meta-owner-email').value = meta.ownerEmail;
  document.getElementById('meta-date-created').value  = fmtDate(meta.dateCreated);
  document.getElementById('meta-date-modified').value = fmtDate(meta.dateModified);
  document.getElementById('meta-rev').textContent = String(meta.rev || 0);
}

function fmtDate(s) {
  if (!s) return '';
  try { return new Date(s).toLocaleString(); } catch(e) { return s; }
}

function touchModified() {
  meta.dateModified = new Date().toUTCString();
  document.getElementById('meta-date-modified').value = fmtDate(meta.dateModified);
}

document.getElementById('meta-owner-name').addEventListener('input',  e => { meta.ownerName  = e.target.value; touchModified(); markDirty(); saveStateSoon(); });
document.getElementById('meta-owner-email').addEventListener('input', e => { meta.ownerEmail = e.target.value; touchModified(); markDirty(); saveStateSoon(); });
document.getElementById('doc-title').addEventListener('input', () => { markDirty(); saveStateSoon(); });

// ── Docs panel ────────────────────────────────────────────────────────────────
let docsVisible = false;

function renderDocsNode(n, depth) {
  const wrap = document.createElement('div');
  wrap.className = `docs-node docs-depth-${depth}`;
  const row = document.createElement('div');
  row.className = 'docs-row';
  if (n.children && n.children.length) {
    const tri = document.createElement('div');
    tri.className = 'docs-tri open';
    tri.innerHTML = '<svg width="8" height="8" viewBox="0 0 8 8"><polygon points="1,1 7,4 1,7" fill="var(--ink)"/></svg>';
    tri.dataset.open = 'true';
    row.appendChild(tri);
    const txt = document.createElement('span');
    txt.className = 'docs-text'; txt.textContent = n.text;
    row.appendChild(txt);
    wrap.appendChild(row);
    const ch = document.createElement('div');
    ch.className = 'docs-children';
    n.children.forEach(c => ch.appendChild(renderDocsNode(c, depth + 1)));
    wrap.appendChild(ch);
    tri.addEventListener('click', () => {
      const open = tri.classList.toggle('open');
      ch.style.display = open ? '' : 'none';
    });
  } else {
    const dot = document.createElement('div');
    dot.className = 'docs-dot';
    dot.innerHTML = '<span></span>';
    row.appendChild(dot);
    const txt = document.createElement('span');
    txt.className = 'docs-text'; txt.textContent = n.text;
    row.appendChild(txt);
    wrap.appendChild(row);
  }
  return wrap;
}

function buildDocsPanel() {
  const body = document.getElementById('docs-panel-body');
  body.innerHTML = '';
  DOCS.forEach(n => body.appendChild(renderDocsNode(n, 0)));
}

function toggleDocs() {
  docsVisible = !docsVisible;
  document.getElementById('docs-panel').classList.toggle('hidden', !docsVisible);
  document.getElementById('docs-toggle-btn').classList.toggle('active', docsVisible);
}

(function() {
  const panel = document.getElementById('docs-panel');
  const hdr   = document.getElementById('docs-panel-header');
  let ox=0,oy=0,dragging=false;
  hdr.addEventListener('mousedown', e => {
    if (e.target.tagName === 'BUTTON') return;
    dragging=true; panel.style.right='auto';
    ox=e.clientX-panel.offsetLeft; oy=e.clientY-panel.offsetTop;
  });
  document.addEventListener('mousemove', e => { if(dragging){panel.style.left=(e.clientX-ox)+'px';panel.style.top=(e.clientY-oy)+'px';} });
  document.addEventListener('mouseup', () => { dragging=false; });
})();

// ── Outliner model ────────────────────────────────────────────────────────────
let idCounter=0;
const newId=()=>++idCounter;
function makeNode(text='',children=[]){return{id:newId(),text,children,collapsed:false}}
let root={id:0,text:'__root__',children:[],collapsed:false};
let hoistStack=[],focusedId=null;
function getDisplayRoot(){return hoistStack.length?hoistStack[hoistStack.length-1].node:root}

// ── Undo / redo ──────────────────────────────────────────────────────
// Snapshot-based. Every structural mutation pushes a snapshot first; text
// edits push one snapshot per editing burst (armed on focus).
const UNDO_MAX = 200;
let undoStack = [], redoStack = [], editArmed = false;

function takeSnapshot() {
  return {
    title:    document.getElementById('doc-title').value,
    meta:     { ...meta },
    rootJSON: JSON.stringify(serializeNode(root)),
    focusedId,
    hoistIds: hoistStack.map(h => h.node.id),
    fileHandle, fileName,
  };
}

function pushUndo() {
  undoStack.push(takeSnapshot());
  if (undoStack.length > UNDO_MAX) undoStack.shift();
  redoStack.length = 0;
  markDirty();
  updateUndoButtons();
}

function restoreSnapshot(s) {
  document.getElementById('doc-title').value = s.title;
  meta = { ...s.meta };
  refreshMetaUI();
  idCounter = 0;
  const r = JSON.parse(s.rootJSON);
  root = { id: 0, text: '__root__', collapsed: false, children: (r.children || []).map(deserializeNode) };
  hoistStack = [];
  s.hoistIds.forEach(id => { const n = findNode(root, id); if (n) hoistStack.push({ node: n }); });
  document.body.classList.toggle('hoisted', hoistStack.length > 0);
  if (hoistStack.length) document.getElementById('hoist-label').textContent = hoistStack[hoistStack.length - 1].node.text || '(untitled)';
  fileHandle = s.fileHandle; fileName = s.fileName;
  markDirty();
  render();
  if (s.focusedId && findNode(root, s.focusedId)) focusNode(s.focusedId);
}

function undo() {
  if (!undoStack.length) { msg('Nothing to undo'); return; }
  redoStack.push(takeSnapshot());
  restoreSnapshot(undoStack.pop());
  editArmed = false;
  updateUndoButtons();
  msg('Undo');
}

function redo() {
  if (!redoStack.length) { msg('Nothing to redo'); return; }
  undoStack.push(takeSnapshot());
  restoreSnapshot(redoStack.pop());
  editArmed = false;
  updateUndoButtons();
  msg('Redo');
}

function updateUndoButtons() {
  const u = document.getElementById('btn-undo'), rBtn = document.getElementById('btn-redo');
  if (u) u.disabled = !undoStack.length;
  if (rBtn) rBtn.disabled = !redoStack.length;
}

// ── File handling (File System Access API with download fallback) ───────
const FS_OK = 'showOpenFilePicker' in window;
let fileHandle = null, fileName = '', dirty = false;

function updateFileChip() {
  const el = document.getElementById('file-chip');
  if (!el) return;
  if (fileName) {
    el.textContent = (dirty ? '\u25CF ' : '') + fileName;
    el.title = dirty ? 'Unsaved changes \u2014 \u2318S to save' : 'Saved';
  } else {
    el.textContent = dirty ? '\u25CF unsaved' : '';
    el.title = dirty ? 'Not yet saved to a file \u2014 \u2318S to save' : '';
  }
  el.classList.toggle('dirty', dirty);
}

function markDirty()  { if (!dirty) { dirty = true; updateFileChip(); } else updateFileChip(); }
function clearDirty() { dirty = false; updateFileChip(); }

// Tiny IndexedDB helper so the file handle survives a reload.
function idbStore(mode, fn) {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) { resolve(undefined); return; }
    const req = indexedDB.open('outliner-fs', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onerror = () => reject(req.error);
    req.onsuccess = () => {
      try {
        const tx = req.result.transaction('handles', mode);
        const out = fn(tx.objectStore('handles'));
        tx.oncomplete = () => resolve(out && out.result);
        tx.onerror = () => reject(tx.error);
      } catch (e) { reject(e); }
    };
  });
}
const idbSetHandle = h  => idbStore('readwrite', s => s.put(h, 'handle')).catch(() => {});
const idbGetHandle = () => idbStore('readonly',  s => s.get('handle')).catch(() => undefined);
const idbDelHandle = () => idbStore('readwrite', s => s.delete('handle')).catch(() => {});

function suggestedFileName() {
  const t = (document.getElementById('doc-title').value || 'outline').trim();
  return (t.replace(/[^\w\- ]+/g, '').replace(/\s+/g, '_') || 'outline') + '.json';
}

function buildDocJSON() {
  touchModified();
  return {
    format: 'outliner',
    formatVersion: 1,
    title: document.getElementById('doc-title').value || 'Untitled',
    meta: { ...meta },
    root: serializeNode(root),
    expansionState: calcExpansionState(root),
    lastCursor: focusedId ? calcLastCursor(root, focusedId) : 1,
    vertScrollState: calcVertScrollState(root),
  };
}

function loadDocJSON(obj, sourceName) {
  if (!obj || obj.format !== 'outliner' || !obj.root) throw new Error('Not an outliner JSON file');
  document.getElementById('doc-title').value = obj.title || sourceName || 'Untitled';
  meta.dateCreated  = (obj.meta && obj.meta.dateCreated)  || new Date().toUTCString();
  meta.dateModified = (obj.meta && obj.meta.dateModified) || new Date().toUTCString();
  meta.ownerName    = (obj.meta && obj.meta.ownerName)    || '';
  meta.ownerEmail   = (obj.meta && obj.meta.ownerEmail)   || '';
  meta.rev          = (obj.meta && obj.meta.rev)          || 0;
  refreshMetaUI();
  idCounter = 0;
  root = { id: 0, text: '__root__', collapsed: false, children: (obj.root.children || []).map(deserializeNode) };
  hoistStack = []; document.body.classList.remove('hoisted');
  applyExpansionState(root, obj.expansionState || '');
  render();
  setTimeout(() => {
    applyVertScrollState(root, obj.vertScrollState || 1);
    const cursorId = nodeIdAtLine(root, obj.lastCursor || 1);
    if (cursorId) focusNode(cursorId);
    else if (root.children.length) focusNode(root.children[0].id);
  }, 50);
}

function openText(text, name, handle) {
  pushUndo(); // the previous document (and its file link) is one \u2318Z away
  const trimmed = text.trim();
  try {
    if (trimmed.startsWith('{')) {
      loadDocJSON(JSON.parse(trimmed), name);
      fileHandle = handle || null;
      fileName = name;
      if (fileHandle) idbSetHandle(fileHandle);
      clearDirty();
      msg('Opened ' + name);
    } else {
      loadOPMLText(text, name);
      fileHandle = null; fileName = '';
      idbDelHandle();
      markDirty();
      msg('Imported ' + name + ' \u2014 \u2318S to save as JSON');
    }
    saveState();
  } catch (err) { msg('Error: ' + err.message); }
}

async function doOpen() {
  if (readOnly) return;
  if (FS_OK) {
    try {
      const [h] = await window.showOpenFilePicker({
        types: [{ description: 'Outline files', accept: { 'application/json': ['.json'], 'text/xml': ['.opml', '.xml'] } }],
      });
      const f = await h.getFile();
      const text = await f.text();
      openText(text, f.name, f.name.toLowerCase().endsWith('.json') ? h : null);
    } catch (e) { if (e.name !== 'AbortError') msg('Open failed: ' + e.message); }
  } else {
    document.getElementById('file-input').click();
  }
}

async function doSave(saveAs) {
  if (readOnly) { msg('Read-only view \u2014 use Export OPML for a copy'); return; }
  const nextRev = (meta.rev || 0) + 1;
  const doc = buildDocJSON();
  doc.meta.rev = nextRev;
  const json = JSON.stringify(doc, null, 2);
  if (FS_OK) {
    try {
      if (saveAs || !fileHandle) {
        fileHandle = await window.showSaveFilePicker({
          suggestedName: fileName || suggestedFileName(),
          types: [{ description: 'Outline JSON', accept: { 'application/json': ['.json'] } }],
        });
      } else if (fileHandle.queryPermission) {
        let perm = await fileHandle.queryPermission({ mode: 'readwrite' });
        if (perm !== 'granted') perm = await fileHandle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') throw new Error('permission denied');
      }
      const w = await fileHandle.createWritable();
      await w.write(json); await w.close();
      fileName = fileHandle.name;
      idbSetHandle(fileHandle);
      meta.rev = nextRev; refreshMetaUI();
      clearDirty(); saveState();
      msg('Saved ' + fileName + ' \u00b7 rev ' + nextRev);
    } catch (e) { if (e.name !== 'AbortError') msg('Save failed: ' + e.message); }
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
    a.download = fileName || suggestedFileName();
    a.click();
    fileName = a.download;
    meta.rev = nextRev; refreshMetaUI();
    clearDirty(); saveState();
    msg('Downloaded ' + a.download + ' \u00b7 rev ' + nextRev);
  }
}

function doNew() {
  if (readOnly) return;
  const hasContent = countNodes(root) > 1 || (root.children[0] && root.children[0].text);
  if (hasContent && !window.confirm('Start a new outline? The current one stays one \u2318Z away' + (fileName ? ', and ' + fileName + ' on disk is untouched' : '') + '.')) return;
  pushUndo();
  document.getElementById('doc-title').value = 'Untitled';
  meta = { dateCreated: new Date().toUTCString(), dateModified: new Date().toUTCString(), ownerName: meta.ownerName, ownerEmail: meta.ownerEmail, rev: 0 };
  refreshMetaUI();
  idCounter = 0;
  root = { id: 0, text: '__root__', collapsed: false, children: [makeNode('')] };
  hoistStack = []; document.body.classList.remove('hoisted');
  fileHandle = null; fileName = '';
  idbDelHandle();
  clearDirty();
  render();
  setTimeout(() => focusNode(root.children[0].id), 50);
  saveState();
  msg('New outline');
}

function render(){
  const c=document.getElementById('outline-container'),dr=getDisplayRoot();
  c.innerHTML='';
  dr.children.forEach(n=>c.appendChild(renderNode(n,0)));
  updateStatus();
  saveStateSoon();
}
function renderNode(node,depth){
  const div=document.createElement('div');
  div.className='node'+(node.children.length?' has-children':'')+(node.collapsed?' collapsed':'');
  div.dataset.id=node.id; div.dataset.depth=depth;
  const row=document.createElement('div');
  row.className='node-row'+(node.id===focusedId?' focused':'');
  const bw=document.createElement('div'); bw.className='bullet-wrap';
  bw.title='Click: collapse/expand  Alt-click: focus';
  const bullet=document.createElement('div'); bullet.className='bullet';
  bw.appendChild(bullet);
  bw.addEventListener('click',e=>{
    if(e.altKey){hoistNode(node);return}
    if(node.children.length){node.collapsed=!node.collapsed;render()}
  });
  const span=document.createElement('div');
  span.className='node-text'; span.contentEditable= readOnly ? 'false' : 'true'; span.spellcheck=true;
  span.dataset.placeholder=depth===0?'Start typing\u2026':'\u2026';
  span.textContent=node.text;
  span.addEventListener('focus',()=>{focusedId=node.id;editArmed=true;updateFocusHighlight()});
  span.addEventListener('blur',()=>{node.text=span.textContent;touchModified();updateStatus()});
  span.addEventListener('input',()=>{if(editArmed){editArmed=false;pushUndo()}node.text=span.textContent;markDirty();saveStateSoon()});
  span.addEventListener('keydown',e=>{
    if(readOnly){
      // allow navigation only
      if(!e.altKey&&e.key==='ArrowUp'){const p=getPrevVisible(node);if(p){e.preventDefault();focusNode(p.id)}}
      if(!e.altKey&&e.key==='ArrowDown'){const n2=getNextVisible(node);if(n2){e.preventDefault();focusNode(n2.id)}}
      e.preventDefault(); return;
    }
    if(e.key==='Enter'&&!e.shiftKey){
      e.preventDefault(); node.text=span.textContent;
      const parent=findParent(root,node.id); if(!parent)return;
      pushUndo();
      const idx=parent.children.indexOf(node),nn=makeNode();
      parent.children.splice(idx+1,0,nn); render(); focusNode(nn.id);
    }
    if(e.key==='Tab'){e.preventDefault();e.shiftKey?outdentNode(node):indentNode(node)}
    if(e.key==='Backspace'&&span.textContent===''){e.preventDefault();deleteNode(node)}
    if(e.altKey&&e.key==='ArrowUp'){e.preventDefault();moveNodeUp(node)}
    if(e.altKey&&e.key==='ArrowDown'){e.preventDefault();moveNodeDown(node)}
    if(!e.altKey&&e.key==='ArrowUp'){const p=getPrevVisible(node);if(p){e.preventDefault();focusNode(p.id)}}
    if(!e.altKey&&e.key==='ArrowDown'){const n2=getNextVisible(node);if(n2){e.preventDefault();focusNode(n2.id)}}
    // Cmd-U/D/L/R -- classic outliner shortcuts (also Ctrl on Windows/Linux)
    const cmdKey = e.metaKey || e.ctrlKey;
    if(cmdKey&&e.key==='u'){e.preventDefault();moveNodeUp(node)}
    if(cmdKey&&e.key==='d'){e.preventDefault();moveNodeDown(node)}
    if(cmdKey&&e.key==='l'){e.preventDefault();outdentNode(node)}
    if(cmdKey&&e.key==='r'){e.preventDefault();indentNode(node)}
  });
  row.draggable=true;
  row.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',node.id);setTimeout(()=>div.classList.add('dragging'),0)});
  row.addEventListener('dragend',()=>div.classList.remove('dragging'));
  row.addEventListener('dragover',e=>{
    e.preventDefault();
    const mid=row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;
    row.classList.remove('drag-over-above','drag-over-below');
    row.classList.add(e.clientY<mid?'drag-over-above':'drag-over-below');
  });
  row.addEventListener('dragleave',()=>row.classList.remove('drag-over-above','drag-over-below'));
  row.addEventListener('drop',e=>{
    e.preventDefault();
    const dragId=parseInt(e.dataTransfer.getData('text/plain')),dragNode=findNode(root,dragId);
    const above=e.clientY<row.getBoundingClientRect().top+row.getBoundingClientRect().height/2;
    if(dragNode&&dragNode.id!==node.id){
      pushUndo();
      removeNode(root,dragId);
      const parent=findParent(root,node.id);
      if(parent){const idx=parent.children.indexOf(node);parent.children.splice(above?idx:idx+1,0,dragNode)}
      render(); focusNode(dragNode.id);
    }
    row.classList.remove('drag-over-above','drag-over-below');
  });
  row.appendChild(bw); row.appendChild(span); div.appendChild(row);
  if(node.children.length){
    const ch=document.createElement('div'); ch.className='children';
    node.children.forEach(c=>ch.appendChild(renderNode(c,depth+1)));
    div.appendChild(ch);
  }
  return div;
}
function updateFocusHighlight(){
  document.querySelectorAll('.node-row').forEach(r=>{
    const id=parseInt(r.closest('.node').dataset.id);
    r.classList.toggle('focused',id===focusedId);
  });
}
function findNode(node,id){
  if(node.id===id)return node;
  for(const c of node.children){const f=findNode(c,id);if(f)return f}
  return null;
}
function findParent(node,id){
  for(const c of node.children){
    if(c.id===id)return node;
    const f=findParent(c,id); if(f)return f;
  }
  return null;
}
function removeNode(node,id){
  const idx=node.children.findIndex(c=>c.id===id);
  if(idx!==-1){node.children.splice(idx,1);return true}
  return node.children.some(c=>removeNode(c,id));
}
function flatVisible(dr){
  const list=[];
  function walk(n){list.push(n);if(!n.collapsed)n.children.forEach(walk)}
  dr.children.forEach(walk); return list;
}
function getPrevVisible(node){const flat=flatVisible(getDisplayRoot()),i=flat.findIndex(n=>n.id===node.id);return i>0?flat[i-1]:null}
function getNextVisible(node){const flat=flatVisible(getDisplayRoot()),i=flat.findIndex(n=>n.id===node.id);return i<flat.length-1?flat[i+1]:null}
function focusNode(id){
  focusedId=id; render();
  const el=document.querySelector(`.node[data-id="${id}"] .node-text`);
  if(el){el.focus();const r=document.createRange(),s=window.getSelection();r.selectNodeContents(el);r.collapse(false);s.removeAllRanges();s.addRange(r)}
}
function getFocusedNode(){return focusedId?findNode(root,focusedId):null}
function indentNode(node){
  const parent=findParent(root,node.id); if(!parent)return;
  const idx=parent.children.indexOf(node); if(idx===0)return;
  pushUndo();
  const prev=parent.children[idx-1]; removeNode(root,node.id);
  prev.collapsed=false; prev.children.push(node); render(); focusNode(node.id); msg('Indented');
}
function outdentNode(node){
  const parent=findParent(root,node.id);
  if(!parent||parent.id===0)return;
  const gp=findParent(root,parent.id); if(!gp)return;
  pushUndo();
  const pi=gp.children.indexOf(parent); removeNode(root,node.id);
  gp.children.splice(pi+1,0,node); render(); focusNode(node.id); msg('Outdented');
}
function deleteNode(node){
  pushUndo();
  const prev=getPrevVisible(node); removeNode(root,node.id); render();
  if(prev)focusNode(prev.id); touchModified(); msg('Node deleted');
}
function moveNodeUp(node){
  const parent=findParent(root,node.id); if(!parent)return;
  const i=parent.children.indexOf(node); if(i===0)return;
  pushUndo();
  parent.children.splice(i,1); parent.children.splice(i-1,0,node);
  render(); focusNode(node.id); touchModified(); msg('Moved up');
}
function moveNodeDown(node){
  const parent=findParent(root,node.id); if(!parent)return;
  const i=parent.children.indexOf(node); if(i===parent.children.length-1)return;
  pushUndo();
  parent.children.splice(i,1); parent.children.splice(i+1,0,node);
  render(); focusNode(node.id); touchModified(); msg('Moved down');
}
function indentSelected(){const n=getFocusedNode();if(n)indentNode(n)}
function outdentSelected(){const n=getFocusedNode();if(n)outdentNode(n)}
function moveUp(){const n=getFocusedNode();if(n)moveNodeUp(n)}
function moveDown(){const n=getFocusedNode();if(n)moveNodeDown(n)}
function collapseAll(){
  pushUndo();
  function walk(n){if(n.children.length){n.collapsed=true;n.children.forEach(walk)}}
  getDisplayRoot().children.forEach(walk); render(); msg('Collapsed all');
}
function expandAll(){
  pushUndo();
  function walk(n){n.collapsed=false;n.children.forEach(walk)}
  getDisplayRoot().children.forEach(walk); render(); msg('Expanded all');
}
function hoistNode(node){
  hoistStack.push({node}); document.body.classList.add('hoisted');
  document.getElementById('hoist-label').textContent=node.text||'(untitled)';
  render(); if(node.children.length)focusNode(node.children[0].id);
  msg('Focused on: '+(node.text||'(untitled)'));
}
function hoistSelected(){const n=getFocusedNode();if(n)hoistNode(n)}
function dehoist(){
  if(!hoistStack.length)return;
  const{node}=hoistStack.pop();
  if(!hoistStack.length)document.body.classList.remove('hoisted');
  else document.getElementById('hoist-label').textContent=hoistStack[hoistStack.length-1].node.text;
  render(); focusNode(node.id); msg('Back to full outline');
}

// ── OPML ──────────────────────────────────────────────────────────────────────
function esc(s){return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function nodeToOPML(node,indent){
  const pad=' '.repeat(indent);
  if(!node.children.length)return`${pad}<outline text="${esc(node.text)}"/>`;
  const kids=node.children.map(c=>nodeToOPML(c,indent+2)).join('\n');
  return`${pad}<outline text="${esc(node.text)}">\n${kids}\n${pad}</outline>`;
}
function exportOPML(){
  touchModified();
  const title=document.getElementById('doc-title').value||'Untitled';
  const expansionState = calcExpansionState(root);
  const lastCursorVal = focusedId ? calcLastCursor(root, focusedId) : 1;
  const vertScrollVal = calcVertScrollState(root);
  const headFields = [
    `    <title>${esc(title)}</title>`,
    meta.dateCreated  ? `    <dateCreated>${esc(meta.dateCreated)}</dateCreated>`   : '',
    meta.dateModified ? `    <dateModified>${esc(meta.dateModified)}</dateModified>` : '',
    meta.ownerName    ? `    <ownerName>${esc(meta.ownerName)}</ownerName>`          : '',
    meta.ownerEmail   ? `    <ownerEmail>${esc(meta.ownerEmail)}</ownerEmail>`       : '',
    expansionState    ? `    <expansionState>${esc(expansionState)}</expansionState>` : '',
    `    <lastCursor>${lastCursorVal}</lastCursor>`,
    `    <vertScrollState>${vertScrollVal}</vertScrollState>`,
  ].filter(Boolean).join('\n');
  const body=root.children.map(c=>nodeToOPML(c,4)).join('\n');
  const opml=`<?xml version="1.0" encoding="UTF-8"?>\n<opml version="2.0">\n  <head>\n${headFields}\n  </head>\n  <body>\n${body}\n  </body>\n</opml>`;
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([opml],{type:'text/xml'}));
  a.download=(title.replace(/\s+/g,'_')||'outline')+'.opml';
  a.click(); msg('Exported OPML');
}
function loadOPMLText(text, name){
  const xml=new DOMParser().parseFromString(text,'text/xml');
  if(xml.querySelector('parsererror'))throw new Error('Could not parse '+name+' as OPML');
  const get=tag=>{const el=xml.querySelector(`head > ${tag}`);return el?el.textContent:''};
  document.getElementById('doc-title').value = get('title') || (name?name.replace(/\.(opml|xml)$/i,''):'Untitled');
  meta.dateCreated  = get('dateCreated')  || new Date().toUTCString();
  meta.dateModified = get('dateModified') || new Date().toUTCString();
  meta.ownerName    = get('ownerName')    || '';
  meta.ownerEmail   = get('ownerEmail')   || '';
  meta.rev          = 0;
  refreshMetaUI();
  const body=xml.querySelector('body');
  if(!body)throw new Error('No body element');
  idCounter=0;
  root={id:0,text:'__root__',children:Array.from(body.children).map(el=>parseOPMLNode(el)),collapsed:false};
  hoistStack=[]; document.body.classList.remove('hoisted');
  applyExpansionState(root, get('expansionState'));
  render();
  setTimeout(() => {
    const vs = parseInt(get('vertScrollState')) || 1;
    const lc = parseInt(get('lastCursor')) || 1;
    applyVertScrollState(root, vs);
    const cursorId = nodeIdAtLine(root, lc);
    if (cursorId) focusNode(cursorId);
    else if (root.children.length) focusNode(root.children[0].id);
  }, 50);
}
function handleFileInput(e){
  const file=e.target.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>openText(ev.target.result, file.name, null);
  reader.readAsText(file);
  e.target.value='';
}
function parseOPMLNode(el){
  const node=makeNode(el.getAttribute('text')||'');
  Array.from(el.children).forEach(c=>node.children.push(parseOPMLNode(c)));
  return node;
}

// ── Status ────────────────────────────────────────────────────────────────────
let msgTimer;
function msg(text){document.getElementById('st-msg').textContent=text;clearTimeout(msgTimer);msgTimer=setTimeout(()=>document.getElementById('st-msg').textContent='Ready',2500)}
function countNodes(n){return n.children.reduce((a,c)=>a+1+countNodes(c),0)}
function maxDepth(n,d=0){return n.children.length?Math.max(...n.children.map(c=>maxDepth(c,d+1))):d}
function updateStatus(){document.getElementById('st-nodes').textContent=countNodes(root);document.getElementById('st-depth').textContent=maxDepth(root)}

// ── expansionState / lastCursor / vertScrollState ────────────────────────────────────────
// expansionState is a comma-separated list of 1-based line numbers of nodes
// that are expanded, where line numbers count every node in flat document order.

function calcExpansionState(rootNode) {
  // Walk only visible (non-collapsed) nodes in order, matching Concord/Drummer.
  // A node gets a line number only if its parent is expanded (or it is top-level).
  // Expanded nodes (has children and not collapsed) are added to the list.
  const expanded = [];
  let lineNum = 0;
  function walk(node) {
    lineNum++;
    if (node.children.length) {
      if (!node.collapsed) {
        expanded.push(lineNum);
        node.children.forEach(walk); // only recurse if expanded
      }
      // if collapsed, children are not rendered, so not counted
    }
  }
  rootNode.children.forEach(walk);
  return expanded.join(',');
}

function applyExpansionState(rootNode, expansionStateStr) {
  // Mirror of calcExpansionState: walk rendered nodes in order.
  // Start with everything collapsed, then expand nodes whose number is in the set.
  // Because expanding a node reveals its children for counting, we must process
  // in a single pass, expanding as we go so child line numbers are correct.
  if (!expansionStateStr || !expansionStateStr.trim()) return;
  const expandedSet = new Set(
    expansionStateStr.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n))
  );
  // First collapse everything
  function collapseAll(node) {
    if (node.children.length) node.collapsed = true;
    node.children.forEach(collapseAll);
  }
  rootNode.children.forEach(collapseAll);
  // Now walk rendered order, expanding as we go
  let lineNum = 0;
  function walk(node) {
    lineNum++;
    if (node.children.length) {
      if (expandedSet.has(lineNum)) {
        node.collapsed = false;
        node.children.forEach(walk); // now they are rendered, continue counting
      }
      // if not in set, stays collapsed, children not counted
    }
  }
  rootNode.children.forEach(walk);
}

// lastCursor: 1-based line number of the focused node in rendered order.
// Uses same visible-node counting as expansionState.
function calcLastCursor(rootNode, targetId) {
  let lineNum = 0, found = 0;
  function walk(node) {
    lineNum++;
    if (node.id === targetId) found = lineNum;
    if (!node.collapsed) node.children.forEach(walk);
  }
  rootNode.children.forEach(walk);
  return found || 1;
}

// Given a 1-based lastCursor line number, return the node id at that position.
function nodeIdAtLine(rootNode, lineNum) {
  let count = 0, foundId = null;
  function walk(node) {
    count++;
    if (count === lineNum) { foundId = node.id; return; }
    if (!node.collapsed) node.children.forEach(walk);
  }
  rootNode.children.forEach(walk);
  return foundId;
}

// vertScrollState: 1-based line number of the node nearest the top of the viewport.
function calcVertScrollState(rootNode) {
  const container = document.getElementById('outline-container');
  const containerTop = container.getBoundingClientRect().top;
  let lineNum = 0, best = 1, bestDist = Infinity;
  function walk(node) {
    lineNum++;
    const el = document.querySelector(`.node[data-id="${node.id}"] .node-row`);
    if (el) {
      const dist = Math.abs(el.getBoundingClientRect().top - containerTop);
      if (dist < bestDist) { bestDist = dist; best = lineNum; }
    }
    if (!node.collapsed) node.children.forEach(walk);
  }
  rootNode.children.forEach(walk);
  return best;
}

// Scroll the viewport so the given 1-based line number is near the top.
function applyVertScrollState(rootNode, lineNum) {
  if (!lineNum || lineNum <= 1) return;
  const id = nodeIdAtLine(rootNode, lineNum);
  if (!id) return;
  const el = document.querySelector(`.node[data-id="${id}"]`);
  if (el) el.scrollIntoView({ block: 'start', behavior: 'instant' });
}

let readOnly = false;

function setReadOnly(url) {
  readOnly = true;
  document.body.classList.add('readonly');
  const link = document.getElementById('url-source-link');
  link.textContent = url;
  link.href = url;
}

// ── Rules ──────────────────────────────────────────────
// Rules control how each depth level is rendered on screen -- WYSIWYG.
// Each rule: { fontSize, fontWeight, fontFamily, fontStyle, color, lineHeight, topMargin }
// This matches the look of this.how pages.
const RULES = [
  // depth 0 -- object line: heavy sans, like a drawing title
  { fontSize:'18px', fontWeight:'650', fontFamily:"var(--sans)",  fontStyle:'normal', color:'var(--ink)',     lineHeight:'1.45', topMargin:'12px' },
  // depth 1 -- primary content, serif
  { fontSize:'17px', fontWeight:'400', fontFamily:"var(--serif)", fontStyle:'normal', color:'var(--ink)',     lineHeight:'1.55', topMargin:'2px'  },
  // depth 2 -- secondary content
  { fontSize:'15.5px', fontWeight:'400', fontFamily:"var(--serif)", fontStyle:'normal', color:'var(--ink-mid)', lineHeight:'1.55', topMargin:'1px'  },
  // depth 3 -- dimension text: fine mono
  { fontSize:'13.5px', fontWeight:'400', fontFamily:"var(--mono)", fontStyle:'normal', color:'var(--ink-mid)', lineHeight:'1.5', topMargin:'0' },
  // depth 4+ (fallback) -- hairline
  { fontSize:'12.5px', fontWeight:'400', fontFamily:"var(--mono)", fontStyle:'normal', color:'var(--ink-light)', lineHeight:'1.5', topMargin:'0' },
];

const RULES_DRAFT = [
  // Engineering lettering throughout; hierarchy from size, spacing, and case
  { fontSize:'16.5px', fontWeight:'400', fontFamily:"var(--draft)", fontStyle:'normal', color:'var(--ink)',      lineHeight:'1.5',  topMargin:'12px', letterSpacing:'.05em', textTransform:'uppercase' },
  { fontSize:'15.5px', fontWeight:'400', fontFamily:"var(--draft)", fontStyle:'normal', color:'var(--ink)',      lineHeight:'1.55', topMargin:'2px',  letterSpacing:'.02em' },
  { fontSize:'14.5px', fontWeight:'400', fontFamily:"var(--draft)", fontStyle:'normal', color:'var(--ink-mid)',  lineHeight:'1.55', topMargin:'1px',  letterSpacing:'.02em' },
  { fontSize:'13px',   fontWeight:'400', fontFamily:"var(--draft)", fontStyle:'normal', color:'var(--ink-mid)',  lineHeight:'1.5',  topMargin:'0',    letterSpacing:'.02em' },
  { fontSize:'12px',   fontWeight:'400', fontFamily:"var(--draft)", fontStyle:'normal', color:'var(--ink-light)',lineHeight:'1.5',  topMargin:'0',    letterSpacing:'.02em' },
];

function activeRules() { return ui.lettering === 'draft' ? RULES_DRAFT : RULES; }

function getRuleForDepth(depth) {
  const R = activeRules();
  return R[Math.min(depth, R.length - 1)];
}

function applyRules() {
  // Inject a <style> block with depth-based rules derived from RULES array.
  // Deep-node catch-all emitted FIRST so depth-specific rules (equal
  // specificity) win the cascade for depths 0..n-1.
  let css = '';
  const R = activeRules();
  const extras = r => (r.letterSpacing ? `letter-spacing:${r.letterSpacing};` : '') + (r.textTransform ? `text-transform:${r.textTransform};` : '');
  const deep = R[R.length - 1];
  css += `.node[data-depth]>.node-row .node-text{font-size:${deep.fontSize};font-weight:${deep.fontWeight};font-family:${deep.fontFamily};font-style:${deep.fontStyle};color:${deep.color};line-height:${deep.lineHeight};${extras(deep)}}\n`;
  R.slice(0, -1).forEach((r, d) => {
    css += `.node[data-depth="${d}"]>.node-row .node-text{font-size:${r.fontSize};font-weight:${r.fontWeight};font-family:${r.fontFamily};font-style:${r.fontStyle};color:${r.color};line-height:${r.lineHeight};${extras(r)}}\n`;
    if (r.topMargin && r.topMargin !== '0') {
      css += `.node[data-depth="${d}"]>.node-row{margin-top:${r.topMargin};}\n`;
    }
  });
  let styleEl = document.getElementById('rules-style');
  if (!styleEl) {
    styleEl = document.createElement('style');
    styleEl.id = 'rules-style';
    document.head.appendChild(styleEl);
  }
  styleEl.textContent = css;
}

// ── localStorage persistence ──────────────────────────────
const STORAGE_KEY = 'outliner_state';
let saveTimer = null;

function saveState() {
  if (readOnly) return; // never overwrite saved state with a read-only URL view
  try {
    const state = {
      title:          document.getElementById('doc-title').value,
      meta:           { ...meta },
      root:           serializeNode(root),
      expansionState: calcExpansionState(root),
      lastCursor:     focusedId ? calcLastCursor(root, focusedId) : 1,
      vertScrollState: calcVertScrollState(root),
      fileName:       fileName,
      dirty:          dirty,
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch(e) { console.log('saveState error:', e); }
}

function saveStateSoon() {
  // Debounce -- save 1s after last change
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 1000);
}

function serializeNode(node) {
  return {
    id:        node.id,
    text:      node.text,
    collapsed: node.collapsed,
    children:  node.children.map(serializeNode),
  };
}

function deserializeNode(obj) {
  // Restore node, reusing saved ids so expansionState lines up
  const node = { id: obj.id, text: obj.text || '', collapsed: obj.collapsed || false, children: [] };
  if (obj.id >= idCounter) idCounter = obj.id + 1;
  node.children = (obj.children || []).map(deserializeNode);
  return node;
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const state = JSON.parse(raw);
    document.getElementById('doc-title').value = state.title || 'Untitled';
    if (state.meta) {
      meta.dateCreated  = state.meta.dateCreated  || meta.dateCreated;
      meta.dateModified = state.meta.dateModified || meta.dateModified;
      meta.ownerName    = state.meta.ownerName    || '';
      meta.ownerEmail   = state.meta.ownerEmail   || '';
      meta.rev          = state.meta.rev          || 0;
      refreshMetaUI();
    }
    idCounter = 0;
    root = { id: 0, text: '__root__', children: (state.root.children || []).map(deserializeNode), collapsed: false };
    fileName = state.fileName || '';
    dirty = !!state.dirty;
    updateFileChip();
    applyExpansionState(root, state.expansionState || '');
    // lastCursor and vertScrollState are applied after render() in init
    return { lastCursor: state.lastCursor || 1, vertScrollState: state.vertScrollState || 1 };
  } catch(e) {
    console.log('loadState error:', e);
    return false;
  }
}

// ── Init ──────────────────────────────────────────────────────────────────────
// ── UI preferences (theme + lettering) ───────────────────────────────
const UI_KEY = 'outliner_ui';
let ui = { theme: 'auto', lettering: 'standard' };
try { Object.assign(ui, JSON.parse(localStorage.getItem(UI_KEY)) || {}); } catch (e) {}

function saveUI() { try { localStorage.setItem(UI_KEY, JSON.stringify(ui)); } catch (e) {} }

const THEME_LABELS = { auto: '\u25D0 Auto', light: '\u25D0 Vellum', dark: '\u25D0 Blueprint' };

function applyTheme() {
  if (ui.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = ui.theme;
  const b = document.getElementById('btn-theme');
  if (b) b.textContent = THEME_LABELS[ui.theme] || THEME_LABELS.auto;
}

function cycleTheme() {
  ui.theme = ui.theme === 'auto' ? 'light' : ui.theme === 'light' ? 'dark' : 'auto';
  applyTheme(); saveUI();
  msg('Theme: ' + (ui.theme === 'auto' ? 'follows system' : ui.theme === 'light' ? 'Vellum' : 'Blueprint'));
}

function applyLettering() {
  document.body.classList.toggle('lettering-draft', ui.lettering === 'draft');
  const b = document.getElementById('btn-lettering');
  if (b) b.textContent = ui.lettering === 'draft' ? 'Aa Drafting' : 'Aa Standard';
  applyRules();
}

function toggleLettering() {
  ui.lettering = ui.lettering === 'draft' ? 'standard' : 'draft';
  applyLettering(); saveUI();
  msg('Lettering: ' + (ui.lettering === 'draft' ? 'Drafting (Leroy)' : 'Standard'));
}


buildDocsPanel();
refreshMetaUI();
applyTheme();
applyLettering();

// ── Toolbar + keyboard wiring ─────────────────────────────────────────
const wire = (id, fn) => { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); };
wire('btn-new',    () => doNew());
wire('btn-open',   () => doOpen());
wire('btn-save',   () => doSave(false));
wire('btn-saveas', () => doSave(true));
wire('btn-undo',   () => undo());
wire('btn-redo',   () => redo());
wire('btn-indent',  () => indentSelected());
wire('btn-outdent', () => outdentSelected());
wire('btn-up',      () => moveUp());
wire('btn-down',    () => moveDown());
wire('btn-collapse',() => collapseAll());
wire('btn-expand',  () => expandAll());
wire('btn-hoist',   () => hoistSelected());
wire('btn-export-opml', () => exportOPML());
wire('btn-dehoist', () => dehoist());
wire('docs-toggle-btn', () => toggleDocs());
wire('btn-theme', () => cycleTheme());
wire('btn-lettering', () => toggleLettering());
wire('tb-toggle', () => {
  const tb = document.getElementById('title-block');
  const collapsed = tb.classList.toggle('collapsed');
  const t = document.getElementById('tb-toggle');
  t.textContent = collapsed ? '\u25B4' : '\u25BE';
  t.title = collapsed ? 'Expand title block' : 'Collapse title block';
  t.setAttribute('aria-expanded', String(!collapsed));
});
wire('docs-close-btn',  () => toggleDocs());
document.getElementById('file-input').addEventListener('change', handleFileInput);

window.addEventListener('keydown', e => {
  const cmd = e.metaKey || e.ctrlKey;
  if (!cmd) return;
  const k = e.key.toLowerCase();
  if (k === 's') { e.preventDefault(); doSave(e.shiftKey); }
  else if (k === 'o') { e.preventDefault(); doOpen(); }
  else if (k === 'z') {
    if (e.target.tagName === 'INPUT') return; // native undo in title/meta fields
    e.preventDefault();
    if (e.shiftKey) redo(); else undo();
  }
  else if (k === 'y') {
    if (e.target.tagName === 'INPUT') return;
    e.preventDefault(); redo();
  }
});

window.addEventListener('beforeunload', e => {
  if (dirty && fileHandle) { e.preventDefault(); e.returnValue = ''; }
});

const urlParam = new URLSearchParams(window.location.search).get('url');
if (urlParam) {
  setReadOnly(urlParam);
  msg('Loading\u2026');
  fetch(urlParam)
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(text => {
      const trimmed = text.trim();
      if (trimmed.startsWith('{')) {
        loadDocJSON(JSON.parse(trimmed), urlParam.split('/').pop());
      } else {
        loadOPMLText(text, urlParam.split('/').pop());
      }
      msg('Loaded: ' + urlParam.split('/').pop());
    })
    .catch(err => msg('Failed to load: ' + err.message));
} else {
  idbGetHandle().then(h => {
    if (h && h.name && !fileHandle) { fileHandle = h; if (!fileName) { fileName = h.name; updateFileChip(); } }
  });
  const restored = loadState();
  if (!restored) {
    root.children = [makeNode('')];
    render();
    setTimeout(() => { if (root.children.length) focusNode(root.children[0].id); }, 50);
  } else {
    render();
    setTimeout(() => {
      // Restore scroll position first, then cursor
      applyVertScrollState(root, restored.vertScrollState);
      const cursorId = nodeIdAtLine(root, restored.lastCursor);
      if (cursorId) focusNode(cursorId);
      else if (root.children.length) focusNode(root.children[0].id);
    }, 50);
  }
}
</script>
