<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Process Improvement Frameworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Sora:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
/* House style. Layout idea: a plain left-aligned masthead, then a single readable column of bordered panels. */
:root{
  --bg:#f5f6f8; --surface:#ffffff; --ink:#1a2233; --muted:#5a6578; --line:#d9dee7;
  --brand:#1f4fd1; --brand-ink:#ffffff; --brand-soft:#e7edfc;
  --warm:#a85605; --warm-soft:#fdf1df;
  --good:#1a7f4b; --good-soft:#e3f4ea; --bad:#b3261e; --bad-soft:#fbe9e7;
  --display:"Sora","Trebuchet MS",Verdana,sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"JetBrains Mono",Consolas,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10151f; --surface:#19202d; --ink:#e8ecf3; --muted:#9aa6ba; --line:#2b3547;
    --brand:#8aa8ff; --brand-ink:#0d1530; --brand-soft:#1e2a4a;
    --warm:#f0b35a; --warm-soft:#3a2c14;
    --good:#5fd08f; --good-soft:#143524; --bad:#ff8a80; --bad-soft:#40201d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10151f; --surface:#19202d; --ink:#e8ecf3; --muted:#9aa6ba; --line:#2b3547;
  --brand:#8aa8ff; --brand-ink:#0d1530; --brand-soft:#1e2a4a;
  --warm:#f0b35a; --warm-soft:#3a2c14;
  --good:#5fd08f; --good-soft:#143524; --bad:#ff8a80; --bad-soft:#40201d;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 18px 56px}
a{color:var(--brand)}
:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--display);line-height:1.2;text-wrap:balance;margin:0 0 10px}
h1{font-size:clamp(28px,4.6vw,44px);font-weight:700}
h2{font-size:clamp(21px,2.8vw,27px);font-weight:600}
h3{font-size:18px;font-weight:600}
h4{font-size:16px;font-weight:600}
p{margin:0 0 12px}
ul,ol{margin:0 0 12px;padding-left:22px}
li{margin-bottom:5px}
code,.mono{font-family:var(--mono);font-size:.9em}
code{background:var(--brand-soft);padding:1px 5px;border-radius:4px}

.masthead{padding:34px 0 22px;border-bottom:1px solid var(--line);margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:12.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin:0 0 8px}
.lede{font-size:19px;color:var(--muted);max-width:64ch;margin:0}
.asof{display:inline-block;margin-top:14px;font-size:14px;color:var(--warm);background:var(--warm-soft);border-radius:6px;padding:4px 10px}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}
.panel>h2{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:16px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
.card.soft{background:var(--bg)}
.note{border-left:4px solid var(--brand);background:var(--brand-soft);border-radius:0 8px 8px 0;padding:14px 16px;margin:14px 0}
.note.warm{border-color:var(--warm);background:var(--warm-soft)}
.note.good{border-color:var(--good);background:var(--good-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.note>:last-child,.card>:last-child,.panel>:last-child{margin-bottom:0}
.muted{color:var(--muted)}
.small{font-size:14.5px}

.btn{font:inherit;font-weight:600;font-size:15.5px;border-radius:8px;border:1px solid var(--brand);background:var(--brand);color:var(--brand-ink);padding:9px 16px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--brand)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"],.btn.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.chip{display:inline-block;font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:2px 9px;background:var(--brand-soft);color:var(--brand)}
.chip.warm{background:var(--warm-soft);color:var(--warm)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

label{display:block;font-weight:600;font-size:15px;margin-bottom:4px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-bottom:12px}

.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15.5px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.stat .k{font-size:13.5px;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.v.bad{color:var(--bad)} .v.good{color:var(--good)}

.meter{height:14px;background:var(--line);border-radius:999px;overflow:hidden}
.meter>i{display:block;height:100%;background:var(--brand);border-radius:999px;width:0;transition:width .3s}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.out{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
footer.foot{color:var(--muted);font-size:14px;border-top:1px solid var(--line);padding-top:16px;margin-top:26px}
@media (max-width:520px){body{font-size:16px}.panel{padding:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
@media print{body{background:#fff}.noprint{display:none!important}.panel{break-inside:avoid}}

.fw{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:18px}
.fw button{font:inherit;text-align:left;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--brand);border-radius:10px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.fw button[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.fw .n{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.fw b{font-family:var(--display);font-size:18px}
.fw .goal{font-size:15px}
.fw .best{font-size:14.5px;color:var(--muted)}
.fw .open{font-size:14px;font-weight:600;color:var(--brand)}
/* lesson content keeps its original class names */
.lesson-header{border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px}
.lesson-title{font-size:clamp(22px,3vw,28px);margin-bottom:4px}
.lesson-header p{color:var(--muted);margin:0}
.lesson-section{margin-bottom:20px;max-width:72ch}
.lesson-section h3{color:var(--brand)}
.example-box{border-left:4px solid var(--good);background:var(--good-soft);border-radius:0 8px 8px 0;padding:14px 16px;margin:0 0 20px;max-width:72ch}
.example-box h4{color:var(--good)}
.example-box p:last-child{margin-bottom:0}
#lesson[hidden]{display:none}
#lesson{scroll-margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Process and systems</p>
    <h1>Process Improvement Frameworks</h1>
    <p class="lede">Six widely used ways to make a process better. Choose one to open its lesson: what it is, the steps, a real example, and when to use it.</p>
  </header>

  <div class="fw" id="cards"></div>

  <section class="panel" id="lesson" hidden tabindex="-1">
    <div id="lessonBody"></div>
    <div class="row noprint"><button class="btn quiet" id="prevBtn">Previous framework</button><button class="btn quiet" id="nextBtn">Next framework</button><button class="btn ghost" id="closeBtn">Back to all frameworks</button></div>
  </section>

  <section class="panel">
    <h2>Which one fits?</h2>
    <div class="tablewrap"><table><thead><tr><th>Framework</th><th>Goal</th><th>Best for</th></tr></thead><tbody id="compare"></tbody></table></div>
  </section>
</div>

<script>
const FRAMEWORKS = [
  { key:"sixSigma", name:"Six Sigma", goal:"Reduce defects by minimizing variation in quality", best:"Processes where defects affect quality or safety" },
  { key:"toc", name:"Theory of Constraints", goal:"Remove bottlenecks to improve the whole system", best:"Complex systems with interdependent steps" },
  { key:"fiveWhys", name:"The 5 Whys", goal:"Find the root cause by asking \"Why?\" repeatedly", best:"Digging beneath a problem's symptoms" },
  { key:"lean", name:"Lean", goal:"Eliminate waste, streamline the flow, and add value", best:"Outdated or inefficient processes" },
  { key:"bpr", name:"Business Process Reengineering", goal:"Radically redesign a process for quality, speed or cost", best:"Major overhauls that fix core problems" },
  { key:"tqm", name:"Total Quality Management", goal:"Improve quality through customer focus and employee involvement", best:"Processes that directly affect customer satisfaction" }
];

const lessons = {
            sixSigma: {
                title: "Six Sigma",
                content: `
                    <div class="lesson-header">
                        <h2 class="lesson-title">Six Sigma</h2>
                        <p><em>Quality defect reduction by minimizing variability</em></p>
                    </div>
                    
                    <div class="lesson-section">
                        <h3>What is Six Sigma?</h3>
                        <p>Six Sigma is a data-driven methodology focused on eliminating defects and reducing process variability. The goal is to achieve near-perfect quality by reducing defects to 3.4 per million opportunities.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>The DMAIC Method</h3>
                        <ol class="lesson-list">
                            <li><strong>Define:</strong> Clearly define the problem and project goals</li>
                            <li><strong>Measure & Quantify:</strong> Collect baseline data and establish metrics</li>
                            <li><strong>Analyze:</strong> Identify root causes of defects and variations</li>
                            <li><strong>Improve & Test:</strong> Develop and test solutions</li>
                            <li><strong>Control & Maintain:</strong> Implement controls to sustain improvements</li>
                        </ol>
                    </div>

                    <div class="lesson-section">
                        <h3>Key Principles</h3>
                        <ul class="lesson-list">
                            <li>Focus on customer requirements and satisfaction</li>
                            <li>Use data and statistical analysis for decision making</li>
                            <li>Systematic approach to problem solving</li>
                            <li>Involve people from all levels of organization</li>
                            <li>Be proactive and persistent in improvement efforts</li>
                        </ul>
                    </div>

                    <div class="example-box">
                        <h4>Real-World Example</h4>
                        <p>A manufacturing company used Six Sigma to reduce defects in their smartphone assembly line. By applying DMAIC, they identified that 80% of defects came from inconsistent component placement. After implementing automated placement systems and training operators, defects dropped from 2,300 per million to 340 per million opportunities.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>When to Use Six Sigma</h3>
                        <ul class="lesson-list">
                            <li>Processes with measurable defects or errors</li>
                            <li>Quality issues that impact customer satisfaction</li>
                            <li>Safety-critical processes</li>
                            <li>When you have sufficient data for statistical analysis</li>
                            <li>Long-term improvement projects</li>
                        </ul>
                    </div>
                `
            },
            toc: {
                title: "Theory of Constraints (TOC)",
                content: `
                    <div class="lesson-header">
                        <h2 class="lesson-title">Theory of Constraints (TOC)</h2>
                        <p><em>Eliminate bottlenecks to improve system performance</em></p>
                    </div>
                    
                    <div class="lesson-section">
                        <h3>What is Theory of Constraints?</h3>
                        <p>TOC is based on the principle that every system has at least one constraint (bottleneck) that limits its performance. By identifying and addressing these constraints, you can dramatically improve overall system throughput.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>The TOC Process</h3>
                        <ol class="lesson-list">
                            <li><strong>Identify:</strong> Find the weakest link in your system</li>
                            <li><strong>Exploit & Improve:</strong> Maximize the efficiency of the constraint</li>
                            <li><strong>Subordinate:</strong> Align all other processes to support the constraint</li>
                            <li><strong>Elevate:</strong> If needed, add resources to overcome the constraint</li>
                            <li><strong>Repeat:</strong> Once resolved, find the next constraint</li>
                        </ol>
                    </div>

                    <div class="lesson-section">
                        <h3>Key Insights</h3>
                        <ul class="lesson-list">
                            <li>A chain is only as strong as its weakest link</li>
                            <li>Focus improvement efforts where they'll have maximum impact</li>
                            <li>Non-constraint improvements may not improve overall performance</li>
                            <li>Constraints often shift as you resolve them</li>
                        </ul>
                    </div>

                    <div class="example-box">
                        <h4>Real-World Example</h4>
                        <p>A restaurant identified that their kitchen's grill station was the constraint, causing long wait times. Instead of hiring more servers, they focused on the grill: added a second grill, pre-cooked popular items, and streamlined the grill workflow. Customer wait times dropped by 40% without increasing overall staff.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>When to Use TOC</h3>
                        <ul class="lesson-list">
                            <li>Complex systems with multiple interdependent processes</li>
                            <li>When you need to maximize throughput</li>
                            <li>Systems with clear performance bottlenecks</li>
                            <li>Resource allocation decisions</li>
                            <li>Supply chain optimization</li>
                        </ul>
                    </div>
                `
            },
            fiveWhys: {
                title: "The 5 Why's",
                content: `
                    <div class="lesson-header">
                        <h2 class="lesson-title">The 5 Why's</h2>
                        <p><em>Find the root cause by asking "Why?" multiple times</em></p>
                    </div>
                    
                    <div class="lesson-section">
                        <h3>What is the 5 Why's?</h3>
                        <p>The 5 Why's is a simple but powerful technique for root cause analysis. By repeatedly asking "Why?" (typically five times), you can drill down from a surface-level problem to its underlying root cause.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>How to Apply the 5 Why's</h3>
                        <ol class="lesson-list">
                            <li><strong>State the Problem:</strong> Clearly define what went wrong</li>
                            <li><strong>Ask "Why?":</strong> Why did this problem occur?</li>
                            <li><strong>Ask "Why?" Again:</strong> For each answer, ask why that happened</li>
                            <li><strong>Continue:</strong> Keep asking until you reach the root cause</li>
                            <li><strong>Address the Root:</strong> Focus solutions on the fundamental cause</li>
                        </ol>
                    </div>

                    <div class="example-box">
                        <h4>Classic Example: Machine Breakdown</h4>
                        <p><strong>Problem:</strong> The machine stopped working.</p>
                        <p><strong>Why?</strong> The motor overheated.</p>
                        <p><strong>Why?</strong> There wasn't enough lubrication.</p>
                        <p><strong>Why?</strong> The lubrication pump wasn't working properly.</p>
                        <p><strong>Why?</strong> The pump's filter was clogged with debris.</p>
                        <p><strong>Why?</strong> There's no regular maintenance schedule for the filter.</p>
                        <p><strong>Solution:</strong> Implement a preventive maintenance schedule for filter cleaning.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>Best Practices</h3>
                        <ul class="lesson-list">
                            <li>Focus on processes and systems, not people</li>
                            <li>Base answers on facts, not assumptions</li>
                            <li>Sometimes you need more or fewer than 5 "why's"</li>
                            <li>Involve people who understand the process</li>
                            <li>Document the analysis for future reference</li>
                        </ul>
                    </div>

                    <div class="lesson-section">
                        <h3>When to Use the 5 Why's</h3>
                        <ul class="lesson-list">
                            <li>Simple to moderately complex problems</li>
                            <li>When symptoms keep recurring</li>
                            <li>Quick root cause analysis needed</li>
                            <li>Team problem-solving sessions</li>
                            <li>Incident investigations</li>
                        </ul>
                    </div>
                `
            },
            lean: {
                title: "Lean",
                content: `
                    <div class="lesson-header">
                        <h2 class="lesson-title">Lean</h2>
                        <p><em>Eliminate waste, streamline processes, and add value</em></p>
                    </div>
                    
                    <div class="lesson-section">
                        <h3>What is Lean?</h3>
                        <p>Lean is a methodology focused on creating maximum value for customers while minimizing waste. It originated from Toyota's production system and emphasizes continuous improvement (Kaizen) and respect for people.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>The Lean Process</h3>
                        <ol class="lesson-list">
                            <li><strong>Identify Value:</strong> Define what customers actually value</li>
                            <li><strong>Map the Value Stream:</strong> Visualize all steps in the process</li>
                            <li><strong>Create Flow:</strong> Eliminate interruptions and bottlenecks</li>
                            <li><strong>Establish Pull:</strong> Produce only what customers demand</li>
                            <li><strong>Continuous Improvement:</strong> Pursue perfection through Kaizen</li>
                        </ol>
                    </div>

                    <div class="lesson-section">
                        <h3>The 8 Types of Waste (TIMWOODS)</h3>
                        <ul class="lesson-list">
                            <li><strong>Transport:</strong> Unnecessary movement of materials</li>
                            <li><strong>Inventory:</strong> Excess stock or work-in-progress</li>
                            <li><strong>Motion:</strong> Unnecessary human movement</li>
                            <li><strong>Waiting:</strong> Idle time in processes</li>
                            <li><strong>Overproduction:</strong> Making more than needed</li>
                            <li><strong>Over-processing:</strong> Doing more work than required</li>
                            <li><strong>Defects:</strong> Errors requiring rework</li>
                            <li><strong>Skills:</strong> Underutilizing human potential</li>
                        </ul>
                    </div>

                    <div class="example-box">
                        <h4>Real-World Example</h4>
                        <p>A hospital applied Lean to their emergency room. They identified waste in patient flow: patients waited because nurses walked long distances for supplies. Solution: Created mobile supply carts and reorganized the layout. Result: 30% reduction in patient wait times and improved staff satisfaction.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>Key Lean Tools</h3>
                        <ul class="lesson-list">
                            <li><strong>5S:</strong> Sort, Set in order, Shine, Standardize, Sustain</li>
                            <li><strong>Value Stream Mapping:</strong> Visual representation of process flow</li>
                            <li><strong>Kanban:</strong> Visual workflow management</li>
                            <li><strong>Poka-Yoke:</strong> Error-proofing mechanisms</li>
                            <li><strong>Gemba Walking:</strong> Going to where work happens</li>
                        </ul>
                    </div>

                    <div class="lesson-section">
                        <h3>When to Use Lean</h3>
                        <ul class="lesson-list">
                            <li>Processes with visible waste and inefficiencies</li>
                            <li>Repetitive or routine operations</li>
                            <li>When customer value needs clarification</li>
                            <li>Organizations ready for cultural change</li>
                            <li>Need for incremental, continuous improvement</li>
                        </ul>
                    </div>
                `
            },
            bpr: {
                title: "Business Process Reengineering",
                content: `
                    <div class="lesson-header">
                        <h2 class="lesson-title">Business Process Reengineering (BPR)</h2>
                        <p><em>Radically redesign processes to improve quality, speed, or cost</em></p>
                    </div>
                    
                    <div class="lesson-section">
                        <h3>What is BPR?</h3>
                        <p>BPR involves completely rethinking and radically redesigning business processes to achieve dramatic improvements in performance, cost, quality, and speed. Unlike incremental improvements, BPR starts with a "clean slate" approach.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>The BPR Process</h3>
                        <ol class="lesson-list">
                            <li><strong>Define & Analyze:</strong> Understand current processes and performance</li>
                            <li><strong>Vision:</strong> Create a vision for the new process</li>
                            <li><strong>Identify Improvements:</strong> Find opportunities for radical change</li>
                            <li><strong>Design & Implement:</strong> Create and roll out new processes</li>
                            <li><strong>Monitor:</strong> Track performance and adjust as needed</li>
                        </ol>
                    </div>

                    <div class="lesson-section">
                        <h3>Key Principles of BPR</h3>
                        <ul class="lesson-list">
                            <li>Challenge fundamental assumptions about how work is done</li>
                            <li>Focus on outcomes, not activities</li>
                            <li>Leverage technology as an enabler</li>
                            <li>Organize around processes, not functions</li>
                            <li>Empower people who perform the work</li>
                            <li>Capture information once at its source</li>
                        </ul>
                    </div>

                    <div class="example-box">
                        <h4>Real-World Example</h4>
                        <p>Ford Motor Company reengineered their accounts payable process. The old process involved 500 people handling paper invoices across multiple departments. They redesigned it around a digital system where receiving directly triggers payment, eliminating the need for traditional invoicing. Result: 75% reduction in staff needed and faster payment processing.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>BPR Challenges</h3>
                        <ul class="lesson-list">
                            <li>High risk and resource intensive</li>
                            <li>Requires strong leadership commitment</li>
                            <li>Can face significant employee resistance</li>
                            <li>May disrupt operations during transition</li>
                            <li>Success depends on proper change management</li>
                        </ul>
                    </div>

                    <div class="lesson-section">
                        <h3>When to Use BPR</h3>
                        <ul class="lesson-list">
                            <li>Processes are fundamentally broken or outdated</li>
                            <li>Incremental improvements aren't sufficient</li>
                            <li>Major competitive or operational crisis</li>
                            <li>New technology enables different approaches</li>
                            <li>Organization is ready for significant change</li>
                        </ul>
                    </div>
                `
            },
            tqm: {
                title: "Total Quality Management",
                content: `
                    <div class="lesson-header">
                        <h2 class="lesson-title">Total Quality Management (TQM)</h2>
                        <p><em>Improve quality through customer focus, employee involvement, and continuous improvement</em></p>
                    </div>
                    
                    <div class="lesson-section">
                        <h3>What is TQM?</h3>
                        <p>TQM is a management philosophy that involves all members of an organization in continually improving processes, products, services, and workplace culture to achieve customer satisfaction and business success.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>The TQM Process</h3>
                        <ol class="lesson-list">
                            <li><strong>Customer-Focused:</strong> Understand and exceed customer expectations</li>
                            <li><strong>Employee Involvement:</strong> Engage all employees in quality efforts</li>
                            <li><strong>Process Improvement:</strong> Continuously improve all processes</li>
                            <li><strong>Fact-Based Decisions:</strong> Use data to guide improvement efforts</li>
                            <li><strong>Continuous Improvement:</strong> Never stop improving quality</li>
                        </ol>
                    </div>

                    <div class="lesson-section">
                        <h3>Core Principles of TQM</h3>
                        <ul class="lesson-list">
                            <li><strong>Customer Focus:</strong> Quality is defined by customer satisfaction</li>
                            <li><strong>Total Employee Commitment:</strong> Everyone is responsible for quality</li>
                            <li><strong>Process Approach:</strong> Focus on improving processes, not just outcomes</li>
                            <li><strong>Integrated System:</strong> All departments work together</li>
                            <li><strong>Strategic Approach:</strong> Quality is part of business strategy</li>
                            <li><strong>Decision Making:</strong> Based on facts and data</li>
                            <li><strong>Communications:</strong> Open and honest throughout organization</li>
                        </ul>
                    </div>

                    <div class="example-box">
                        <h4>Real-World Example</h4>
                        <p>Southwest Airlines implemented TQM by focusing on customer satisfaction (on-time performance, low fares), employee empowerment (letting staff solve problems on the spot), and continuous improvement (regular feedback loops). This approach helped them become one of the most successful and profitable airlines in the industry.</p>
                    </div>

                    <div class="lesson-section">
                        <h3>TQM Tools and Techniques</h3>
                        <ul class="lesson-list">
                            <li>Quality circles and improvement teams</li>
                            <li>Statistical process control</li>
                            <li>Benchmarking against best practices</li>
                            <li>Customer satisfaction surveys</li>
                            <li>Employee suggestion systems</li>
                            <li>Quality audits and assessments</li>
                        </ul>
                    </div>

                    <div class="lesson-section">
                        <h3>When to Use TQM</h3>
                        <ul class="lesson-list">
                            <li>Organization-wide quality improvement needed</li>
                            <li>Customer satisfaction is declining</li>
                            <li>Building a quality-focused culture</li>
                            <li>Long-term strategic quality improvement</li>
                            <li>When you have leadership commitment for change</li>
                        </ul>
                    </div>
                `
            }
        };

const $ = id => document.getElementById(id);
let open = -1;
$("cards").innerHTML = FRAMEWORKS.map((f, i) => `<button data-i="${i}" aria-pressed="false"><span class="n">${i + 1} of ${FRAMEWORKS.length}</span><b>${f.name}</b><span class="goal"><strong>Goal:</strong> ${f.goal}</span><span class="best"><strong>Best for:</strong> ${f.best}</span><span class="open">Open lesson</span></button>`).join("");
$("compare").innerHTML = FRAMEWORKS.map(f => `<tr><td><strong>${f.name}</strong></td><td>${f.goal}</td><td>${f.best}</td></tr>`).join("");

function show(i) {
  open = (i + FRAMEWORKS.length) % FRAMEWORKS.length;
  $("lessonBody").innerHTML = lessons[FRAMEWORKS[open].key].content;
  $("lesson").hidden = false;
  document.querySelectorAll("#cards button").forEach((b, k) => b.setAttribute("aria-pressed", String(k === open)));
  $("lesson").scrollIntoView({ block:"start" });
  $("lesson").focus({ preventScroll:true });
}
function hide() {
  const was = open; open = -1; $("lesson").hidden = true;
  document.querySelectorAll("#cards button").forEach(b => b.setAttribute("aria-pressed", "false"));
  const b = document.querySelectorAll("#cards button")[was]; if (b) b.focus();
}
$("cards").addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) show(+b.dataset.i); });
$("prevBtn").addEventListener("click", () => show(open - 1));
$("nextBtn").addEventListener("click", () => show(open + 1));
$("closeBtn").addEventListener("click", hide);
document.addEventListener("keydown", e => { if (e.key === "Escape" && open >= 0) hide(); });
</script>
